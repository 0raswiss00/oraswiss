<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofertat e Marra - OraSwiss</title>
    <style>
        body { background: #0b0b0b; color: #fff; font-family: sans-serif; margin: 0; padding-bottom: 70px; }
        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }
        h2 { border-bottom: 1px solid #333; padding-bottom: 10px; }
        .offer-card { background: #1a1a1a; padding: 15px; border-radius: 8px; border: 1px solid #333; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #111; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #333; z-index: 1000; }
        .bottom-nav-item { color: #aaa; text-decoration: none; font-size: 12px; text-align: center; }
        .bottom-nav-item:hover, .bottom-nav-item.active { color: #fff; }
        .btn-chat { background: #25D366; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Ofertat e Marra</h2>
        <div id="seller-offers-list" style="color: #aaa; margin-top: 20px;">Duke ngarkuar ofertat...</div>
    </div>

    <!-- Shiriti i poshtëm i navigimit -->
    <nav class="bottom-nav">
      <a href="index.html" class="bottom-nav-item">OraSwiss</a>
      <a href="profile.html" class="bottom-nav-item">Profile</a>
      <a href="favorites.html" class="bottom-nav-item">Favorites</a>
      <a href="collection.html" class="bottom-nav-item">Collection</a>
      <a href="mysales.html" class="bottom-nav-item">Sales</a>
      <a href="offers.html" class="bottom-nav-item active">Offers</a>
      <a href="sellnow.html" class="bottom-nav-item">Sell</a>
    </nav>

    <!-- Supabase Logic -->
    <script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm";

const supabase = createClient(
    "https://gnwsrmelmeqduhhmfmoa.supabase.co",
    "sb_publishable__AkK_Z7lhtkvukN6Fy1cAQ_KBTXIcY9"
);

async function loadSellerOffers() {

    const container = document.getElementById("seller-offers-list");

    if (!container) return;

    const { data: { user }, error: userError } = await supabase.auth.getUser();

    if (userError || !user) {
        container.innerHTML = "Ju duhet të jeni të loguar.";
        return;
    }

    const { data: offers, error } = await supabase
        .from("offers")
        .select("*")
        .eq("seller_id", user.id)
        .order("created_at", { ascending: false });

    console.log("User:", user.id);
    console.log("Offers:", offers);
    console.log("Error:", error);

    if (error) {
        container.innerHTML = "Gabim: " + error.message;
        return;
    }

    if (!offers || offers.length === 0) {
        container.innerHTML = "<p style='color:#888'>Nuk ka oferta të marra.</p>";
        return;
    }

    Çmimi i ofruar: 4 €

        } else if (offer.status === "accepted") {

            actionButtons = `
                <span style="color:#2ecc71;font-weight:bold;">
                    Oferta u pranua ✓
                </span>

                <button class="pay-btn">
                    Paguaj Tani 💳
                </button>
            `;

        } else if (offer.status === "rejected") {

            actionButtons = `
                <span style="color:#e74c3c;font-weight:bold;">
                    Oferta u refuzua ✗
                </span>
            `;

        } else if (offer.status === "countered") {

            actionButtons = `
                <button class="btn-action"
                    data-id="${offer.id}"
                    data-status="accepted">
                    Prano kundërofertën
                </button>

                <button class="btn-action"
                    data-id="${offer.id}"
                    data-status="rejected">
                    Refuzo
                </button>

                <button class="btn-action"
                    data-id="${offer.id}"
                    data-status="countered">
                    Kundërofertë tjetër
                </button>
            `;

        } else {

            actionButtons = `
                <span style="color:#e74c3c;font-weight:bold;">
                    Oferta u refuzua ✗
                </span>
            `;

        }
        html += `
            <div class="offer-card">
                <div>
                    <p><b>Çmimi:</b> ${offer.offered_price} €</p>
                    <p>Statusi:
                        <span>${offer.status}</span>
                    </p>
                </div>

                <div>
                    ${actionButtons}
                </div>
            </div>
        `;
    });

    container.innerHTML = html;

    document.querySelectorAll(".btn-action").forEach(btn => {
        btn.addEventListener("click", async () => {
            await updateOfferStatus(
                btn.dataset.id,
                btn.dataset.status
            );
        });
    });

}

async function updateOfferStatus(offerId, newStatus) {

    if (newStatus === "countered") {

        const amount = prompt("Shkruaj kundërofertën (€):");

        if (!amount) return;

        if (isNaN(amount) || Number(amount) <= 0) {
            alert("Shkruaj një çmim të vlefshëm.");
            return;
        }

        const { error } = await supabase
            .from("offers")
            .update({
                status: "countered",
                counter_offer: Number(amount),
                last_offer_by: "seller"
            })
            .eq("id", offerId);

        if (error) {
            alert(error.message);
            return;
        }

        alert("Kundëroferta u dërgua.");

    } else {

        const { error } = await supabase
            .from("offers")
            .update({
                status: newStatus,
                last_offer_by: "seller"
            })
            .eq("id", offerId);

        if (error) {
            alert(error.message);
            return;
        }
    }

    loadSellerOffers();
}
document.addEventListener("DOMContentLoaded", () => {
    loadSellerOffers();
});
</script>
        
</body>
</html>
