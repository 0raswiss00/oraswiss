<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Favorites - Ora Swiss</title>

<!-- Supabase & Global Connection -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="db-connect.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px 15px 100px;
    background: #050505;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
}

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 25px;
    border-bottom: 1px solid #1a1a1a;
    padding-bottom: 15px;
}

.header h1 {
    margin: 0;
    font-size: 22px;
    letter-spacing: 0.5px;
}

.back-btn {
    background: #111;
    color: #aaa;
    border: 1px solid #222;
    padding: 8px 14px;
    border-radius: 20px;
    text-decoration: none;
    font-size: 14px;
    transition: all 0.2s;
}

.back-btn:hover {
    background: #222;
    color: #fff;
    border-color: #444;
}

#favorites-container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.favorite-card {
    background: #111;
    border: 1px solid #222;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.2s, border-color 0.2s;
}

.favorite-card:hover {
    transform: translateY(-3px);
    border-color: #444;
}

.favorite-img-wrapper {
    width: 100%;
    height: 160px;
    background: #000;
    position: relative;
    overflow: hidden;
}

.favorite-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.favorite-info {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
}

.favorite-brand {
    font-size: 13px;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.favorite-model {
    font-size: 15px;
    font-weight: bold;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.price {
    color: #25D366;
    font-weight: bold;
    font-size: 16px;
    margin: 4px 0 8px 0;
}

.card-actions {
    display: flex;
    gap: 8px;
    margin-top: auto;
    padding-top: 8px;
    border-top: 1px solid #1a1a1a;
}

.open-btn {
    flex: 1;
    padding: 9px;
    background: #fff;
    color: #000;
    border-radius: 8px;
    text-align: center;
    text-decoration: none;
    font-weight: bold;
    font-size: 13px;
    transition: background 0.2s;
}

.open-btn:hover {
    background: #e0e0e0;
}

.remove-btn {
    flex: 1;
    padding: 9px;
    background: #1a1a1a;
    color: #ff4d4d;
    border: 1px solid #333;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
    transition: background 0.2s;
}

.remove-btn:hover {
    background: #2a1a1a;
    border-color: #ff4d4d;
}

.empty, .loading {
    text-align: center;
    color: #888;
    padding: 60px 20px;
    grid-column: 1 / -1;
    font-size: 15px;
}

.empty h2 {
    color: #fff;
    margin: 15px 0 8px 0;
    font-size: 20px;
}

@media (min-width: 768px) {
    #favorites-container {
        grid-template-columns: repeat(4, 1fr);
    }
    .favorite-img-wrapper {
        height: 190px;
    }
}

.bottom-nav {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 480px;
    height: 55px;
    background: #1a1a1a;
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 0 10px;
    border-radius: 20px;
    border: 1px solid #333;
    box-shadow: 0 5px 20px rgba(0,0,0,.5);
    z-index: 99999;
}

.bottom-nav a {
    color: #fff;
    text-decoration: none;
    font-size: 11px;
    text-align: center;
    flex: 1;
}

.bottom-nav a:hover {
    color: gold;
}
</style>
</head>

<body>

<div class="container">
    <div class="header">
        <h1>⭐ My Favorites</h1>
        <a href="dashboard.html" class="back-btn">← Home</a>
    </div>

    <div id="favorites-container">
        <div class="loading">Loading favorites...</div>
    </div>
</div>

<nav class="bottom-nav">
    <a href="dashboard.html">🏠<br>Home</a>
    <a href="favorites.html">⭐<br>Favs</a>
    <a href="messages.html">✉️<br>Messages</a>
    <a href="mysales.html">📦<br>Sales</a>
    <a href="sellnow.html">➕<br>Sell</a>
</nav>

<script>
document.addEventListener("DOMContentLoaded", async function() {
    await loadFavorites();
});

async function loadFavorites() {
    const container = document.getElementById("favorites-container");

    if (!window.supabaseClient) {
        container.innerHTML = '<div class="empty" style="color: red;">Database connection error.</div>';
        return;
    }

    const { data: { user }, error: userError } = await window.supabaseClient.auth.getUser();

    if (userError || !user) {
        container.innerHTML = `
            <div class="empty">
                <div style="font-size:50px;">⭐</div>
                <h2>Login Required</h2>
                <p>Please login to see your favorites.</p>
                <a href="register.html" class="open-btn" style="display:inline-block; margin-top:15px; max-width:200px;">Login / Register</a>
            </div>
        `;
        return;
    }

    const { data: favorites, error: favoritesError } = await window.supabaseClient
        .from("favorites")
        .select("id, user_id, product_id, product_table")
        .eq("user_id", user.id);

    if (favoritesError) {
        console.error("Favorites error:", favoritesError);
        container.innerHTML = `<div class="empty">⚠️ Error loading favorites: ${escapeHTML(favoritesError.message)}</div>`;
        return;
    }

    if (!favorites || favorites.length === 0) {
        showEmptyFavorites();
        return;
    }

    container.innerHTML = "";

    for (const favorite of favorites) {
        try {
            const productTable = favorite.product_table === "bracelets_straps" ? "bracelets_straps" : "oras";

            const { data: product, error: productError } = await window.supabaseClient
                .from(productTable)
                .select("*")
                .eq("id", favorite.product_id)
                .maybeSingle();

            if (productError || !product) continue;

            const imgUrl = getProductImage(product);
            const brand = product.brand || "Ora Swiss";
            const model = product.model || product.reference || product.type || "";
            const price = product.price !== null && product.price !== undefined ? `${Number(product.price).toLocaleString()} ${product.currency || '€'}` : "";

            const productUrl = productTable === "bracelets_straps" 
                ? `product-details.html?id=${encodeURIComponent(product.id)}&category=bracelets_straps`
                : `product.html?id=${encodeURIComponent(product.id)}`;

            const card = document.createElement("div");
            card.className = "favorite-card";
            card.innerHTML = `
                <div class="favorite-img-wrapper">
                    <img src="${escapeHTML(imgUrl)}" alt="${escapeHTML(brand)}" loading="lazy" onerror="this.onerror=null; this.src='https://placeholder.co/600x400/222/fff?text=No+Image';">
                </div>
                <div class="favorite-info">
                    <div class="favorite-brand">${escapeHTML(brand)}</div>
                    <div class="favorite-model">${escapeHTML(model)}</div>
                    ${price ? `<div class="price">${price}</div>` : ''}
                    <div class="card-actions">
                        <a href="${productUrl}" class="open-btn">View</a>
                        <button class="remove-btn" type="button">Remove</button>
                    </div>
                </div>
            `;

            card.querySelector(".remove-btn").addEventListener("click", async function() {
                await removeFavorite(favorite.id, card, this);
            });

            container.appendChild(card);
        } catch (err) {
            console.error("Card rendering error:", err);
        }
    }

    if (container.children.length === 0) {
        showEmptyFavorites();
    }
}

function getProductImage(product) {
    const placeholder = "https://placeholder.co/600x400/222/fff?text=No+Image";
    let image = null;

    if (product.image_url) {
        image = Array.isArray(product.image_url) ? product.image_url.find(i => i && typeof i === "string") : product.image_url;
    }
    if (!image && product.image) {
        image = Array.isArray(product.image) ? product.image[0] : product.image;
    }
    if (!image && product.photos) {
        if (Array.isArray(product.photos)) {
            image = product.photos[0];
        } else {
            try {
                const parsed = JSON.parse(product.photos);
                image = Array.isArray(parsed) ? parsed[0] : product.photos;
            } catch {
                image = product.photos;
            }
        }
    }

    if (!image || image === "null" || image === "undefined") return placeholder;
    image = String(image).trim();
    if (!image) return placeholder;

    if (image.startsWith("http://") || image.startsWith("https://")) return image;

    return "https://gnwsrmelmeqduhhmfmoa.supabase.co/storage/v1/object/public/or-images/" + image.replace(/^\/+/, "");
}

async function removeFavorite(favoriteId, card, button) {
    button.disabled = true;
    button.innerText = "...";

    const { data: { user } } = await window.supabaseClient.auth.getUser();
    if (!user) {
        alert("Please login again.");
        button.disabled = false;
        button.innerText = "Remove";
        return;
    }

    const { error } = await window.supabaseClient
        .from("favorites")
        .delete()
        .eq("id", favoriteId)
        .eq("user_id", user.id);

    if (error) {
        alert("Could not remove favorite.");
        button.disabled = false;
        button.innerText = "Remove";
        return;
    }

    card.remove();
    const container = document.getElementById("favorites-container");
    if (!container.children.length) {
        showEmptyFavorites();
    }
}

function showEmptyFavorites() {
    document.getElementById("favorites-container").innerHTML = `
        <div class="empty">
            <div style="font-size:50px;">⭐</div>
            <h2>No Favorites Yet</h2>
            <p>When you like a product, it will appear here.</p>
        </div>
    `;
}

function escapeHTML(value) {
    if (value === null || value === undefined) return "";
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
</script>

</body>
</html>
