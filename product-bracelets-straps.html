<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bracelet & Straps - Ora Swiss</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KD2ZZ3MJYY"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-KD2ZZ3MJYY');
   <script>
    async function loadBraceletProduct() {
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        const container = document.getElementById('content-container');

        if (!productId) {
            container.innerHTML = "<h2 style='text-align:center; padding:50px;'>Produkti nuk u gjet!</h2>";
            return;
        }

        // Marrim të dhënat nga tabela e rripave (bracelets_straps) në Supabase
        const { data, error } = await supabaseClient
            .from('bracelets_straps')
            .select('*')
            .eq('id', productId)
            .single();

        if (error || !data) {
            container.innerHTML = "<h2 style='text-align:center; padding:50px;'>Produkti nuk u gjet në databazë!</h2>";
            return;
        }

        // Përgatitja e imazheve
        let images = Array.isArray(data.image_url) ? data.image_url : [data.image_url || 'https://via.placeholder.com/600'];
        let currentImgIdx = 0;

        // Ndërtimi i strukturës HTML të faqes së produktit
        container.innerHTML = `
            <div style="max-width: 900px; margin: auto;">
                
                <!-- Butonat e sipërm (Share & Like) -->
                <div style="display: flex; justify-content: flex-end; gap: 10px; margin: 10px 0;">
                    <button onclick="shareProduct()" style="background: #111; color: #fff; border: 1px solid #333; padding: 8px 14px; border-radius: 20px; cursor: pointer; display: flex; align-items: center; gap: 5px;">🔗 Share</button>
                    <button onclick="toggleLike(this)" style="background: #111; color: #fff; border: 1px solid #333; padding: 8px 14px; border-radius: 20px; cursor: pointer; display: flex; align-items: center; gap: 5px;">♡ Like</button>
                </div>

                <!-- Galeria e Fotos -->
                <div class="gallery-container" id="gallery-box">
                    <button class="gallery-btn prev" onclick="changeImg(-1)">❮</button>
                    <img id="main-img" src="${images[0]}" alt="Product Image">
                    <button class="gallery-btn next" onclick="changeImg(1)">❯</button>
                    <div class="photo-counter" id="photo-counter">1 / ${images.length}</div>
                </div>

                <!-- Titulli dhe Çmimi -->
                <div style="margin-top: 15px;">
                    <div style="font-size: 16px; color: #aaa;">${data.brand || ''}</div>
                    <h1 style="font-size: 28px; margin: 5px 0 15px 0;">${data.model || 'Bracelet / Strap'}</h1>
                    
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div style="font-size: 26px; color: #25D366; font-weight: bold;">${data.price ? data.price + ' €' : 'N/A'}</div>
                        <div style="background: #111; padding: 8px 12px; border-radius: 20px; font-size: 14px; border: 1px solid #333;">🌍 ${data.country || 'International'}</div>
                    </div>
                </div>

                <!-- Kutia e Specifikave (Pa dopio rresht, në një kolonë të rregullt) -->
                <div style="background: #111; border: 1px solid #333; border-radius: 12px; padding: 15px; margin-top: 20px;">
                    <div class="info-row"><span>Type</span><span>${data.type || "N/A"}</span></div>
                    <div class="info-row"><span>Condition</span><span>${data.condition || "N/A"}</span></div>
                    <div class="info-row"><span>Material</span><span>${data.material || "N/A"}</span></div>
                    <div class="info-row"><span>Color</span><span>${data.color || "N/A"}</span></div>
                    <div class="info-row"><span>Reference</span><span>${data.reference || "N/A"}</span></div>
                    <div class="info-row"><span>Year</span><span>${data.year || "N/A"}</span></div>
                    <div class="info-row"><span>Gold Purity</span><span>${data.gold_purity || "N/A"}</span></div>
                    <div class="info-row"><span>Lug Width</span><span>${data.lug_width || "N/A"}</span></div>
                    <div class="info-row"><span>Clasp Width</span><span>${data.clasp_width || "N/A"}</span></div>
                    <div class="info-row" style="border-bottom: none;"><span>Length</span><span>${data.length || "N/A"}</span></div>
                </div>

                <!-- Përshkrimi -->
                <div style="background: #111; border: 1px solid #333; border-radius: 12px; padding: 15px; margin-top: 20px;">
                    <h3 style="margin-top: 0; color: #fff;">Description</h3>
                    <p style="color: #aaa; line-height: 1.5; margin-bottom: 0;">${data.description || "Nuk ka përshkrim."}</p>
                </div>

            </div>

            <!-- Shiriti i Poshtëm i Blerjes -->
            <div class="bottom-nav">
                <a href="https://wa.me/?text=Përshëndetje, jam i interesuar për: ${data.brand} ${data.model} (${data.price}€)" target="_blank" style="background:#25D366 !important; border-radius:10px !important; justify-content:center !important; font-weight:bold !important; font-size:12px !important;">💬 WhatsApp</a>
                <a href="offer.html?id=${data.id}" class="btn-request" style="background:#222 !important; border:1px solid #444 !important; border-radius:10px !important; justify-content:center !important; font-weight:bold !important; font-size:12px !important; display:flex !important; flex-direction:column !important; align-items:center !important; text-decoration:none !important; color:#fff !important; flex:1 !important;">💰 Suggest Price</a>
                <a href="checkout.html?id=${data.id}" class="btn-buy btn-main" style="background:gold !important; color:#000 !important; border-radius:10px !important; justify-content:center !important; font-weight:bold !important; font-size:12px !important; display:flex !important; flex-direction:column !important; align-items:center !important; text-decoration:none !important; flex:1 !important;">🛒 BUY</a>
            </div>
        `;

        // Funksioni i Galerisë për fotot
        window.changeImg = function(direction) {
            currentImgIdx += direction;
            if (currentImgIdx < 0) currentImgIdx = images.length - 1;
            if (currentImgIdx >= images.length) currentImgIdx = 0;
            document.getElementById('main-img').src = images[currentImgIdx];
            document.getElementById('photo-counter').innerText = `${currentImgIdx + 1} / ${images.length}`;
        };
    }

    function shareProduct() {
        if (navigator.share) {
            navigator.share({ title: document.title, url: window.location.href });
        } else {
            navigator.clipboard.writeText(window.location.href);
            alert("Linku u kopjua!");
        }
    }

    function toggleLike(btn) {
        if (btn.style.color === 'red') {
            btn.style.color = '#fff';
            btn.innerHTML = '♡ Like';
        } else {
            btn.style.color = 'red';
            btn.innerHTML = '❤️ Liked';
        }
    }

    window.onload = loadBraceletProduct;
</script>
<body>

<header class="site-header">
    <nav class="nav-scroll">
        <span class="site-title">ORA<br>SWISS</span>
        <a href="index.html">Home</a>
        <a href="luxury.html">Luxury</a>
        <a href="vintage.html">Vintage</a>
        <a href="parts.html">Parts</a>
        <a href="product-bracelets-straps.html" style="color: gold;">Bracelet/Strap</a>
        <a href="service.html">Service</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<div id="content-container" style="padding: 10px;">
    Loading...
</div>

<script>
    let currentImages = [];
    let currentImgIndex = 0;

    document.addEventListener("DOMContentLoaded", async function() {
        if (!window.supabaseClient) {
            console.error("Supabase client nuk u gjet!");
            return;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const itemId = urlParams.get('id');
        const container = document.getElementById("content-container");

        if (itemId) {
            const { data, error } = await window.supabaseClient
                .from('bracelets_straps')
                .select('*')
                .eq('id', itemId)
                .single();

            if (error || !data) {
                container.innerHTML = "<h2 style='color:red; text-align:center;'>Produkti nuk u gjet ose ndodhi një gabim!</h2>";
                return;
            }

            // Përpunimi i të gjitha fotove (Array ose String i ndarë)
            let rawImages = data.image_url;
            if (typeof rawImages === 'string') {
                try { rawImages = JSON.parse(rawImages); } catch(e) { rawImages = [rawImages]; }
            }

            currentImages = Array.isArray(rawImages) ? rawImages.filter(img => img && img !== 'null' && img !== '') : [];
            if (currentImages.length === 0) {
                currentImages = ["https://placeholder.co/600x400/222/fff?text=No+Image"];
            } else {
                currentImages = currentImages.map(img => 
                    img.startsWith('http') ? img : "https://gnwsrmelmeqduhhmfmoa.supabase.co/storage/v1/object/public/or-images/" + img
                );
            }
            currentImgIndex = 0;

            container.innerHTML = `
                <div style="max-width: 600px; margin: 0 auto; background: #111; padding: 20px; border-radius: 10px; border: 1px solid #333;">
                    <div class="gallery-container">
                        <button class="gallery-btn prev" onclick="changeImage(-1)">❮</button>
                        <img id="main-product-img" src="${currentImages[0]}" alt="${data.brand || 'Strap'}">
                        <button class="gallery-btn next" onclick="changeImage(1)">❯</button>
                        <div class="photo-counter" id="photo-counter-text">1 / ${currentImages.length}</div>
                    </div>
                    
                    <h2 style="margin-top: 15px;">${data.brand || 'Bracelet / Strap'} ${data.model || ''}</h2>

                  
                    <div class="price" style="font-weight:bold; color:gold; font-size: 22px; margin: 10px 0;">
                        ${data.price ? data.price + ' €' : 'Contact for price'}
                    </div>

                    <div class="specs-grid">
                        <div>Type: <span>${data.type || '/'}</span></div>
                        <div>Condition: <span>${data.condition || '/'}</span></div>
                        <div>Material: <span>${data.material || '/'}</span></div>
                        <div>Color: <span>${data.color || '/'}</span></div>
                        <div>Reference: <span>${data.reference || '/'}</span></div>
                        <div>Year: <span>${data.year || '/'}</span></div>
                        <div>Gold Purity: <span>${data.gold_purity || '/'}</span></div>
                        <div>Lug Width: <span>${data.lug_width || '/'}</span></div>
                        <div>Clasp Width: <span>${data.clasp_width || '/'}</span></div>
                        <div>Length: <span>${data.length || '/'}</span></div>
                        <div>Length: <span>${data.length || '/'}</span></div>
                        <div class="shipping-info">
                        <div>Postal Service: <span>${data.shipping_provider ? data.shipping_provider : '/'}</span></div>
                        <div>Delivery Time: <span>${data.shipping_days ? data.shipping_days : '/'}</span></div>
                    </div>
                    </div>

                    <div style="background: #1a1a1a; padding: 15px; border-radius: 8px; margin: 15px 0; border: 1px solid #333;">
                        <h4 style="margin: 0 0 10px 0; color: #fff;">Description</h4>
                        <p style="color: #ccc; line-height: 1.5; margin: 0; white-space: pre-line;">${data.description || 'Nuk ka përshkrim shtesë për këtë produkt.'}</p>
                    </div>

                    <button id="buy-bracelet-btn" class="btn-main btn-buy" style="width:100%;">Buy Now (PayPal)</button>
                    <button id="send-request-btn" class="btn-main btn-request" style="width:100%;">Send Request / Inquiry</button>
                </div>
            `;

            // Lidhja e PayPal
            const buyBtn = document.getElementById("buy-bracelet-btn");
            if (buyBtn) {
                buyBtn.onclick = async function(e) {
                    e.preventDefault();
                    buyBtn.innerText = "Loading PayPal...";
                    try {
                        const response = await fetch(
                            "https://gnwsrmelmeqduhhmfmoa.supabase.co/functions/v1/create-paypal-order",
                            {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({
                                    product_id: itemId,
                                    price: data.price,
                                    product_name: (data.brand || 'Strap') + ' ' + (data.model || '')
                                })
                            }
                        );
                        const result = await response.json();
                        if (result.paypal_link) {
                            window.location.href = result.paypal_link;
                        } else {
                            alert("PayPal link nuk u krijua");
                            buyBtn.innerText = "Buy Now (PayPal)";
                        }
                    } catch(error) {
                        console.error(error);
                        alert("Gabim me PayPal");
                        buyBtn.innerText = "Buy Now (PayPal)";
                    }
                };
            }

            // Lidhja e mesazheve
            const requestBtn = document.getElementById("send-request-btn");
            if (requestBtn) {
                requestBtn.onclick = function() {
                    window.location.href = `messages.html?product_id=${itemId}&title=` + encodeURIComponent((data.brand || 'Strap') + ' ' + (data.model || ''));
                };
            }

        } else {
            // NËSE NUK KA ID: Shfaqim listën e plotë
            container.innerHTML = '<h2 style="padding-left: 0;">Bracelets & Straps Collection</h2><div id="straps-container" class="grid">Loading...</div>';
            const gridContainer = document.getElementById("straps-container");

            const { data, error } = await window.supabaseClient
                .from('bracelets_straps')
                .select('*');

            if (error || !data || data.length === 0) {
                gridContainer.innerHTML = "No bracelets or straps available.";
                return;
            }

            gridContainer.innerHTML = data.map(item => {
                let imgUrl = "https://placeholder.co/600x400/222/fff?text=No+Image";
                let primaryImage = "";

                if (item.image_url) {
                    if (Array.isArray(item.image_url) && item.image_url.length > 0) {
                        primaryImage = item.image_url[0];
                    } else if (typeof item.image_url === 'string') {
                        try {
                            let parsed = JSON.parse(item.image_url);
                            primaryImage = Array.isArray(parsed) ? parsed[0] : item.image_url;
                        } catch(e) {
                            primaryImage = item.image_url;
                        }
                    }
                }

                if (primaryImage && primaryImage !== 'null' && primaryImage !== '') {
                    imgUrl = primaryImage.startsWith('http') ? primaryImage : "https://gnwsrmelmeqduhhmfmoa.supabase.co/storage/v1/object/public/or-images/" + primaryImage;
                }

                return `
                    <div class="card" onclick="window.location.href='product-bracelets-straps.html?id=${item.id}'">
                        <img src="${imgUrl}" alt="${item.brand || 'Strap'}">
                        <h3 style="margin: 10px 0 5px 0;">${item.brand || 'Bracelet / Strap'}</h3>
                        <p style="color:#aaa; font-size:13px; margin:0 0 8px 0;">${item.material || '/'}</p>
                        <div class="price" style="font-weight:bold; color:gold; margin-bottom: 10px;">${item.price ? item.price + ' €' : 'Contact for price'}</div>
                        
                        <button class="btn-main btn-buy" 
                        style="width:100%; padding: 8px; font-size: 13px;"
                        onclick="event.stopPropagation(); window.location.href='product-bracelets-straps.html?id=${item.id}'">
                         View Details
                        </button>
                    </div>
                `;
            }).join('');
        }
    });

    // Funksioni për të lëvizur fotot me shigjeta
    function changeImage(direction) {
        if (currentImages.length <= 1) return;
        currentImgIndex += direction;
        if (currentImgIndex >= currentImages.length) currentImgIndex = 0;
        if (currentImgIndex < 0) currentImgIndex = currentImages.length - 1;
        
        document.getElementById("main-product-img").src = currentImages[currentImgIndex];
        document.getElementById("photo-counter-text").innerText = (currentImgIndex + 1) + " / " + currentImages.length;
    }
</script>

<nav class="bottom-nav">
    <a href="index.html">Home</a>
    <a href="favorites.html">Favs</a>
    <a href="messages.html">Messages</a>
    <a href="mysales.html">Sales</a>
    <a href="sellnow.html">Sell</a>
    <button type="button" onclick="checkMenu(event)">Menu</button>
</nav>

</body>
</html>
