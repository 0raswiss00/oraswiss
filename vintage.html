    <style>
        body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #000; color: #fff; padding-bottom: 110px; }
        
        .site-header { position: sticky; top: 0; z-index: 9999; background: #111; border-bottom: 1px solid #333; }
        .nav-scroll { display: flex; gap: 18px; align-items: center; overflow-x: auto; padding: 14px 16px; }
        .nav-scroll a { color: #fff; text-decoration: none; padding: 6px 10px; font-weight: bold; white-space: nowrap; }
        .nav-scroll a:hover { color: gold; }
        .site-title { font-weight: 700; line-height: 1.05; margin-right: 10px; }

        .container-content { padding: 15px; max-width: 1200px; margin: 0 auto; }
        
        /* Kutia e Kërkimit */
        .search-box {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 20px;
            background: #111;
            border: 1px solid #333;
            color: #fff;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
        }
        .search-box:focus { outline: none; border-color: gold; }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 15px;
            }
        }

        .card {
            background: #111;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #333;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            display: block;
            border-radius: 8px;
        }

        .price { color: gold; font-weight: bold; margin: 8px 0; font-size: 1.1em; }

        .btn-main {
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            text-align: center;
            display: block;
            text-decoration: none;
        }
        .btn-buy { background: gold; color: #000; width: 100%; }
        .btn-buy:hover { background: #e6c200; }

        .btn-secondary {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            margin-top: 5px;
        }
        .btn-secondary:hover { background: #333; }

        /* Bottom Nav bar i unifikuar */
        .bottom-nav {
            position: fixed !important;
            bottom: 20px !important;
            left: 15px !important;
            right: 15px !important;
            width: auto !important;
            height: 65px !important;
            background-color: #1a1a1a !important;
            display: flex !important;
            justify-content: space-around !important;
            align-items: center !important;
            padding: 0 5px !important;
            border-radius: 20px !important;
            border: 1px solid #333 !important;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5) !important;
            z-index: 999999 !important;
        }

        .bottom-nav a, .bottom-nav button {
            color: #ffffff !important;
            text-decoration: none !important;
            font-size: 10px !important;
            text-align: center !important;
            white-space: nowrap !important;
            flex: 1 !important;
            background: none !important;
            border: none !important;
            cursor: pointer !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            gap: 3px !important;
        }
        .bottom-nav a:hover { color: gold !important; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.js"></script>
    <script src="db-connect.js"></script>
    <script src="menu.js" defer></script>
</head>
<body>

<header class="site-header">
    <nav class="nav-scroll">
        <span class="site-title">ORA<br>SWISS</span>
        <a href="index.html">Home</a>
        <a href="luxury.html">Luxury</a>
        <a href="vintage.html" style="color: gold;">Vintage</a>
        <a href="parts.html">Parts</a>
        <a href="product-bracelets-straps.html">Bracelet/Strap</a>
        <a href="service.html">Service</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>
    
    <!-- Kutia e Kërkimit -->
    <input type="text" id="search-input" class="search-box" placeholder="Kërko sipas brendit, modelit ose materialit...">

    <div id="oras-container" class="grid">Duke ngarkuar koleksionin...</div>
</div>

<script>
    let allOrasData = [];

    async function loadOras() {
        const container = document.getElementById("oras-container");
        
        if (!window.supabaseClient) {
            container.innerHTML = "<p style='color:red;'>Gabim në lidhjen me databazën.</p>";
            return;
        }

        const category = 'vintage';  

        const { data, error } = await window.supabaseClient
            .from('oras')
            .select('*')
            .eq('category', category);

        if (error) {
            container.innerHTML = "<p style='color:red;'>Gabim gjatë ngarkimit: " + error.message + "</p>";
            return;
        }

        if (!data || data.length === 0) {
            container.innerHTML = "<p>Nuk ka artikuj në këtë kategori.</p>";
            return;
        }

        allOrasData = data;
        renderCards(allOrasData);
    }

    function renderCards(items) {
        const container = document.getElementById("oras-container");
        
        if (items.length === 0) {
            container.innerHTML = "<p>Nuk u gjet asnjë orë që i përgjigjet kërkimit tuaj.</p>";
            return;
        }

        let cardsHtml = "";

        items.forEach(ora => {
            let imgUrl = "https://placeholder.co/600x400/222/fff?text=No+Image";
            let primaryImage = "";

            if (ora.image_url) {
                if (Array.isArray(ora.image_url) && ora.image_url.length > 0) {
                    primaryImage = ora.image_url[0];
                } else if (typeof ora.image_url === 'string') {
                    try {
                        let parsed = JSON.parse(ora.image_url);
                        primaryImage = Array.isArray(parsed) ? parsed[0] : ora.image_url;
                    } catch(e) {
                        primaryImage = ora.image_url;
                    }
                }
            }

            if (primaryImage && primaryImage !== 'null' && primaryImage !== '') {
                if (primaryImage.startsWith('http')) {
                    imgUrl = primaryImage;
                } else {
                    const SUPABASE_URL = "https://gnwsrmelmeqduhhmfmoa.supabase.co";
                    imgUrl = SUPABASE_URL + "/storage/v1/object/public/or-images/" + primaryImage;
                }
            }

            cardsHtml += `
            <div class="card" onclick="window.location.href='product.html?id=${ora.id}'">
                <div>
                    <img src="${imgUrl}" alt="${ora.brand || 'Vintage Watch'}">
                    <h3 style="margin: 8px 0 4px 0; font-size: 16px;">${ora.brand || ''}</h3>
                    <div style="font-size: 14px; color: #aaa; margin-bottom: 6px;">${ora.model || ''}</div>
                    <div class="price">${ora.price ? ora.price + ' €' : 'Contact'}</div>
                </div>

                <div>
                    <button class="btn-main btn-secondary" style="width:100%; padding:10px; font-size:14px;" 
                        onclick="event.stopPropagation(); window.location.href='product.html?id=${ora.id}';">
                        View Details
                    </button>
                </div>
            </div>
            `;
        });

        container.innerHTML = cardsHtml;
    }

    // Funksionaliteti i kërkimit (Search live)
    document.getElementById("search-input").addEventListener("input", function(e) {
        const query = e.target.value.toLowerCase().trim();
        const filtered = allOrasData.filter(ora => {
            const brand = (ora.brand || "").toLowerCase();
            const model = (ora.model || "").toLowerCase();
            const description = (ora.description || "").toLowerCase();
            return brand.includes(query) || model.includes(query) || description.includes(query);
        });
        renderCards(filtered);
    });

    document.addEventListener("DOMContentLoaded", loadOras);

    function checkMenu(event) {
        event.stopPropagation();
        if (typeof window.toggleMenu === 'function') {
            window.toggleMenu();
        } else {
            alert('Menuja është duke u ngarkuar ose mungon skripta kryesore e menusë.');
        }
    }
</script>

<nav class="bottom-nav">
    <a href="index.html">Home</a>

    <a href="mysales.html">Sales</a>

    <button type="button" onclick="checkMenu(event)">Menu</button>
