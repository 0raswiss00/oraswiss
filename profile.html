<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profile - Ora Swiss</title>

  <style>
    :root {
      --bg-color: #0a0a0a;
      --card-bg: #141414;
      --border-color: #262626;
      --text-main: #ffffff;
      --text-muted: #a3a3a3;
      --accent: #d4af37;
      --accent-hover: #b3922f;
      --danger: #ef4444;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      line-height: 1.5;
    }

    .wrap {
      max-width: 560px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    h2 {
      margin-top: 0;
      font-size: 1.3rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 16px;
      color: var(--accent);
    }

    h3 {
      font-size: 1.1rem;
      color: var(--accent);
      margin-top: 24px;
      margin-bottom: 12px;
    }

    p {
      margin: 8px 0;
      color: var(--text-muted);
    }

    p b {
      color: var(--text-main);
    }

    #sellerTitle {
      font-size: 1.8rem;
      margin: 0 0 4px 0;
      color: var(--text-main);
    }

    .joined-date {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: #1f1f1f;
      color: var(--text-main);
      font-size: 0.95rem;
      box-sizing: border-box;
      margin-bottom: 12px;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }

    input[type="file"] {
      padding: 8px;
      background: #1a1a1a;
      cursor: pointer;
    }

    button {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #000;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }

    button:hover {
      background: var(--accent-hover);
    }

    #btnLogout {
      background: transparent;
      border: 1px solid var(--danger);
      color: var(--danger);
      margin-top: 16px;
    }

    #btnLogout:hover {
      background: var(--danger);
      color: #fff;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    #sellerWatches li {
      background: #1f1f1f;
      border: 1px solid var(--border-color);
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #feedbackList li {
      background: #1a1a1a;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-bottom: 6px;
    }

    .private-field { display: none; }
    
    #verifyMsg, #profileMsg, #msg {
      font-size: 0.9rem;
      font-weight: 500;
      margin-top: 8px;
    }
  </style>
</head>

<body style="visibility:hidden;">
  <div class="wrap">
    
    <!-- Koka e Profilit -->
    <div class="card">
      <h1 id="sellerTitle">-</h1>
      <p id="sellerJoined" class="joined-date">-</p>
      <p>Shteti: <b id="userCountry">-</b></p>
    </div>

    <!-- Të Dhënat Private (Vetëm për pronarin) -->
    <div id="ownerDetails" class="card private-field">
      <h2>Të dhënat e llogarisë</h2>
      <p>Email: <b id="userEmail"></b></p>
      <p>Emri: <b id="userName">-</b></p>
      <p>Telefon: <b id="userPhone">-</b></p>
      <p>Rruga: <b id="userStreet">-</b></p>
      <p>Nr. Shtëpisë: <b id="userHouseNumber">-</b></p>
      <p>Kodi Postar: <b id="userZip">-</b></p>
    </div>

    <!-- Seksioni i Modifikimit të Profilit -->
    <div id="editProfileSection" class="card private-field">
      <h2>Modifiko Profilin</h2>
      
      <label style="font-size: 0.85rem; color: var(--text-muted);">Emri i plotë:</label>
      <input id="editFullName" placeholder="Emri i plotë">

      <label style="font-size: 0.85rem; color: var(--text-muted);">Username i faqes:</label>
      <input id="editCustomUsername" placeholder="Username">

      <label style="font-size: 0.85rem; color: var(--text-muted);">Telefoni:</label>
      <input id="editPhone" placeholder="Numri i telefonit">

      <label style="font-size: 0.85rem; color: var(--text-muted);">Shteti:</label>
      <input id="editCountry" placeholder="Shteti">

      <label style="font-size: 0.85rem; color: var(--text-muted);">Rruga:</label>
      <input id="editStreet" placeholder="Rruga">

      <label style="font-size: 0.85rem; color: var(--text-muted);">Nr. Shtëpisë:</label>
      <input id="editHouseNumber" placeholder="Nr. Shtëpisë">

      <label style="font-size: 0.85rem; color: var(--text-muted);">Kodi Postar:</label>
      <input id="editZip" placeholder="Kodi Postar">

      <label style="font-size: 0.85rem; color: var(--text-muted);">Foto e Profilit (Imazhi):</label>
      <input id="editImageFile" type="file" accept="image/*">

      <button id="btnSaveProfile" type="button">Ruaj ndryshimet</button>
      <p id="profileMsg"></p>
    </div>

    <!-- Feedback-u -->
    <div class="card">
      <h3>Feedback-u i blerësve</h3>
      <ul id="feedbackList"><li>Nuk ka ende feedback.</li></ul>
    </div>

    <!-- Artikujt e shitësit -->
    <div class="card">
      <h3>Artikujt e shitësit</h3>
      <div class="watch-scroll">
        <ul id="sellerWatches"><li>Nuk ka artikuj ende.</li></ul>
      </div>
    </div>

    <!-- Verifikimi i Identitetit & Logout -->
    <div id="verificationSection" class="card private-field">
      <h3>🔒 Verifikimi i Identitetit</h3>
      
      <select id="documentType">
        <option value="">Zgjidh dokumentin</option>
        <option value="ID">Kartë ID</option>
        <option value="Passport">Pasaportë</option>
      </select>

      <input id="documentNumber" placeholder="Numri i dokumentit">

      <label style="font-size: 0.85rem; color: var(--text-muted);">Foto përpara:</label>
      <input id="photoFront" type="file" accept="image/*">

      <label style="font-size: 0.85rem; color: var(--text-muted);">Foto mbrapa:</label>
      <input id="photoBack" type="file" accept="image/*">

      <button id="btnVerify" type="button">Dërgo për verifikim</button>
      <p id="verifyMsg"></p>

      <button id="btnLogout" type="button">Dil nga llogaria (Logout)</button>
    </div>

    <p id="msg"></p>
  </div>
  
<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm";

  const supabaseUrl = 'https://gnwsrmelmeqduhhmfmoa.supabase.co';
  const supabaseKey = 'sb_publishable__AkK_Z7lhtkvukN6Fy1cAQ_KBTXIcY9';
  const supabase = createClient(supabaseUrl, supabaseKey);

  const emailEl = document.getElementById("userEmail");
  const nameEl = document.getElementById("userName");
  const phoneEl = document.getElementById("userPhone");
  const countryEl = document.getElementById("userCountry");
  const streetEl = document.getElementById("userStreet");
  const houseEl = document.getElementById("userHouseNumber");
  const zipEl = document.getElementById("userZip");
  const logoutBtn = document.getElementById("btnLogout");
  const watchList = document.getElementById("sellerWatches");

  async function loadWatches(uid) {
    watchList.innerHTML = "";
    const tables = [
      { table: "oras", label: "⌚" },
      { table: "bracelets_straps", label: "🪢" }
    ];

    let hasItems = false;

    for (const item of tables) {
      const { data, error } = await supabase
        .from(item.table)
        .select("*")
        .eq('user_id', uid);

      if (error) continue;

      data?.forEach(product => {
        hasItems = true;
        const li = document.createElement("li");
        li.innerHTML = `<span><b>${item.label} ${product.brand || ""}</b> ${product.model || ""}</span> <b>${product.price || "-"}€</b>`;
        watchList.appendChild(li);
      });
    }

    if (!hasItems) {
      watchList.innerHTML = "<li>Nuk ka artikuj aktivë.</li>";
    }
  }

  window.addEventListener("DOMContentLoaded", async () => {
    const { data: { user } } = await supabase.auth.getUser();

    const params = new URLSearchParams(window.location.search);
    const sellerIdFromUrl = params.get("id");

    const profileId = sellerIdFromUrl || (user ? user.id : null);

    if (!profileId) {
      window.location.href = "index.html";
      return;
    }

    const isOwner = user && user.id === profileId;

    const { data: sellerData, error: sellerError } = await supabase
      .from("profiles")
      .select("*")
      .eq("id", profileId);

    let meta = {};
    if (!sellerError && sellerData && sellerData.length > 0) {
      meta = sellerData[0];
    } else if (isOwner && user) {
      meta = user.user_metadata || {};
    }

    document.body.style.visibility = "visible";

    const sellerTitle = document.getElementById("sellerTitle");
    const customName = meta.custom_username || meta.full_name || "Seller";
    sellerTitle.textContent = `${customName}.oraswiss`;

    const created = new Date(meta.created_at || (user ? user.created_at : Date.now()));
    const joinedText = document.getElementById("sellerJoined");
    joinedText.textContent = "Anëtar që nga " + created.toLocaleDateString("sq-AL", { month: "long", year: "numeric" });

    const countries = {
      "Albania": "🇦🇱 Shqipëri",
      "Switzerland": "🇨🇭 Zvicër",
      "Italy": "🇮🇹 Itali",
      "Germany": "🇩🇪 Gjermani",
      "AL": "🇦🇱 Shqipëri",
      "CH": "🇨🇭 Zvicër",
      "IT": "🇮🇹 Itali",
      "DE": "🇩🇪 Gjermani"
    };

    const rawCountry = meta.country || meta.shteti || meta.country_name || (user?.user_metadata ? (user.user_metadata.country || user.user_metadata.shteti) : null) || "-";
    countryEl.textContent = countries[rawCountry] || rawCountry;
    
    if (isOwner && user) {
      document.querySelectorAll(".private-field").forEach(el => el.style.display = "block");

      emailEl.textContent = user.email;
      nameEl.textContent = meta.full_name || "-";
      phoneEl.textContent = meta.phone || "-";
      streetEl.textContent = meta.street || "-";
      houseEl.textContent = meta.house_number || "-";
      zipEl.textContent = meta.zip_code || "-";

      // Mbushja e fushave në formën e modifikimit
      document.getElementById("editFullName").value = meta.full_name || "";
      document.getElementById("editCustomUsername").value = meta.custom_username || "";
      document.getElementById("editPhone").value = meta.phone || "";
      document.getElementById("editCountry").value = meta.country || meta.shteti || "";
      document.getElementById("editStreet").value = meta.street || "";
      document.getElementById("editHouseNumber").value = meta.house_number || "";
      document.getElementById("editZip").value = meta.zip_code || "";
    }

    await loadWatches(profileId);
  });

  // Ruajtja e ndryshimeve të profilit (përfshirë kolonën image)
  const saveProfileBtn = document.getElementById("btnSaveProfile");
  if (saveProfileBtn) {
    saveProfileBtn.addEventListener("click", async () => {
      const { data: { user } } = await supabase.auth.getUser();
      const msg = document.getElementById("profileMsg");

      const fullName = document.getElementById("editFullName").value;
      const customUsername = document.getElementById("editCustomUsername").value;
      const phone = document.getElementById("editPhone").value;
      const country = document.getElementById("editCountry").value;
      const street = document.getElementById("editStreet").value;
      const houseNumber = document.getElementById("editHouseNumber").value;
      const zipCode = document.getElementById("editZip").value;
      const imageFile = document.getElementById("editImageFile").files[0];

      msg.style.color = "var(--text-main)";
      msg.textContent = "Duke ruajtur ndryshimet...";

      const { data: currentProfile } = await supabase
        .from("profiles")
        .select("image, photo")
        .eq("id", user.id)
        .single();

      let imagePath = currentProfile?.image || currentProfile?.photo || null;

      if (imageFile) {
        const filePath = `${user.id}/profile_${Date.now()}_${imageFile.name}`;
        const uploadRes = await supabase.storage.from("identity_documents").upload(filePath, imageFile);
        
        if (uploadRes.error) {
          msg.style.color = "var(--danger)";
          msg.textContent = "Gabim gjatë ngarkimit të imazhit.";
          return;
        }
        imagePath = uploadRes.data.path;
      }

      const { error } = await supabase
        .from("profiles")
        .update({
          full_name: fullName,
          custom_username: customUsername,
          phone: phone,
          country: country,
          street: street,
          house_number: houseNumber,
          zip_code: zipCode,
          image: imagePath,
          updated_at: new Date()
        })
        .eq("id", user.id);

      if (error) {
        msg.style.color = "var(--danger)";
        msg.textContent = "Gabim gjatë përditësimit: " + error.message;
        return;
      }

      msg.style.color = "var(--accent)";
      msg.textContent = "Profili u përditësua me sukses!";
      setTimeout(() => window.location.reload(), 1500);
    });
  }

  // Verifikimi i Identitetit dhe dërgimi i email-it
  const verifyBtn = document.getElementById("btnVerify");
  if (verifyBtn) {
    verifyBtn.addEventListener("click", async () => {
      const { data: { user } } = await supabase.auth.getUser();
      const documentType = document.getElementById("documentType").value;
      const documentNumber = document.getElementById("documentNumber").value;
      const frontFile = document.getElementById("photoFront").files[0];
      const backFile = document.getElementById("photoBack").files[0];
      const msg = document.getElementById("verifyMsg");

      if (!documentType || !documentNumber || !frontFile || !backFile) {
        msg.style.color = "var(--danger)";
        msg.textContent = "Plotëso të gjitha fushat dhe ngarko të dy fotot.";
        return;
      }

      msg.style.color = "var(--text-main)";
      msg.textContent = "Duke dërguar verifikimin...";

      const frontPath = `${user.id}/front_${Date.now()}_${frontFile.name}`;
      const backPath = `${user.id}/back_${Date.now()}_${backFile.name}`;

      const frontUpload = await supabase.storage.from("identity_documents").upload(frontPath, frontFile);
      const backUpload = await supabase.storage.from("identity_documents").upload(backPath, backFile);

      if (frontUpload.error || backUpload.error) {
        msg.style.color = "var(--danger)";
        msg.textContent = "Gabim gjatë ngarkimit të fotove.";
        return;
      }

      // Krijimi i linkove të firmosura për fotot që të shkojnë në email
      const { data: frontUrl } = await supabase.storage
        .from("identity_documents")
        .createSignedUrl(frontUpload.data.path, 3600);

      const { data: backUrl } = await supabase.storage
        .from("identity_documents")
        .createSignedUrl(backUpload.data.path, 3600);

      const { error } = await supabase
        .from("identity_verifications")
        .insert({
          user_id: user.id,
          document_type: documentType,
          document_number: documentNumber,
          photo_front: frontUpload.data.path,
          photo_back: backUpload.data.path,
          verification_status: "pending"
        });

      if (error) {
        msg.style.color = "var(--danger)";
        msg.textContent = "Gabim gjatë dërgimit të kërkesës.";
        return;
      }

      // Dërgimi i email-it përmes Supabase Functions
      await supabase.functions.invoke("send-email-notification", {
        body: {
          subject: "Kërkesë e re verifikimi",
          message: `U dërgua një kërkesë e re për verifikim.

Email: ${user.email}

Dokumenti: ${documentType}
Numri: ${documentNumber}

Foto përpara:
${frontUrl?.signedUrl || ""}

Foto mbrapa:
${backUrl?.signedUrl || ""}`
        }
      });

      msg.style.color = "var(--accent)";
      msg.textContent = "Kërkesa u dërgua me sukses për verifikim!";
    });
  }
  
  if (logoutBtn) {
    logoutBtn.addEventListener("click", async () => {
      await supabase.auth.signOut();
      window.location.href = "index.html";
    });
  }
</script>
</body>
</html>
