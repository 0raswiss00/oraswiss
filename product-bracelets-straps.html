        .modal-overlay {

        .modal-content {

<div id="content-container" style="padding: 10px;">

<!-- =========================================
     SUGGEST PRICE MODAL
========================================= -->

<div id="offer-modal" class="modal-overlay">

    <div class="modal-content">

        <h3>Suggest a Price</h3>

        <p>
            Vendosni çmimin që dëshironi të ofroni për këtë produkt:
        </p>

        <input
            type="number"
            id="offer-price-input"
            placeholder="p.sh. 45"
            min="0"
            step="0.01"
        >

        <div id="offer-error"></div>

        <div class="modal-buttons">

            <button
                type="button"
                class="modal-cancel"
                onclick="closeOfferModal()">
                Anullo
            </button>

            <button
                type="button"
                class="modal-submit"
                onclick="submitOffer()">
                Dërgo Ofertën
            </button>

        </div>

    </div>

</div>


<!-- =========================================
     LOGIN MODAL
========================================= -->

<div id="login-modal" class="modal-overlay">

    <div class="modal-content">

        <h3>Kërkohet Identifikimi</h3>

        <p>
            Ju lutem hyni në llogarinë tuaj për të dërguar një ofertë.
        </p>

        <div class="modal-buttons">

            <button
                type="button"
                class="modal-cancel"
                onclick="document.getElementById('login-modal').style.display='none'">
                Anullo
            </button>

                type="button"
                class="modal-submit"
                onclick="window.location.href='login.html'">

            </button>

        </div>

<script>

let currentImages = [];
let currentImgIndex = 0;

/* ID e produktit aktual */
let productId = null;


/* =========================================
   LOAD PRODUCT
========================================= */

document.addEventListener("DOMContentLoaded", async function() {

    if (!window.supabaseClient) {
        console.error("Supabase client nuk u gjet!");
        return;
    }

    const urlParams = new URLSearchParams(window.location.search);

    productId = urlParams.get("id");

    const container =
        document.getElementById("content-container");


    /* =========================================
       SINGLE PRODUCT
    ========================================= */

    if (productId) {

        const { data, error } =
            await window.supabaseClient
                .from("bracelets_straps")
                .select("*")
                .eq("id", productId)
                .single();


        if (error || !data) {

            container.innerHTML =
                "<h2 style='color:red;text-align:center;'>" +
                "Produkti nuk u gjet ose ndodhi një gabim!" +
                "</h2>";

            console.error(error);

            return;
        }


        /* =========================================
           SELLER ID
        ========================================= */

        window.currentSellerId = data.user_id;


        /* =========================================
           IMAGES
        ========================================= */

        let rawImages = data.image_url;


        if (typeof rawImages === "string") {

            try {

                rawImages = JSON.parse(rawImages);

            } catch(e) {

                rawImages = [rawImages];

            }

        }


        currentImages =
            Array.isArray(rawImages)
                ? rawImages.filter(
                    img =>
                        img &&
                        img !== "null" &&
                        img !== ""
                  )
                : [];


        if (currentImages.length === 0) {

            currentImages = [
                "https://placeholder.co/600x400/222/fff?text=No+Image"
            ];

        } else {

            currentImages =
                currentImages.map(img =>

                    img.startsWith("http")
                        ? img
                        : "https://gnwsrmelmeqduhhmfmoa.supabase.co/storage/v1/object/public/or-images/" + img

                );

        }


        currentImgIndex = 0;


        /* =========================================
           PRODUCT HTML
        ========================================= */

        container.innerHTML = `

            <div style="
                max-width:600px;
                margin:0 auto;
                background:#111;
                padding:20px;
                border-radius:10px;
                border:1px solid #333;
            ">

                <!-- GALLERY -->

                <div class="gallery-container">

                    <button
                        class="gallery-btn prev"
                        onclick="changeImage(-1)">
                        ❮
                    </button>

                    <img
                        id="main-photo"
                        src="${currentImages[0]}"
                        alt="${data.brand || "Strap"}"
                    >

                    <button
                        class="gallery-btn next"
                        onclick="changeImage(1)">
                        ❯
                    </button>

                    <div
                        class="photo-counter"
                        id="photo-count">
                        1 / ${currentImages.length}
                    </div>

                </div>


                <!-- TITLE -->

                <h2 style="margin-top:15px;">
                    ${data.brand || "Bracelet / Strap"}
                    ${data.model || ""}
                </h2>


                <!-- PRICE -->

                <div
                    class="price"
                    style="
                        font-weight:bold;
                        color:gold;
                        font-size:22px;
                        margin:10px 0;
                    "
                >
                    ${
                        data.price
                            ? data.price + " €"
                            : "Contact for price"
                    }
                </div>


                <!-- SPECS -->

                <div class="specs-grid">

                    <div>
                        Type:
                        <span>${data.type || "/"}</span>
                    </div>

                    <div>
                        Condition:
                        <span>${data.condition || "/"}</span>
                    </div>

                    <div>
                        Material:
                        <span>${data.material || "/"}</span>
                    </div>

                    <div>
                        Color:
                        <span>${data.color || "/"}</span>
                    </div>

                    <div>
                        Reference:
                        <span>${data.reference || "/"}</span>
                    </div>

                    <div>
                        Year:
                        <span>${data.year || "/"}</span>
                    </div>

                    <div>
                        Gold Purity:
                        <span>${data.gold_purity || "/"}</span>
                    </div>

                    <div>
                        Lug Width:
                        <span>${data.lug_width || "/"}</span>
                    </div>

                    <div>
                        Clasp Width:
                        <span>${data.clasp_width || "/"}</span>
                    </div>

                    <div>
                        Length:
                        <span>${data.length || "/"}</span>
                    </div>

                    <div>
                        Postal Service:
                        <span>
                            ${
                                data.shipping_provider
                                    ? data.shipping_provider
                                    : "/"
                            }
                        </span>
                    </div>

                    <div>
                        Delivery Time:
                        <span>
                            ${
                                data.shipping_days
                                    ? data.shipping_days
                                    : "/"
                            }
                        </span>
                    </div>

                </div>


                <!-- DESCRIPTION -->

                <div style="
                    background:#1a1a1a;
                    padding:15px;
                    border-radius:8px;
                    margin:15px 0;
                    border:1px solid #333;
                ">

                    <h4 style="
                        margin:0 0 10px 0;
                        color:#fff;
                    ">
                        Description
                    </h4>

                    <p style="
                        color:#ccc;
                        line-height:1.5;
                        margin:0;
                        white-space:pre-line;
                    ">
                        ${
                            data.description ||
                            "Nuk ka përshkrim shtesë për këtë produkt."
                        }
                    </p>

                </div>


                <!-- BUY -->

                <button
                    id="buy-bracelet-btn"
                    class="btn-main btn-buy"
                    style="width:100%;">
                    Buy Now (PayPal)
                </button>


                <!-- SUGGEST PRICE -->

                <button
                    id="suggest-price-btn"
                    class="btn-main"
                    style="
                        width:100%;
                        margin-top:10px;
                        background:#2196F3;
                        color:#fff;
                    ">
                    Suggest Price
                </button>


                <!-- REQUEST -->

                <button
                    id="send-request-btn"
                    class="btn-main btn-request"
                    style="width:100%;">
                    Send Request / Inquiry
                </button>

            </div>

        `;


        /* =========================================
           SUGGEST PRICE BUTTON
        ========================================= */

        const suggestBtn =
            document.getElementById("suggest-price-btn");


        if (suggestBtn) {

            suggestBtn.onclick = async function(e) {

                e.preventDefault();


                const {
                    data: { user },
                    error: userError
                } =
                    await window.supabaseClient.auth.getUser();


                /* NOT LOGGED IN */

                if (userError || !user) {

                    document.getElementById("login-modal")
                        .style.display = "flex";

                    return;
                }


                /* SELLER */

                if (user.id === window.currentSellerId) {

                    alert(
                        "Nuk mund t'i bësh ofertë produktit tënd!"
                    );

                    return;
                }


                /* CLEAR OLD INPUT */

                document.getElementById(
                    "offer-price-input"
                ).value = "";

                document.getElementById(
                    "offer-error"
                ).textContent = "";


                /* OPEN MODAL */

                document.getElementById(
                    "offer-modal"
                ).style.display = "flex";

            };

        }


        /* =========================================
           BUY PAYPAL
        ========================================= */

        const buyBtn =
            document.getElementById("buy-bracelet-btn");


        if (buyBtn) {

            buyBtn.onclick = async function(e) {

                e.preventDefault();

                buyBtn.innerText = "Loading PayPal...";


                try {

                    const response = await fetch(
                        "https://gnwsrmelmeqduhhmfmoa.supabase.co/functions/v1/create-paypal-order",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                product_id: productId,

                                price: data.price,

                                product_name:
                                    (data.brand || "Strap") +
                                    " " +
                                    (data.model || "")

                            })
                        }
                    );


                    const result =
                        await response.json();


                    if (result.paypal_link) {

                        window.location.href =
                            result.paypal_link;

                    } else {

                        alert(
                            "PayPal link nuk u krijua"
                        );

                        buyBtn.innerText =
                            "Buy Now (PayPal)";
                    }


                } catch(error) {

                    console.error(error);

                    alert("Gabim me PayPal");

                    buyBtn.innerText =
                        "Buy Now (PayPal)";
                }

            };

        }


        /* =========================================
           REQUEST / INQUIRY
        ========================================= */

        const requestBtn =
            document.getElementById("send-request-btn");


        if (requestBtn) {

            requestBtn.onclick = function() {

                window.location.href =
                    `messages.html?product_id=${productId}&title=` +
                    encodeURIComponent(
                        (data.brand || "Strap") +
                        " " +
                        (data.model || "")
                    );

            };

        }

    }


    /* =========================================
       ALL BRACELETS / STRAPS
    ========================================= */

    else {

        container.innerHTML =
            `
            <h2 style="
                padding-left:0;
                font-size:10px;
            ">
                Bracelets & Straps Collection
            </h2>

            <div
                id="straps-container"
                class="grid">
                Loading...
            </div>
            `;


        const gridContainer =
            document.getElementById(
                "straps-container"
            );


        const {
            data,
            error
        } =
            await window.supabaseClient
                .from("bracelets_straps")
                .select("*");


        if (
            error ||
            !data ||
            data.length === 0
        ) {

            gridContainer.innerHTML =
                "No bracelets or straps available.";

            return;
        }


        gridContainer.innerHTML =
            data.map(item => {

                let imgUrl =
                    "https://placeholder.co/600x400/222/fff?text=No+Image";

                let primaryImage = "";


                if (item.image_url) {

                    if (
                        Array.isArray(item.image_url) &&
                        item.image_url.length > 0
                    ) {

                        primaryImage =
                            item.image_url[0];

                    }

                    else if (
                        typeof item.image_url === "string"
                    ) {

                        try {

                            let parsed =
                                JSON.parse(
                                    item.image_url
                                );

                            primaryImage =
                                Array.isArray(parsed)
                                    ? parsed[0]
                                    : item.image_url;

                        } catch(e) {

                            primaryImage =
                                item.image_url;
                        }

                    }

                }


                if (
                    primaryImage &&
                    primaryImage !== "null" &&
                    primaryImage !== ""
                ) {

                    imgUrl =
                        primaryImage.startsWith("http")
                            ? primaryImage
                            : "https://gnwsrmelmeqduhhmfmoa.supabase.co/storage/v1/object/public/or-images/" +
                              primaryImage;
                }


                return `

                    <div
                        class="card"
                        onclick="
                            window.location.href=
                            'product-bracelets-straps.html?id=${item.id}'
                        "
                    >

                        <img
                            src="${imgUrl}"
                            alt="${item.brand || "Strap"}"
                        >

                        <h3 style="
                            margin:10px 0 5px 0;
                        ">
                            ${item.brand || "Bracelet / Strap"}
                        </h3>

                        <p style="
                            color:#aaa;
                            font-size:13px;
                            margin:0 0 8px 0;
                        ">
                            ${item.material || "/"}
                        </p>

                        <div
                            class="price"
                            style="
                                font-weight:bold;
                                color:gold;
                                margin-bottom:10px;
                            "
                        >
                            ${
                                item.price
                                    ? item.price + " €"
                                    : "Contact for price"
                            }
                        </div>

                        <button
                            class="btn-main btn-buy"
                            style="
                                width:100%;
                                padding:8px;
                                font-size:13px;
                            "
                            onclick="
                                event.stopPropagation();
                                window.location.href=
                                'product-bracelets-straps.html?id=${item.id}'
                            "
                        >
                            View Details
                        </button>

                    </div>

                `;

            }).join("");

    }

});


/* =========================================
   CLOSE OFFER MODAL
========================================= */

function closeOfferModal() {

    document.getElementById(
        "offer-modal"
    ).style.display = "none";


    document.getElementById(
        "offer-price-input"
    ).value = "";


    document.getElementById(
        "offer-error"
    ).textContent = "";

}


/* =========================================
   SUBMIT OFFER
========================================= */

async function submitOffer() {

    const input =
        document.getElementById(
            "offer-price-input"
        );

    const errorEl =
        document.getElementById(
            "offer-error"
        );


    const offerPrice =
        parseFloat(input.value);


    /* INVALID PRICE */

    if (
        !offerPrice ||
        offerPrice <= 0
    ) {

        errorEl.style.color =
            "#ff4444";

        errorEl.textContent =
            "Ju lutem vendosni një çmim të vlefshëm.";

        return;
    }


    /* LOADING */

    errorEl.style.color = "#fff";

    errorEl.textContent =
        "Duke dërguar ofertën...";


    /* GET USER */

    const {
        data: { user },
        error: userError
    } =
        await window.supabaseClient.auth.getUser();


    if (
        userError ||
        !user
    ) {

        errorEl.style.color =
            "#ff4444";

        errorEl.textContent =
            "Duhet të jeni i loguar!";

        return;
    }


    /* SELLER CANNOT OFFER */

    if (
        user.id ===
        window.currentSellerId
    ) {

        errorEl.style.color =
            "#ff4444";

        errorEl.textContent =
            "Nuk mund t'i bësh ofertë produktit tënd!";

        return;
    }


    /* =========================================
       INSERT OFFER
    ========================================= */

    const {
        data,
        error
    } =
        await window.supabaseClient
            .from("offers")
            .insert({

                product_id:
                    productId,

                buyer_id:
                    user.id,

                seller_id:
                    window.currentSellerId,

                offered_price:
                    offerPrice,

                status:
                    "pending"

            })
            .select()
            .single();


    /* ERROR */

    if (error) {

        console.error(
            "OFFER INSERT ERROR:",
            error
        );

        errorEl.style.color =
            "#ff4444";

        errorEl.textContent =
            "Gabim gjatë dërgimit: " +
            error.message;

        return;
    }


    /* SUCCESS */

    console.log(
        "OFFER CREATED:",
        data
    );


    errorEl.style.color =
        "#25D366";

    errorEl.textContent =
        "Oferta u dërgua me sukses!";


    /* CLOSE AFTER 1.5 SEC */

    setTimeout(() => {

        closeOfferModal();

    }, 1500);

}


/* =========================================
   CHANGE IMAGE
========================================= */

function changeImage(direction) {

    if (
        currentImages.length <= 1
    ) {
        return;
    }


    currentImgIndex += direction;


    if (
        currentImgIndex >=
        currentImages.length
    ) {

        currentImgIndex = 0;

    }


    if (
        currentImgIndex < 0
    ) {

        currentImgIndex =
            currentImages.length - 1;

    }


    document.getElementById(
        "main-photo"
    ).src =
        currentImages[
            currentImgIndex
        ];


    document.getElementById(
        "photo-count"
    ).innerText =
        (
            currentImgIndex + 1
        ) +
        " / " +
        currentImages.length;

}


/* =========================================
   MENU
========================================= */

function checkMenu(event) {

    if (event) {
        event.preventDefault();
    }

}


/* =========================================
   BOTTOM NAV HIDE ON SCROLL
========================================= */

let lastScrollTop = 0;

const nav =
    document.querySelector(
        ".bottom-nav"
    );


window.addEventListener(
    "scroll",
    () => {

        const scrollTop =
            window.pageYOffset ||
            document.documentElement.scrollTop;


        if (
            scrollTop >
                lastScrollTop &&
            scrollTop > 50
        ) {

            nav.classList.add(
                "nav-hidden"
            );

        } else {

            nav.classList.remove(
                "nav-hidden"
            );

        }


        lastScrollTop =
            scrollTop <= 0
                ? 0
                : scrollTop;

    }
);

</script>
