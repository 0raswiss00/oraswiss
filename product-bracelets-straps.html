    <style>
        body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #000; color: #fff; }
        .site-header { position: sticky; top: 0; z-index: 9999; background: #111; }
        .nav-scroll { display: flex; gap: 18px; align-items: center; overflow-x: auto; padding: 14px 16px; }
        .nav-scroll a { color: #fff; text-decoration: none; padding: 6px 10px; }
        .nav-scroll a:hover { color: gold; }
        .site-title { font-weight: 700; line-height: 1.05; margin-right: 10px; }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 10px;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .card {
            background: #111;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #333;
            cursor: pointer;
        }

        .card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            display: block;
            border-radius: 8px;
        }

        .btn-main {
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-secondary {
            background: #333;
            color: #fff;
            border: 1px solid #555;
        }
        .btn-secondary:hover { background: #444; }
        .btn-buy {
            background: gold;
            color: #000;
        }
        .btn-buy:hover { background: #e6c200; }

        /* Stilimi i butonave të zgjedhjes së Bracelet/Strap */
        .bracelet-options-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 15px 0;
        }
        .bracelet-pill {
            background: #222;
            color: #ccc;
            border: 1px solid #444;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .bracelet-pill:hover, .bracelet-pill.active {
            background: gold;
            color: #000;
            border-color: gold;
            font-weight: bold;
        }

        .bottom-nav {
            position: fixed !important;
            bottom: 20px !important;
            left: 15px !important;
            right: 15px !important;
            width: auto !important;
            height: 65px !important;
            background-color: #1a1a1a !important;
            display: flex !important;
            justify-content: space-around !important;
            align-items: center !important;
            padding: 0 5px !important;
            border-radius: 20px !important;
            border: 1px solid #333 !important;
            box-shadow: 0 5px 20px rgba(0,0,0,0.8) !important;
            z-index: 999999 !important;
        }

        .bottom-nav a, .bottom-nav button {
            color: #ffffff !important;
            text-decoration: none !important;
            font-size: 10px !important;
            text-align: center !important;
            white-space: nowrap !important;
            flex: 1 !important;
            background: none !important;
            border: none !important;
            cursor: pointer !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            gap: 3px !important;
        }

        .bottom-nav a:hover { color: gold !important; }

        body {
            padding-bottom: 110px !important;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.js"></script>
</head>
<body>

<header class="site-header">
    <nav class="nav-scroll">
        <span class="site-title">ORA<br>SWISS</span>
        <a href="index.html">Home</a>
        <a href="luxury.html">Luxury</a>
        <a href="vintage.html">Vintage</a>
        <a href="parts.html">Parts</a>
        <a href="product-bracelets-straps.html" style="color: gold;">Bracelet/Strap</a>
        <a href="service.html">Service</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<div id="content-container" style="padding: 10px;">
    Loading...
</div>

<script>
    const supabase = window.supabase.createClient(
        "https://gnwsrmelmeqduhhmfmoa.supabase.co", 
        "sb_publishable__AkK_Z7lhtkvukN6Fy1cAQ_KBTXIcY9"
    );

    const urlParams = new URLSearchParams(window.location.search);
    const itemId = urlParams.get('id');

    async function initPage() {
        const container = document.getElementById("content-container");

        if (itemId) {
            // NËSE KA ID: Shfaq detajet e plota të këtij rripi/byzylyku dhe mundësinë e blerjes me PayPal
            const { data, error } = await supabase
                .from('bracelets_straps')
                .select('*')
                .eq('id', itemId)
                .single();

            if (error || !data) {
                container.innerHTML = "<h2 style='color:red; text-align:center;'>Produkti nuk u gjest ose ndodhi një gabim!</h2>";
                return;
            }

            let imgUrl = "https://placeholder.co/600x400/222/fff?text=No+Image";
            if (data.image_url && data.image_url.length > 0) {
                let primaryImage = Array.isArray(data.image_url) ? data.image_url[0] : data.image_url;
                if (primaryImage && primaryImage !== 'null' && primaryImage !== '') {
                    imgUrl = primaryImage.startsWith('http') ? primaryImage : "https://gnwsrmelmeqduhhmfmoa.supabase.co/storage/v1/object/public/or-images/" + primaryImage;
                }
            }

            container.innerHTML = `
                <div style="max-width: 600px; margin: 0 auto; background: #111; padding: 20px; border-radius: 10px; border: 1px solid #333;">
                    <img src="${imgUrl}" alt="${data.brand || 'Strap'}" style="width:100%; height: 300px; object-fit: cover; border-radius: 8px;">
                    
                    <h2 style="margin-top: 15px;">${data.brand || 'Bracelet / Strap'} - ${data.model || ''}</h2>
                    
                    <p style="color:#aaa; font-size:14px; margin:5px 0;">Material: ${data.material || '/'}</p>
                    <p style="color:#aaa; font-size:14px; margin:5px 0;">Condition: ${data.condition || '/'}</p>

                    <!-- Butonat e zgjedhjes së llojit të rripit (Bracelet Type options) -->
                    <div style="margin: 15px 0;">
                        <label style="font-size: 13px; color: #aaa; display: block; margin-bottom: 5px;">Zgjidh Llojin e Rripit / Bracelet Type:</label>
                        <div class="bracelet-options-container">
                            <button type="button" class="bracelet-pill ${data.material === 'Steel' ? 'active' : ''}" onclick="selectBraceletType(this, 'Steel')">Steel</button>
                            <button type="button" class="bracelet-pill ${data.material === 'Leather' ? 'active' : ''}" onclick="selectBraceletType(this, 'Leather')">Leather</button>
                            <button type="button" class="bracelet-pill ${data.material === 'Rubber' ? 'active' : ''}" onclick="selectBraceletType(this, 'Rubber')">Rubber</button>
                            <button type="button" class="bracelet-pill ${data.material === 'Nato' ? 'active' : ''}" onclick="selectBraceletType(this, 'Nato')">Nato</button>
                            <button type="button" class="bracelet-pill ${data.material === 'Gold' ? 'active' : ''}" onclick="selectBraceletType(this, 'Gold')">Gold</button>
                            <button type="button" class="bracelet-pill ${data.material === 'Titanium' ? 'active' : ''}" onclick="selectBraceletType(this, 'Titanium')">Titanium</button>
                            <button type="button" class="bracelet-pill ${data.material === 'Mesh' ? 'active' : ''}" onclick="selectBraceletType(this, 'Mesh')">Mesh</button>
                            <button type="button" class="bracelet-pill ${data.material === 'Alligator' ? 'active' : ''}" onclick="selectBraceletType(this, 'Alligator')">Alligator</button>
                        </div>
                    </div>
                    
                    <div class="price" style="font-weight:bold; color:gold; font-size: 22px; margin: 15px 0;">
                        ${data.price ? data.price + ' €' : 'Contact for price'}
                    </div>

                    <div style="background: #1a1a1a; padding: 15px; border-radius: 8px; margin: 15px 0; border: 1px solid #333;">
                        <h4 style="margin: 0 0 10px 0; color: #fff;">Description</h4>
                        <p style="color: #ccc; line-height: 1.5; margin: 0; white-space: pre-line;">${data.description || data.detajet || 'Nuk ka përshkrim shtesë për këtë produkt.'}</p>
                    </div>

                    <!-- Butoni i PayPal lidhur njëlloj si te produktet e tjera -->
                    <button id="buy-bracelet-btn" class="btn-main btn-buy" style="width:100%; margin-top:10px;">🛒 Buy Now (PayPal)</button>
                </div>
            `;

            // Lidhja funksionale e butonit të blerjes me endpoint-in e PayPal
            const buyBtn = document.getElementById("buy-bracelet-btn");
            if (buyBtn) {
                buyBtn.onclick = async function(e) {
                    e.preventDefault();
                    buyBtn.innerText = "⏳ Loading...";
                    try {
                        const response = await fetch(
                            "https://gnwsrmelmeqduhhmfmoa.supabase.co/functions/v1/create-paypal-order",
                            {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({
                                    product_id: itemId,
                                    price: data.price,
                                    product_name: (data.brand || 'Strap') + ' ' + (data.model || '')
                                })
                            }
                        );
                        const result = await response.json();
                        if (result.paypal_link) {
                            window.location.href = result.paypal_link;
                        } else {
                            alert("PayPal link nuk u krijua");
                            buyBtn.innerText = "🛒 Buy Now (PayPal)";
                        }
                    } catch(error) {
                        console.error(error);
                        alert("Gabim me PayPal");
                        buyBtn.innerText = "🛒 Buy Now (PayPal)";
                    }
                };
            }

        } else {
            // NËSE NUK KA ID: Shfaq listën e plotë (Vitrinën)
            container.innerHTML = `<h2 style="padding-left: 0;">Bracelets & Straps Collection</h2><div id="straps-container" class="grid">Loading...</div>`;
            const gridContainer = document.getElementById("straps-container");

            const { data, error } = await supabase
                .from('bracelets_straps')
                .select('*');

            if (error) {
                console.error("Gabim gjatë marrjes së rripave:", error);
                gridContainer.innerHTML = "Error loading items.";
                return;
            }

            if (!data || data.length === 0) {
                gridContainer.innerHTML = "No bracelets or straps available.";
                return;
            }

            gridContainer.innerHTML = data.map(item => {
                let imgUrl = "https://placeholder.co/600x400/222/fff?text=No+Image";
                let primaryImage = "";

                if (item.image_url && item.image_url.length > 0) {
                    primaryImage = Array.isArray(item.image_url) ? item.image_url[0] : item.image_url;
                }

                if (primaryImage && primaryImage !== 'null' && primaryImage !== '') {
                    if (primaryImage.startsWith('http')) {
                        imgUrl = primaryImage;
                    } else {
                        imgUrl = "https://gnwsrmelmeqduhhmfmoa.supabase.co/storage/v1/object/public/or-images/" + primaryImage;
                    }
                }

                return `
                    <div class="card" onclick="window.location.href='product-bracelets-straps.html?id=${item.id}'">
                        <img src="${imgUrl}" alt="${item.brand || 'Strap'}">
                        <h3>${item.brand || 'Bracelet / Strap'}</h3>
                        <p style="color:#aaa; font-size:14px; margin:5px 0;">Material: ${item.material || '/'}</p>
                        <div class="price" style="font-weight:bold; color:gold;">${item.price ? item.price + ' €' : 'Contact for price'}</div>
                        
                        <button class="btn-main btn-buy" 
                        style="width:100%; margin-top:10px;"
                        onclick="event.stopPropagation(); window.location.href='product-bracelets-straps.html?id=${item.id}'">
                        🛒 View Details
                        </button>
                    </div>
                `;
            }).join('');
        }
    }

    // Funksioni për zgjedhjen vizuale të opsioneve të rripit
    function selectBraceletType(element, typeName) {
        const container = element.parentElement;
        container.querySelectorAll('.bracelet-pill').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
        console. u zgjodh lloji: + typeName;
    }

    initPage();
</script>

</nav>

</body>
