<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | Ora Swiss</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-KD2ZZ3MJYY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-KD2ZZ3MJYY');
  </script>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="auth-page">
    <div class="auth-card register-form">
      <button class="back-btn" onclick="history.back()">← Back</button>

      <h2>Sign Up</h2>
      <!-- Emri Publik / Dyqani -->
      <input id="username" placeholder="Emri i përdoruesit (Shembull: OraSwiss_Official)" autocomplete="username" />
      
      <input id="fullName" placeholder="Full Name (Shembull: Filan Fisteku)" autocomplete="name" />
      <input id="phone" placeholder="Phone (Shembull: +355691234567)" autocomplete="tel" />
      <input id="country" placeholder="Country (Shembull: Albania)" autocomplete="country-name" />
      <input id="street" placeholder="Rruga (Shembull: Rr. Durrësit)" autocomplete="street-address" />
      <input id="houseNumber" placeholder="Nr. Shtëpisë (Shembull: Nd. 12, H. 2)" />
      <input id="zipCode" placeholder="Kodi Postar (Shembull: 1001)" autocomplete="postal-code" />
      <input id="email" type="email" placeholder="Email (Shembull: emer@gmail.com)" autocomplete="email" autocapitalize="none" />
      <input id="password" type="password" placeholder="Password" autocomplete="new-password" />
      
      <button id="btnRegister" type="button" class="auth-btn">Register</button>

      <div class="auth-sep"></div>

      <h2>Login</h2>

      <input id="loginEmail" type="email" placeholder="Email" autocomplete="email">
      <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">

      <p>
        <a href="#" id="forgotPassword">Forgot Password?</a>
      </p>

      <button id="btnLogin" type="button" class="auth-btn">
        Login
      </button>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm";

    const supabaseUrl = 'https://gnwsrmelmeqduhhmfmoa.supabase.co';
    const supabaseKey = 'sb_publishable__AkK_Z7lhtkvukN6Fy1cAQ_KBTXIcY9'; 
    const supabase = createClient(supabaseUrl, supabaseKey);

    window.addEventListener("DOMContentLoaded", () => {

      const btnReg = document.getElementById("btnRegister");
      
      // REGJISTRIMI
      btnReg.addEventListener("click", async () => {
        const username = document.getElementById("username").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const fullName = document.getElementById("fullName").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const country = document.getElementById("country").value.trim();
        const street = document.getElementById("street").value.trim();
        const houseNumber = document.getElementById("houseNumber").value.trim();
        const zipCode = document.getElementById("zipCode").value.trim();

        if (!email || !password || !username) {
          alert("Ju lutem plotësoni Username, Email dhe Password.");
          return;
        }

        try {
          // 1. Krijimi i llogarisë me Auth
          const { data, error } = await supabase.auth.signUp({
            email: email,
            password: password,
            options: {
              data: {
                custom_username: username,
                full_name: fullName,
                phone: phone,
                country: country,
                street: street,
                house_number: houseNumber,
                zip_code: zipCode
              }
            }
          });

          if (error) throw error;

          // 2. Ruajtja e profilëve në tabelën 'profiles'
          if (data.user) {
            const { error: profileError } = await supabase
              .from("profiles")
              .insert({
                id: data.user.id, // Përdor 'id' për të lidhur profilin me përdoruesin
                user_id: data.user.id,
                custom_username: username,
                email: email,
                full_name: fullName,
                phone: phone,
                country: country,
                street: street,
                house_number: houseNumber,
                zip_code: zipCode,
                role: "buyer"
              });

            if (profileError) {
              console.error("Gabim te profili:", profileError);
            }
          }

          alert("Regjistrimi u krye me sukses! Konfirmo emailin tuaj.");
          
          const params = new URLSearchParams(window.location.search);
          const redirect = params.get("redirect");
          window.location.href = redirect || "index.html";

        } catch (e) {
          alert("Gabim gjatë regjistrimit: " + e.message);
        }
      });

      // LOGIN
      const btnLog = document.getElementById("btnLogin");
      if (btnLog) {
        btnLog.addEventListener("click", async () => {
          const email = document.getElementById("loginEmail").value.trim();
          const password = document.getElementById("loginPassword").value;

          try {
            const { data, error } = await supabase.auth.signInWithPassword({
              email: email,
              password: password,
            });

            if (error) throw error;

            const params = new URLSearchParams(window.location.search);
            const redirect = params.get("redirect");
            window.location.href = redirect || "index.html";
          } catch (e) {
            alert(e.message);
          }
        });
      }

      // FORGOT PASSWORD
      const forgotPasswordLink = document.getElementById("forgotPassword");
      if (forgotPasswordLink) {
        forgotPasswordLink.addEventListener("click", async (e) => {
          e.preventDefault();
          const email = document.getElementById("loginEmail").value.trim();
          
          if (!email) {
            alert("Ju lutem shkruani email-in tuaj në fushën e login-it.");
            return;
          }

          const { error } = await supabase.auth.resetPasswordForEmail(email, {
            redirectTo: 'https://oraswiss.com/update-password.html',
          });

          if (error) {
            alert(error.message);
          } else {
            alert("Një email për rivendosjen e fjalëkalimit është dërguar.");
          }
        });
      }
    });
  </script>
</body> 
</html>
