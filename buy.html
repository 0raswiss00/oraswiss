<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <title>Porositë e mia - Ora Swiss</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #0a0a0a; color: #fff; }
        table { width: 100%; border-collapse: collapse; background: #141414; margin-top: 20px; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px; border: 1px solid #262626; text-align: left; }
        th { background-color: #1f1f1f; color: #d4af37; }
        button { padding: 8px 12px; background: #d4af37; color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:hover { background: #b3922f; }
        .btn-feedback { background: #25D366; color: #fff; }
        .btn-feedback:hover { background: #1ebd56; }
    </style>
</head>
<body>
    <h1>Porositë e mia</h1>
    <table id="orders-table">
        <thead>
            <tr>
                <th>Ora / Produkti</th>
                <th>Statusi</th>
                <th>Nr. Dërgimi</th>
                <th>Veprime</th>
            </tr>
        </thead>
        <tbody id="orders-body">
            <tr><td colspan="4" style="text-align:center;">Duke u ngarkuar...</td></tr>
        </tbody>
    </table>

    <div id="myOraSwissMenu" style="margin-top:20px;">
        ✉️ Messages <span id="messageCount">0</span>
    </div>

    <!-- Modal për dërgimin e Feedback-ut -->
    <div id="feedback-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9999; justify-content:center; align-items:center;">
        <div style="background:#111; border:1px solid #333; padding:30px; border-radius:16px; width:90%; max-width:400px; color:#fff; position:relative;">
            <h3 style="margin-top:0; color:#d4af37;">Lër një vlerësim</h3>
            
            <input type="hidden" id="fb-seller-id">
            <input type="hidden" id="fb-order-id">

            <label style="font-size:0.85rem; color:#a3a3a3;">Tipi i vlerësimit:</label>
            <select id="fb-type" style="width:100%; padding:10px; margin:5px 0 15px 0; background:#222; color:#fff; border:1px solid #444; border-radius:8px;">
                <option value="positive">Pozitiv 🟢</option>
                <option value="neutral">Neutral 🟡</option>
                <option value="negative">Negativ 🔴</option>
            </select>

            <label style="font-size:0.85rem; color:#a3a3a3;">Komenti yt:</label>
            <textarea id="fb-comment" placeholder="Shkruaj komentin tënd për këtë blerje..." style="width:100%; height:80px; padding:10px; margin-bottom:15px; background:#222; color:#fff; border:1px solid #444; border-radius:8px; box-sizing:border-box; resize:none;"></textarea>
            
            <button onclick="submitOrderFeedback()" style="width:100%; padding:12px; background:#25D366; color:#fff; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Dërgo Vlerësimin</button>
            <button onclick="document.getElementById('feedback-modal').style.display='none'" style="width:100%; padding:8px; background:transparent; color:#aaa; border:none; margin-top:8px; cursor:pointer;">Anulo</button>
            <p id="fbMsg" style="text-align:center; font-size:0.85rem; margin-top:10px;"></p>
        </div>
    </div>

<script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm";

    const supabase = createClient(
        "https://gnwsrmelmeqduhhmfmoa.supabase.co",
        "sb_publishable__AkK_Z7lhtkvukN6Fy1cAQ_KBTXIcY9"
    );

    // Bëjmë supabase të disponueshëm globalisht për skriptat e tjera
    window.supabaseClient = supabase;

    async function loadOrders() {
        const ordersBody = document.getElementById('orders-body');
        if (!ordersBody) return;

        // 1. Marrrim përdoruesin e loguar
        const { data: { user }, error: authError } = await supabase.auth.getUser();
        if (authError || !user) {
            window.location.href = "login.html";
            return;
        }

        // 2. Marrrim vetëm porositë e këtij blerësi
        const { data, error } = await supabase
            .from('orders')
            .select('*')
            .eq('buyer_id', user.id);

        if (error) {
            console.error("Gabim gjatë marrjes së porosive:", error);
            ordersBody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:red;">Gabim në ngarkimin e porosive.</td></tr>`;
            return;
        }

        if (!data || data.length === 0) {
            ordersBody.innerHTML = `<tr><td colspan="4" style="text-align:center;">Nuk keni asnjë porosi aktive.</td></tr>`;
            return;
        }

        // 3. Gjenerojmë rreshtat e tabelës
        ordersBody.innerHTML = data.map(order => {
            // Kontrollojmë nëse porosia ka përfunduar (mund të përshtatësh vlerën e statusit sipas database-it tënd, p.sh. 'completed' ose 'sold')
            const isCompleted = order.status === 'completed' || order.status === 'sold' || order.status === 'delivered';
            
            return `
                <tr>
                    <td>Prod ID: #${order.product_id}</td>
                    <td>${order.status}</td>
                    <td>${order.tracking_number || order.tracing_number || 'N/A'}</td>
                    <td>
                        <button onclick="alert('Detajet e porosisë #${order.id}')">Detaje</button>
                        ${isCompleted ? `<button class="btn-feedback" onclick="openFeedback('${order.seller_id}', '${order.id}')">Lër Vlerësim</button>` : ''}
                    </td>
                </tr>
            `;
        }).join('');
    }

    // Funksioni për të hapur modalin e feedback-ut
    window.openFeedback = function(sellerId, orderId) {
        document.getElementById('fb-seller-id').value = sellerId;
        document.getElementById('fb-order-id').value = orderId;
        document.getElementById('fb-comment').value = '';
        document.getElementById('fbMsg').textContent = '';
        document.getElementById('feedback-modal').style.display = 'flex';
    }

    // Funksioni për dërgimin e feedback-ut në Supabase
    window.submitOrderFeedback = async function() {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) return;

        const sellerId = document.getElementById('fb-seller-id').value;
        const orderId = document.getElementById('fb-order-id').value;
        const type = document.getElementById('fb-type').value;
        const comment = document.getElementById('fb-comment').value.trim();
        const msg = document.getElementById('fbMsg');

        if (!comment) {
            msg.style.color = "#ef4444";
            msg.textContent = "Ju lutem shkruani një koment.";
            return;
        }

        msg.style.color = "#fff";
        msg.textContent = "Duke dërguar...";

        const { error } = await supabase
            .from('feedback')
            .insert({
                seller_id: sellerId,
                buyer_id: user.id,
                order_id: orderId,
                type: type,
                comment: comment,
                rating: type === 'positive' ? 5 : (type === 'neutral' ? 3 : 1)
            });

        if (error) {
            msg.style.color = "#ef4444";
            msg.textContent = "Gabim: " + error.message;
            return;
        }

        msg.style.color = "#22c55e";
        msg.textContent = "Vlerësimi u dërgua me sukses!";
        setTimeout(() => {
            document.getElementById('feedback-modal').style.display = 'none';
            window.location.reload();
        }, 1500);
    }

    async function loadMessageCount() {
        const { data: { user }, error } = await supabase.auth.getUser();
        if (error || !user) return;

        const { data: buyerChats } = await supabase.from("conversations").select("unread_buyer").eq("buyer_id", user.id);
        const { data: sellerChats } = await supabase.from("conversations").select("unread_seller").eq("seller_id", user.id);

        let total = 0;
        buyerChats?.forEach(c => { total += c.unread_buyer || 0; });
        sellerChats?.forEach(c => { total += c.unread_seller || 0; });

        const countEl = document.getElementById("messageCount");
        if(countEl) countEl.innerText = total;
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadOrders();
        loadMessageCount();
    });
</script>

</body>
</html>
