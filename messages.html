<!DOCTYPE html>
<html>

<head>

<title>Messages - Oraswiss</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
    font-family:Arial;
    background:#f5f5f5;
    margin:0;
}

.header{
    background:#000;
    color:white;
    padding:15px;
    text-align:center;
}


.chat{
    background:white;
    margin:10px;
    padding:15px;
    border-radius:12px;
    cursor:pointer;
}


.count{
    float:right;
    background:black;
    color:white;
    padding:5px 10px;
    border-radius:20px;
}

</style>

</head>


<body>


<div class="header">
💬 Messages
</div>


<div id="chatList"></div>



<script type="module">


import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm";



const supabase =
createClient(

"https://gnwsrmelmeqduhhmfmoa.supabase.co",

"sb_publishable__AkK_Z7lhtkvukN6Fy1cAQ_KBTXIcY9"

);





async function loadChats(){


const {data:{user},error}
=
await supabase.auth.getUser();



if(error || !user)
return;



const {data:conversations,error:convError}
=
await supabase
.from("conversations")
.select("*")
.or(
user_one_id.eq.${user.id},user_two_id.eq.${user.id}
)
.order(
"updated_at",
{
ascending:false
}
);



if(convError){

console.error(convError);
return;

}




const box =
document.getElementById("chatList");


box.innerHTML="";



for(const chat of conversations){



let otherUser;



if(chat.user_one_id === user.id){

otherUser =
chat.user_two_id;

}
else{

otherUser =
chat.user_one_id;

}




const {count}
=
await supabase
.from("messages")
.select(
"*",
{
count:"exact",
head:true
}
)
.eq(
"conversation_id",
chat.id
);



const div =
document.createElement("div");


div.className="chat";



div.innerHTML=`

<b>User:</b> ${otherUser}

<br>

${chat.last_message || "No messages"}

<span class="count">

${count || 0}

</span>

`;



div.onclick=()=>{


window.location.href =

"messages.html?conversation="

+chat.id;


};



box.appendChild(div);



}


}



loadChats();



supabase
.channel("conversation-update")
.on(
"postgres_changes",
{
event:"*",
schema:"public",
table:"conversations"
},
()=>{

loadChats();

}
)
.subscribe();



</script>


</body>

</html>
