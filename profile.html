<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profile - Ora Swiss</title>

  <style>
    :root {
      --bg-color: #0a0a0a;
      --card-bg: #141414;
      --border-color: #262626;
      --text-main: #ffffff;
      --text-muted: #a3a3a3;
      --accent: #d4af37;
      --accent-hover: #b3922f;
      --danger: #ef4444;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      line-height: 1.5;
    }

    .wrap {
      max-width: 560px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .profile-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent);
      background: #1f1f1f;
    }

    h2 {
      margin-top: 0;
      font-size: 1.3rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 16px;
      color: var(--accent);
    }

    h3 {
      font-size: 1.1rem;
      color: var(--accent);
      margin-top: 24px;
      margin-bottom: 12px;
    }

    p {
      margin: 8px 0;
      color: var(--text-muted);
    }

    p b {
      color: var(--text-main);
    }

    #sellerTitle {
      font-size: 1.6rem;
      margin: 0 0 4px 0;
      color: var(--text-main);
    }

    .joined-date {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: #1f1f1f;
      color: var(--text-main);
      font-size: 0.95rem;
      box-sizing: border-box;
      margin-bottom: 12px;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }

    input[type="file"] {
      padding: 8px;
      background: #1a1a1a;
      cursor: pointer;
    }

    button {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #000;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }

    button:hover {
      background: var(--accent-hover);
    }

    #btnLogout {
      background: transparent;
      border: 1px solid var(--danger);
      color: var(--danger);
      margin-top: 16px;
    }

    #btnLogout:hover {
      background: var(--danger);
      color: #fff;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    #sellerWatches li {
      background: #1f1f1f;
      border: 1px solid var(--border-color);
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .feedback-stats {
      display: flex;
      gap: 15px;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
    }
    .stat-box {
      flex: 1;
      background: #1f1f1f;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid var(--border-color);
    }
    .stat-box span {
      display: block;
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--accent);
    }
    .stat-box label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    #feedbackList li {
      background: #1a1a1a;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-bottom: 8px;
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: border-color 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #feedbackList li:hover {
      border-color: var(--accent);
    }
    .badge-positive { color: #22c55e; font-weight: bold; }
    .badge-negative { color: #ef4444; font-weight: bold; }
    .badge-neutral { color: #eab308; font-weight: bold; }

    .private-field { display: none; }
    
    #verifyMsg, #profileMsg, #msg {
      font-size: 0.9rem;
      font-weight: 500;
      margin-top: 8px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 16px;
      transition: color 0.2s;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      width: auto;
    }

    .back-btn:hover {
      color: var(--accent);
    }
  </style> 
</head>

<body>
  <div class="wrap">
    <button class="back-btn" onclick="history.back()">❮ Kthehu mbrapa</button>

    <div class="card">
      <div class="profile-header">
        <img id="profileAvatarImg" src="" alt="Avatar" class="profile-avatar" style="display:none;">
        <div id="profileAvatarPlaceholder" class="profile-avatar" style="display:flex; align-items:center; justify-content:center; font-size:1.5rem; color:var(--accent);">👤</div>
        <div>
          <h1 id="sellerTitle">Shitës</h1>
          <div class="joined-date" id="profileJoined">Anëtar që nga -</div>
          <p id="profileRole" style="color:var(--accent); font-weight:600; margin:0; font-size:0.9rem;"></p>
        </div>
      </div>
    </div>

    <div class="card" id="publicListingsCard">
      <h2>Artikujt e Shitësit</h2>
      <ul id="sellerWatches">
        <p style="text-align:center; color:var(--text-muted);">Duke u ngarkuar...</p>
      </ul>
    </div>

    <div class="card" id="editProfileCard" style="display:none;">
      <h2>Përditëso Profilin</h2>
      <form id="profileForm">
        <label>Emri i Përdoruesit (Username)</label>
        <input type="text" id="inputUsername" placeholder="Shkruaj username...">

        <label>Emri i Plotë / Kompania</label>
        <input type="text" id="inputFullName" placeholder="Emri yt...">

        <label>Foto e Profilit</label>
        <input type="file" id="inputAvatarFile" accept="image/*">

        <button type="submit" id="btnSaveProfile">Ruaj Ndryshimet</button>
        <div id="profileMsg"></div>
      </form>

      <button id="btnLogout">Dil nga Llogaria</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseClient = window.supabase.createClient(
        "https://gnwsrmelmeqduhhmfmoa.supabase.co",
        "sb_publishable__AkK_Z7lhtkvukN6Fy1cAQ_KBTXIcY9"
    );

    const urlParams = new URLSearchParams(window.location.search);
    const profileUserId = urlParams.get("id");

    async function initProfile() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      const targetId = profileUserId || (user ? user.id : null);

      if (!targetId) {
        document.getElementById("sellerTitle").textContent = "Nuk u gjet përdoruesi";
        document.getElementById("sellerWatches").innerHTML = "<p>Asnjë informacion.</p>";
        return;
      }

      const isMyProfile = user && user.id === targetId;

      if (isMyProfile) {
        document.getElementById("editProfileCard").style.display = "block";
      }

      // Merr profilin
      const { data: profile } = await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", targetId)
        .maybeSingle();

      const name = profile?.custom_username || profile?.full_name || "Ora Swiss Seller";
      document.getElementById("sellerTitle").textContent = name;

      if (profile?.image_url) {
        const img = document.getElementById("profileAvatarImg");
        img.src = profile.image_url;
        img.style.display = "block";
        document.getElementById("profileAvatarPlaceholder").style.display = "none";
      }

      const joinedDate = new Date(profile?.created_at || Date.now());
      document.getElementById("profileJoined").textContent = "Anëtar që nga " + joinedDate.toLocaleDateString("sq-AL", { month: "long", year: "numeric" });
      document.getElementById("profileRole").textContent = "(Pro Dealer)";

      if (isMyProfile && profile) {
        document.getElementById("inputUsername").value = profile.custom_username || "";
        document.getElementById("inputFullName").value = profile.full_name || "";
      }

      // Ngarko orët e shitësit
      const { data: watches } = await supabaseClient
        .from("oras")
        .select("*")
        .eq("user_id", targetId);

      const { data: bracelets } = await supabaseClient
        .from("bracelets_straps")
        .select("*")
        .eq("user_id", targetId);

      const allItems = [...(watches || []), ...(bracelets || [])];
      const listContainer = document.getElementById("sellerWatches");

      if (allItems.length === 0) {
        listContainer.innerHTML = "<p style='text-align:center; color:var(--text-muted);'>Ky përdorues nuk ka artikuj aktivë.</p>";
      } else {
        listContainer.innerHTML = "";
        allItems.forEach(item => {
          const cat = item.case_size ? "oras" : "bracelets_straps";
          const li = document.createElement("li");
          li.innerHTML = `
            <span><b>${item.brand || "Ora"}</b> - ${item.model || item.reference || "Artikull"}</span>
            <span style="color:var(--accent); font-weight:bold;">${item.price || 0} €</span>
          `;
          li.style.cursor = "pointer";
          li.onclick = () => {
            window.location.href = `product.html?id=${item.id}&category=${cat}`;
          };
          listContainer.appendChild(li);
        });
      }

      // Trajto ruajtjen e profilit
      if (isMyProfile) {
        document.getElementById("profileForm").onsubmit = async (e) => {
          e.preventDefault();
          const btn = document.getElementById("btnSaveProfile");
          const msg = document.getElementById("profileMsg");
          btn.textContent = "Duke ruajtur...";

          let imageUrl = profile?.image_url;
          const fileInput = document.getElementById("inputAvatarFile");
          if (fileInput.files.length > 0) {
            const file = fileInput.files[0];
            const filePath = `${user.id}/${Date.now()}_${file.name}`;
            const { error: uploadError } = await supabaseClient.storage.from("avatars").upload(filePath, file);
            if (!uploadError) {
              const { data: publicUrlData } = supabaseClient.storage.from("avatars").getPublicUrl(filePath);
              imageUrl = publicUrlData.publicUrl;
            }
          }

          const { error } = await supabaseClient
            .from("profiles")
            .update({
              custom_username: document.getElementById("inputUsername").value,
              full_name: document.getElementById("inputFullName").value,
              image_url: imageUrl
            })
            .eq("id", user.id);

          btn.textContent = "Ruaj Ndryshimet";
          if (error) {
            msg.style.color = "var(--danger)";
            msg.textContent = "Gabim: " + error.message;
          } else {
            msg.style.color = "#22c55e";
            msg.textContent = "Profil u përditësua me sukses!";
            setTimeout(() => location.reload(), 1000);
          }
        };

        document.getElementById("btnLogout").onclick = async () => {
          await supabaseClient.auth.signOut();
          window.location.href = "index.html";
        };
      }
    }

    initProfile();
  </script>
</body>
</html>
