    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #000;
            color: #fff;
            padding-bottom: 110px;
        }

        .site-header {
            position: sticky;
            top: 0;
            z-index: 9999;
            background: #111;
            border-bottom: 1px solid #333;
        }

        .nav-scroll {
            display: flex;
            gap: 14px;
            align-items: center;
            overflow-x: auto;
            padding: 8px 12px;
        }

        .nav-scroll a {
            color: #fff;
            text-decoration: none;
            padding: 4px 8px;
            font-size: 14px;
            white-space: nowrap;
        }

        .nav-scroll a:hover { color: gold; }

        .site-title {
            font-weight: 700;
            line-height: 1.05;
            margin-right: 6px;
            font-size: 10px;
            color: gold;
            white-space: nowrap;
        }

        .back-btn {
            background: #1a1a1a;
            color: #fff;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }

        .back-btn:hover { background: #262626; }

        .search-container {
            padding: 12px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px 12px;
        }

        .search-box:focus-within { border-color: gold; }

        .search-box input[type="text"] {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: none;
            color: #fff;
            outline: none;
            font-size: 14px;
        }

        /* Grid: 2 kolona në celular, 4 në kompjuter */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 12px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        @media (min-width: 1024px) {
            .grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 16px;
                padding: 16px;
            }
        }

        .card {
            background: #111;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #333;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: block;
            border-radius: 8px;
            background: #181818;
        }

        @media (min-width: 1024px) {
            .card img { height: 200px; }
        }

        .price {
            color: gold;
            font-weight: bold;
            margin: 8px 0;
            font-size: 1.05em;
        }

        .btn-card-action {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 8px;
            margin-top: 6px;
            background: #1c1c1c;
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            border: 1px solid #383838;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-card-action:hover {
            background: #282828;
            border-color: gold;
            color: gold;
        }

        /* Menuja lundruese */
        #myOraSwissMenu {
            display: none;
            position: fixed;
            bottom: 85px;
            right: 15px;
            width: 220px;
            background: #1a1a1a;
            border-radius: 15px;
            border: 1px solid #333;
            padding: 8px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.6);
            z-index: 1000000;
        }

        #myOraSwissMenu.active { display: block; }

        .menu-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 11px 10px;
            border-bottom: 1px solid #262626;
            cursor: pointer;
            color: #fff;
            font-size: 14px;
        }

        .menu-item-row:last-child { border-bottom: none; }
        .menu-item-row:hover { background: #282828; border-radius: 8px; }
        .menu-arrow { color: #888; font-weight: bold; }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 15px;
            right: 15px;
            height: 55px;
            background-color: #1a1a1a;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 5px;
            border-radius: 20px;
            border: 1px solid #333;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            z-index: 999999;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .bottom-nav.nav-hidden {
            transform: translateY(120px);
            opacity: 0;
            pointer-events: none;
        }

        .bottom-nav a, .bottom-nav button {
            color: #ffffff;
            text-decoration: none;
            font-size: 11px;
            text-align: center;
            white-space: nowrap;
            flex: 1;
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .bottom-nav a:hover, .bottom-nav button:hover { color: gold; }
    </style>

<script>
    let allOrasData = [];

    async function loadOras() {
        const container = document.getElementById("oras-container");

        if (!window.supabaseClient) {
            container.innerHTML = "<p style='color:red;'>Gabim në lidhjen me databazën.</p>";
            return;
        }

        const { data, error } = await window.supabaseClient
            .from('oras')
            .select('*')
            .eq('category', 'vintage');

        if (error) {
            container.innerHTML = "<p style='color:red;'>Gabim gjatë ngarkimit: " + error.message + "</p>";
            return;
        }

        if (!data || data.length === 0) {
            container.innerHTML = "<p style='padding:10px; color:#aaa;'>Nuk ka artikuj në këtë kategori.</p>";
            return;
        }

        allOrasData = data;
        renderCards(allOrasData);
    }

    function renderCards(items) {
        const container = document.getElementById("oras-container");

        if (!items || items.length === 0) {
            container.innerHTML = "<p style='padding:10px; color:#aaa;'>Nuk u gjet asnjë orë që i përgjigjet kërkimit tuaj.</p>";
            return;
        }

        let cardsHtml = "";

        items.forEach(ora => {
            let imgUrl = "https://placeholder.co/600x400/222/fff?text=No+Image";
            let primaryImage = "";

            if (ora.image_url) {
                if (Array.isArray(ora.image_url) && ora.image_url.length > 0) {
                    primaryImage = ora.image_url[0];
                } else if (typeof ora.image_url === 'string') {
                    try {
                        let parsed = JSON.parse(ora.image_url);
                        primaryImage = Array.isArray(parsed) ? parsed[0] : ora.image_url;
                    } catch (e) {
                        primaryImage = ora.image_url;
                    }
                }
            }

            if (primaryImage && primaryImage !== 'null' && primaryImage !== '') {
                if (primaryImage.startsWith('http')) {
                    imgUrl = primaryImage;
                } else {
                    const SUPABASE_URL = "https://gnwsrmelmeqduhhmfmoa.supabase.co";
                    imgUrl = SUPABASE_URL + "/storage/v1/object/public/or-images/" + primaryImage;
                }
            }

            cardsHtml += `
            <div class="card" onclick="window.location.href='product.html?id=${ora.id}'">
                <div>
                    <img src="${imgUrl}" alt="${ora.brand || 'Vintage Watch'}">
                    <h3 style="margin: 8px 0 2px 0; font-size: 15px; color: #fff;">${ora.brand || ''}</h3>
                    <div style="font-size: 13px; color: #ddd; font-weight: bold; margin-bottom: 2px;">${ora.model || ''}</div>
                    <div style="font-size: 12px; color: #aaa; margin-bottom: 6px;">${ora.reference ? 'Ref. ' + ora.reference : ''}</div>
                    <div class="price">${ora.price ? ora.price + ' €' : 'Contact for price'}</div>
                </div>
                <div>
                    <button type="button" class="btn-card-action" onclick="event.stopPropagation(); window.location.href='product.html?id=${ora.id}';">
                        View Details
                    </button>
                </div>
            </div>`;
        });

        container.innerHTML = cardsHtml;
    }

    const searchInput = document.getElementById("searchInput");
    if (searchInput) {
        searchInput.addEventListener("input", function(e) {
            const query = e.target.value.toLowerCase().trim();
            const filtered = allOrasData.filter(ora => {
                const brand = (ora.brand || "").toLowerCase();
                const model = (ora.model || "").toLowerCase();
                const reference = (ora.reference || "").toLowerCase();
                const description = (ora.description || "").toLowerCase();
                return brand.includes(query) || model.includes(query) || reference.includes(query) || description.includes(query);
            });
            renderCards(filtered);
        });
    }

    function toggleLocalMenu(event) {
        if (event) event.stopPropagation();
        const menu = document.getElementById('myOraSwissMenu');
        if (menu) {
            menu.classList.toggle('active');
        } else if (typeof window.toggleMenu === 'function') {
            window.toggleMenu();
        }
    }

    document.addEventListener('click', function(e) {
        const menu = document.getElementById('myOraSwissMenu');
        if (menu && menu.classList.contains('active') && !menu.contains(e.target)) {
            menu.classList.remove('active');
        }
    });

    let lastScrollTop = 0;
    const nav = document.querySelector(".bottom-nav");
    window.addEventListener("scroll", () => {
        const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
        if (scrollTop > lastScrollTop && scrollTop > 50) {
            nav.classList.add("nav-hidden");
        } else {
            nav.classList.remove("nav-hidden");
        }
        lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
    });

    loadOras();
</script>

</body>
