<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add New Bracelet / Strap</title>
<style>
body { background:#111; color:white; font-family:Arial, sans-serif; }
form { max-width:600px; margin:30px auto; background:#1b1b1b; padding:25px; border-radius:10px; }
h2 { text-align:center; }
label { display:block; margin-top:12px; margin-bottom:5px; color:#ccc; }
input, select, textarea { width:100%; padding:10px; background:#222; color:white; border:1px solid #444; border-radius:5px; box-sizing:border-box; }
.row { display:flex; gap:15px; margin-top:10px; }
.row > * { flex:1; }
button { width:100%; margin-top:20px; padding:12px; background:#c9a227; color:white; border:none; border-radius:5px; font-size:16px; cursor:pointer; }
button:hover { opacity:.8; }
</style>
</head>
<body>

<div style="display: flex; align-items: center; justify-content: space-between; padding: 5px 0; margin-bottom: 15px;">
    <button type="button" onclick="window.location.href='index.html'" style="background: #d4af37; color: #000; border: none; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; padding: 4px 10px;">Back</button>
</div>
<h2 style="margin: 0; font-size: 18px; color: #fff; text-align: center;">Add New Bracelet / Strap</h2>

<form id="sellBraceletForm">
    <input type="hidden" id="category" value="bracelets_straps">

    <div class="row">
        <input id="brand" type="text" placeholder="Brand (e.g., Rolex, Omega)" required>
        <input id="model" type="text" placeholder="Model / Series" required>
    </div>

    <label>Price (€)</label>
    <input id="price" type="number" required>

    <label>Type</label>
    <select id="type">
        <option value="Bracelet">Bracelet</option>
        <option value="Strap">Strap</option>
        <option value="Buckle">Buckle</option>
    </select>

    <label>Condition</label>
    <select id="condition">
        <option value="New">New</option>
        <option value="Mint">Mint</option>
        <option value="Used">Used</option>
    </select>

    <div class="row">
        <div>
            <label>Material</label>
            <input id="material" type="text" placeholder="Steel, Leather, Rubber...">
        </div>
        <div>
            <label>Color</label>
            <input id="color" type="text" placeholder="Black, Brown, Silver...">
        </div>
    </div>

    <div class="row">
        <div>
            <label>Lug Width (mm)</label>
            <input id="lug_width" type="text" placeholder="20mm">
        </div>
        <div>
            <label>Length (cm)</label>
            <input id="length" type="text" placeholder="19cm">
        </div>
    </div>

    <label>Country</label>
    <select id="country">
        <option value="Albania">Albania</option>
        <option value="Switzerland">Switzerland</option>
        <option value="Italy">Italy</option>
        <option value="Germany">Germany</option>
    </select>

    <label>Reference Number</label>
    <input id="reference" type="text" placeholder="Reference">

    <label>Year</label>
    <input id="year" type="number">

    <label>Description</label>
    <textarea id="description" rows="5" placeholder="Description..."></textarea>

    <label>Upload Photos</label>
    <input id="fileInput" type="file" accept="image/*" multiple>

    <button type="submit">Publish Bracelet / Strap</button>
</form>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase = createClient(
    'https://gnwsrmelmeqduhhmfmoa.supabase.co',
    'sb_publishable__AkK_Z7lhtkvukN6Fy1cAQ_KBTXIcY9'
);

const { data: { user } } = await supabase.auth.getUser();
if(!user){
    alert("Duhet të jesh i loguar!");
    window.location.href="register.html";
}

document.getElementById("sellBraceletForm").addEventListener("submit", async function(e){
    e.preventDefault();

    const files = document.getElementById("fileInput").files;
    let imageUrls = [];

    for(let i=0; i<files.length; i++){
        const file = files[i];
        const fileName = Date.now() + "_" + i + "_" + file.name;

        const { error: uploadError } = await supabase.storage
            .from("or-images")
            .upload(fileName, file);

        if(uploadError){
            alert("Gabim gjatë upload fotos: " + uploadError.message);
            return;
        }

        const { data: urlData } = supabase.storage
            .from("or-images")
            .getPublicUrl(fileName);

        imageUrls.push(urlData.publicUrl);
    }

    const itemData = {
        user_id: user.id,
        category: "bracelets_straps",
        brand: document.getElementById("brand").value,
        model: document.getElementById("model").value,
        price: parseFloat(document.getElementById("price").value) || null,
        type: document.getElementById("type").value,
        condition: document.getElementById("condition").value,
        material: document.getElementById("material").value,
        color: document.getElementById("color").value,
        lug_width: document.getElementById("lug_width").value,
        length: document.getElementById("length").value,
        country: document.getElementById("country").value,
        reference: document.getElementById("reference").value,
        year: parseInt(document.getElementById("year").value) || null,
        description: document.getElementById("description").value,
        image_url: imageUrls
    };

    const { error } = await supabase.from("bracelets_straps").insert([itemData]);

    if(error){
        alert("Gabim gjatë publikimit: " + error.message);
        return;
    }

    alert("🏆 Rripi u publikua me sukses!");
    window.location.href = "bracelets.html";
});
</script>

</body>
</html>
