<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <title>myOraSwiss - Dashboard</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto; 
            background: #000; 
            color: #fff; 
            padding: 15px; 
            padding-top: 15px; 
            padding-bottom: 120px; 
            margin: 0;
        }
        .search-container {
             margin-bottom: 20px;
             width: 100%;
         }

         .search-box {
             display: flex;
             align-items: center;
             background: #111;
             border: 1px solid #333;
             border-radius: 15px;
             padding: 3px 7px;
             height: 25px;
         }

         .search-box input {
             background: transparent;
             border: none;
             color: #fff;
             outline: none;
             width: 100%;
             font-size: 17px;
             margin-left: 12px;
         }

         .search-icon {
             font-size: 20px;
         }

         .camera-icon {
             background: none;
             border: none;
             cursor: pointer;
             font-size: 18px;
         }
    
        .my-oraswiss-menu {
            display: none;
            position: fixed;
            bottom: 105px;
            right: 15px;
            width: 220px;
            background: #1a1a1a;
            border-radius: 15px;
            border: 1px solid #333;
            padding: 10px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
            z-index: 1000000;
        }

        .my-oraswiss-menu.active {
            display: block;
        }

        .my-oraswiss-menu .menu-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 15px 10px; 
            border-bottom: 1px solid #222; 
            cursor: pointer; 
            color: #fff;
            text-decoration: none;
        }

        .my-oraswiss-menu .menu-item:last-child { 
            border-bottom: none; 
        }

        .bottom-nav {
            position: fixed !important;
            bottom: 20px !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            width: calc(100% - 10px) !important;
            max-width: 480% !important;
            height: 65px !important;
            background-color: #1a1a1a !important;
            display: flex !important;
            justify-content: space-around !important;
            align-items: center !important;
            box-sizing: border-box !important;
            padding: 0 10px !important;
            border-radius: 20px !important;
            border: 1px solid #333 !important;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5) !important;
            z-index: 999999 !important;
        
            overflow-x: auto !important;
            white-space: nowrap !important;
        
            transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out !important;
            opacity: 1 !important;
        }

        .bottom-nav::-webkit-scrollbar {
            display: none !important;
        }

        .bottom-nav-item, .bottom-nav a, .bottom-nav button {
            color: #ffffff !important;
            text-decoration: none !important;
            font-size: 27px !important;
            text-align: center !important;
            white-space: nowrap !important;
            flex: 1 1 0 !important;
            min-width: 0 !important;
            background: none !important;
            border: none !important;
            cursor: pointer !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 2px !important;
            padding: 0 !important;
        }

        .bottom-nav a:hover, .bottom-nav button:hover, .bottom-nav-item:hover {
            color: gold !important;
        }

        .bottom-nav.nav-hidden {
            transform: translateX(-50%) translateY(120px) !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }
        /* Desktop */
        @media (min-width: 1024px) {
            .bottom-nav {
                left: 50% !important;
                transform: translateX(-50%) !important;
                width: 500px !important;
                height: 48px !important;
                bottom: 15px !important;
            }
            .bottom-nav.nav-hidden {
                transform: translateX(-50%) translateY(120px) !important;
            }
        }
        @media (max-width: 1023px) {
            .bottom-nav {
                height: 160px !important;
            }
        }
        .watch-card {
            background: #111;
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 25px;
            list-style: none;
            min-height: 140px;
        }
    </style>
</head>
<body>

    <div class="search-container">
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Search on OraSwiss">
            <button class="camera-icon" onclick="alert('Funksioni për foto së shpejti!')">📷</button>
        </div>
    </div>

    <!-- Seksioni i artikujve të mi -->
    <div style="margin-bottom: 20px;">
        <h2 style="font-size:16px;">Artikujt e mi</h2>
        <ul id="myWatchesList" style="padding: 0; margin: 0;"></ul>
    </div>
    
    <!-- Menuja e My OraSwiss me butonin e saktë të mesazheve -->
    <div id="myOraSwissMenu" class="my-oraswiss-menu">
        <div class="menu-item" onclick="location.href='buy.html'"><span>🛒 Buy</span> <span>></span></div>
        <div class="menu-item" onclick="location.href='mysold.html'"><span>🛒 my sold</span> <span>></span></div>
        <a href="messages.html" class="menu-item" style="text-decoration: none; color: inherit;">
            <span>✉️ Messages</span>
            <span id="dashboardMessageCount" style="background: red; color: white; padding: 2px 6px; border-radius: 10px; font-size: 11px; font-weight: bold; display: none;">0</span>
        </a>
        <div class="menu-item" onclick="location.href='settings.html'"><span>⚙️ Account Settings</span> <span>></span></div>
        <div class="menu-item" onclick="location.href='support.html'"><span>🎧 Support</span> <span>></span></div>
        <div class="menu-item" onclick="location.href='info.html'"><span>ℹ️ Info</span> <span>></span></div>
    </div>

    <!-- Shiriti i poshtëm i navigimit -->
    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-item">OraSwiss</a>
        <a href="profile.html" class="bottom-nav-item">Profile</a>
        <a href="myoffers.html" class="bottom-nav-item">📦 Ofertat</a>
        <a href="orders.html" class="bottom-nav-item">🛒 Porositë</a>
        <a href="offers.html" class="bottom-nav-item">Offers</a>  
        <a href="favorites.html" class="bottom-nav-item">Favorites</a>
        <a href="collection.html" class="bottom-nav-item">Collection</a>
        <a href="mysales.html" class="bottom-nav-item">Sales</a>
        <a href="sellnow.html" class="bottom-nav-item">Sell</a>
        <a href="javascript:void(0)" class="bottom-nav-item" onclick="toggleMenu('myOraSwissMenu')">My OraSwiss</a>
    </nav>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabase = createClient(
        'https://gnwsrmelmeqduhhmfmoa.supabase.co',
        'sb_publishable__AkK_Z7lhtkvukN6Fy1cAQ_KBTXIcY9'
    );

    async function protectPage() {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) {
            window.location.href = "login.html";
            return false;
        }
        return true;
    }

    protectPage();
  
   async function ngarkoArtikujt() {
        const lista = document.getElementById("myWatchesList");
        if (!lista) return;
        lista.innerHTML = "<li>Po ngarkojmë artikujt...</li>";

        const { data: { user } } = await supabase.auth.getUser();
        if (!user) {
            lista.innerHTML = "<li>Duhet të logoheni!</li>";
            return;
        }

        const { data: watches, error: errorW } = await supabase
            .from('oras')
            .select('*')
            .eq('user_id', user.id);

        const { data: straps, error: errorS } = await supabase
            .from('bracelets_straps')
            .select('*')
            .eq('user_id', user.id);

        if (errorW || errorS) {
            lista.innerHTML = "<li>Gabim gjatë lidhjes me databazën.</li>";
            return;
        }

        const teGjitha = [...(watches || []), ...(straps || [])];

        lista.innerHTML = "";
        if (teGjitha.length === 0) {
            lista.innerHTML = "<li>Nuk keni asnjë artikull në shitje.</li>";
        } else {
            teGjitha.forEach(item => {
                const isStrap = straps && straps.some(s => s.id === item.id);
                
                // Këtu tani përdor product.html për orët
                const detailPage = isStrap ? 'product-bracelets-straps.html' : 'product.html';
                
                let imgUrl = "https://placeholder.co/600x400/222/fff?text=No+Image";
                if (item.image_url) {
                    let primaryImg = Array.isArray(item.image_url) ? item.image_url[0] : item.image_url;
                    if (primaryImg && primaryImg !== 'null' && primaryImg !== '') {
                        imgUrl = primaryImg.startsWith('http') ? primaryImg : "https://gnwsrmelmeqduhhmfmoa.supabase.co/storage/v1/object/public/or-images/" + primaryImg;
                    }
                }

                const li = document.createElement("li");
                li.className = "watch-card";
                li.innerHTML = `
                    <a href="${detailPage}?id=${item.id}" style="text-decoration:none; color:inherit; display:flex; align-items:center; width:100%;">
                        <img src="${imgUrl}" alt="${item.brand || 'Artikull'}"
                             style="width:120px; height:120px; margin-right:15px; object-fit:cover; border-radius:6px;">
                        <div>
                            <strong style="font-size:16px;">${item.brand || 'Artikull'}</strong> - <span style="color:gold;">${item.price || '0'} €</span>
                        </div>
                    </a>
                `;
                lista.appendChild(li);
            });
        }
    }
    
    function toggleMenu(menuId) {
        const menu = document.getElementById(menuId);
        if (!menu) return; 
        menu.classList.toggle('active');
    }

    window.toggleMenu = toggleMenu;

    async function loadMessageCount() {
        try {
            const { data: { user }, error } = await supabase.auth.getUser();
            if (error || !user) return;

            const { data: userConvs, error: convError } = await supabase
                .from("conversations")
                .select("id")
                .or(`user_one.eq.${user.id},user_two.eq.${user.id},buyer_id.eq.${user.id},seller_id.eq.${user.id}`);

            if (convError || !userConvs || userConvs.length === 0) return;

            const convIds = userConvs.map(c => c.id);

            const { count: totalUnread, error: msgError } = await supabase
                .from("messages")
                .select("*", { count: "exact", head: true })
                .in("conversation_id", convIds)
                .eq("is_read", false)
                .neq("sender_id", user.id);

            if (msgError) return;

            const count = totalUnread || 0;
            const dashBadge = document.getElementById("dashboardMessageCount");
            if (dashBadge) {
                dashBadge.innerText = count;
                dashBadge.style.display = count > 0 ? "inline-block" : "none";
            }
        } catch (err) {
            console.error("Gabim tek mesazhet:", err);
        }
    }

    document.addEventListener('DOMContentLoaded', async () => {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) {
            window.location.href = "login.html";
            return;
        }

        ngarkoArtikujt();
        loadMessageCount();
    });

    const searchInput = document.getElementById('searchInput');
    if (searchInput) {
        searchInput.addEventListener('keyup', function(e) {
            const termi = e.target.value.toLowerCase();
            const lista = document.getElementById("myWatchesList");
            if (!lista) return;
            const artikujt = lista.getElementsByClassName("watch-card");
            for (let i = 0; i < artikujt.length; i++) {
                let tekst = artikujt[i].textContent.toLowerCase();
                artikujt[i].style.display = tekst.includes(termi) ? "" : "none";
            }
        });
    }
</script>
<script>
let lastScrollTop = 0;
const nav = document.querySelector('.bottom-nav');

window.addEventListener('scroll', () => {
    let scrollTop = window.pageYOffset || document.documentElement.scrollTop;

    if (scrollTop > lastScrollTop && scrollTop > 50) {
        nav.classList.add('nav-hidden');
    } else {
        nav.classList.remove('nav-hidden');
    }

    lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
});
</script>
</body>
</html>
