<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bracelet & Straps - Ora Swiss</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KD2ZZ3MJYY"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-KD2ZZ3MJYY');
    </script>
    <style>
        body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #000; color: #fff; padding-bottom: 110px !important; }
        .site-header { position: sticky; top: 0; z-index: 9999; background: #111; }
        .nav-scroll { display: flex; gap: 18px; align-items: center; overflow-x: auto; padding: 6px 12px; }
        .nav-scroll a {
            color: #fff;
            text-decoration: none;
            padding: 4px 8px;
            font-size: 11px;
        }
        .nav-scroll a:hover { color: gold; }
        .site-title {
            font-weight: 700;
            line-height: 1;
            margin-right: 10px;
            font-size: 7px !important;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 10px;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .card {
            background: #111;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #333;
            cursor: pointer;
        }

        .card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            display: block;
            border-radius: 8px;
        }

        /* Galeria e Fotove në Detaje */
        .gallery-container { position: relative; width: 100%; height: 350px; background: #000; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .gallery-container img { width: 100%; height: 100%; object-fit: contain; }
        .gallery-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.6); color: white; border: 1px solid #444; font-size: 20px; padding: 10px; cursor: pointer; border-radius: 50%; z-index: 10; }
        .gallery-btn.prev { left: 10px; }
        .gallery-btn.next { right: 10px; }
        .photo-counter { position: absolute; bottom: 10px; background: rgba(0,0,0,0.7); padding: 4px 10px; border-radius: 10px; font-size: 12px; }

        .btn-main {
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            text-align: center;
            display: block;
            text-decoration: none;
        }
        .btn-buy {
            background: gold;
            color: #000;
        }
        .btn-buy:hover { background: #e6c200; }

        .btn-request {
            background: #222;
            color: #fff;
            border: 1px solid #555;
            margin-top: 10px;
        }
        .btn-request:hover { background: #333; }

        /* Stilimi i detajeve të produktit në dy kolona */
        .specs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            border: 1px solid #333;
            font-size: 14px;
        }
        .specs-grid div {
            color: #aaa;
        }
        .specs-grid span {
            color: #fff;
            font-weight: bold;
        }

        .bottom-nav {
            position: fixed !important;
            bottom: 20px !important;
            left: 15px !important;
            right: 15px !important;
            width: auto !important;
            height: 55px !important;
            background-color: #1a1a1a !important;
            display: flex !important;
            justify-content: space-around !important;
            align-items: center !important;
            padding: 0 5px !important;
            border-radius: 20px !important;
            border: 1px solid #333 !important;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5) !important;
            z-index: 999999 !important;
        }

        .bottom-nav a, .bottom-nav button {
            color: #ffffff !important;
            text-decoration: none !important;
            font-size: 10px !important;
            text-align: center !important;
            white-space: nowrap !important;
            flex: 1 !important;
            background: none !important;
            border: none !important;
            cursor: pointer !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            gap: 3px !important;
        }

        .bottom-nav {
             transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .bottom-nav.nav-hidden {
            transform: translateY(120px);
            opacity: 0;
            pointer-events: none;
        }
        .bottom-nav a:hover { color: gold !important; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.js"></script>
    <script src="db-connect.js"></script>
</head>
<body>

<header class="site-header">
    <nav class="nav-scroll">
        <span class="site-title">ORA<br>SWISS</span>
        <a href="index.html">Home</a>
        <a href="luxury.html">Luxury</a>
        <a href="vintage.html">Vintage</a>
        <a href="parts.html">Parts</a>
        <a href="product-bracelets-straps.html" style="color: gold;">Bracelet/Strap</a>
        <a href="service.html">Service</a>
        <a href="about.html">About</a>
    </nav>
</header>

<div id="content-container" style="padding: 10px;">
    Loading...
</div>

<script>
    let currentImages = [];
    let currentImgIndex = 0;

    document.addEventListener("DOMContentLoaded", async function() {
        if (!window.supabaseClient) {
            console.error("Supabase client nuk u gjet!");
            return;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const itemId = urlParams.get('id');
        const container = document.getElementById("content-container");

        if (itemId) {
            const { data, error } = await window.supabaseClient
                .from('bracelets_straps')
                .select('*')
                .eq('id', itemId)
                .single();

            if (error || !data) {
                container.innerHTML = "<h2 style='color:red; text-align:center;'>Produkti nuk u gjet ose ndodhi një gabim!</h2>";
                return;
            }

            window.currentSellerId = data.user_id;

            let rawImages = data.image_url;
            if (typeof rawImages === 'string') {
                try { rawImages = JSON.parse(rawImages); } catch(e) { rawImages = [rawImages]; }
            }

            currentImages = Array.isArray(rawImages) ? rawImages.filter(img => img && img !== 'null' && img !== '') : [];
            if (currentImages.length === 0) {
                currentImages = ["https://placeholder.co/600x400/222/fff?text=No+Image"];
            } else {
                currentImages = currentImages.map(img => 
                    img.startsWith('http') ? img : "https://gnwsrmelmeqduhhmfmoa.supabase.co/storage/v1/object/public/or-images/" + img
                );
            }
            currentImgIndex = 0;

            container.innerHTML = `
                <div style="max-width: 600px; margin: 0 auto; background: #111; padding: 20px; border-radius: 10px; border: 1px solid #333;">
                    <div class="gallery-container">
                        <button class="gallery-btn prev" onclick="changeImage(-1)">❮</button>
                        <img id="main-photo" src="${currentImages[0]}" alt="${data.brand || 'Strap'}">
                        <button class="gallery-btn next" onclick="changeImage(1)">❯</button>
                        <div class="photo-counter" id="photo-count">1 / ${currentImages.length}</div>
                    </div>
                    
                    <h2 style="margin-top: 15px;">${data.brand || 'Bracelet / Strap'} ${data.model || ''}</h2>

                    <div class="price" style="font-weight:bold; color:gold; font-size: 22px; margin: 10px 0;">
                        ${data.price ? data.price + ' €' : 'Contact for price'}
                    </div>

                    <div class="specs-grid">
                        <div>Type: <span>${data.type || '/'}</span></div>
                        <div>Condition: <span>${data.condition || '/'}</span></div>
                        <div>Material: <span>${data.material || '/'}</span></div>
                        <div>Color: <span>${data.color || '/'}</span></div>
                        <div>Reference: <span>${data.reference || '/'}</span></div>
                        <div>Year: <span>${data.year || '/'}</span></div>
                        <div>Gold Purity: <span>${data.gold_purity || '/'}</span></div>
                        <div>Lug Width: <span>${data.lug_width || '/'}</span></div>
                        <div>Clasp Width: <span>${data.clasp_width || '/'}</span></div>
                        <div>Length: <span>${data.length || '/'}</span></div>
                        <div>Thickness: <span>${data.thickness || '/'}</span></div>
                        <div>Postal Service: <span>${data.shipping_provider ? data.shipping_provider : '/'}</span></div>
                        <div>Delivery Time: <span>${data.shipping_days ? data.shipping_days : '/'}</span></div>
                    </div>

                    <div style="background: #1a1a1a; padding: 15px; border-radius: 8px; margin: 15px 0; border: 1px solid #333;">
                        <h4 style="margin: 0 0 10px 0; color: #fff;">Description</h4>
                        <p style="color: #ccc; line-height: 1.5; margin: 0; white-space: pre-line;">${data.description || 'Nuk ka përshkrim shtesë për këtë produkt.'}</p>
                    </div>

                    <button id="buy-bracelet-btn" class="btn-main btn-buy" style="width:100%;">Buy Now (PayPal)</button>
                    <button id="send-request-btn" class="btn-main btn-request" style="width:100%;">Send Request / Inquiry</button>
                </div>
            `;

            const buyBtn = document.getElementById("buy-bracelet-btn");
            if (buyBtn) {
                buyBtn.onclick = async function(e) {
                    e.preventDefault();
                    buyBtn.innerText = "Loading PayPal...";
                    try {
                        const response = await fetch(
                            "https://gnwsrmelmeqduhhmfmoa.supabase.co/functions/v1/create-paypal-order",
                            {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({
                                    product_id: itemId,
                                    price: data.price,
                                    product_name: (data.brand || 'Strap') + ' ' + (data.model || '')
                                })
                            }
                        );
                        const text = await response.text();

                        console.log("PAYPAL STATUS:", response.status);
                        console.log("PAYPAL RESPONSE:", text);

                        let result = {};
                        try {
                            result = JSON.parse(text);
                        } catch(e) {
                            console.log("Nuk ishte JSON");
                        }

                       
                        if (result.paypal_link) {
                            window.location.href = result.paypal_link;
                        } else {
                            alert("PayPal link nuk u krijua");
                            buyBtn.innerText = "Buy Now (PayPal)";
                        }
                    } catch(error) {
                        console.error(error);
                        alert("Gabim me PayPal");
                        buyBtn.innerText = "Buy Now (PayPal)";
                    }
                };
            }

            const requestBtn = document.getElementById("send-request-btn");
            if (requestBtn) {
                requestBtn.onclick = function() {
                    window.location.href = `messages.html?product_id=${itemId}&title=` + encodeURIComponent((data.brand || 'Strap') + ' ' + (data.model || ''));
                };
            }

        } else {
            container.innerHTML = '<h2 style="padding-left:0; font-size:10px;">Bracelets & Straps Collection</h2><div id="straps-container" class="grid">Loading...</div>';
            const gridContainer = document.getElementById("straps-container");

            const { data, error } = await window.supabaseClient
                .from('bracelets_straps')
                .select('*');

            if (error || !data || data.length === 0) {
                gridContainer.innerHTML = "No bracelets or straps available.";
                return;
            }

            gridContainer.innerHTML = data.map(item => {
                let imgUrl = "https://placeholder.co/600x400/222/fff?text=No+Image";
                let primaryImage = "";

                if (item.image_url) {
                    if (Array.isArray(item.image_url) && item.image_url.length > 0) {
                        primaryImage = item.image_url[0];
                    } else if (typeof item.image_url === 'string') {
                        try {
                            let parsed = JSON.parse(item.image_url);
                            primaryImage = Array.isArray(parsed) ? parsed[0] : item.image_url;
                        } catch(e) {
                            primaryImage = item.image_url;
                        }
                    }
                }

                if (primaryImage && primaryImage !== 'null' && primaryImage !== '') {
                    imgUrl = primaryImage.startsWith('http') ? primaryImage : "https://gnwsrmelmeqduhhmfmoa.supabase.co/storage/v1/object/public/or-images/" + primaryImage;
                }

                return `
                    <div class="card" onclick="window.location.href='product-bracelets-straps.html?id=${item.id}'">
                        <img src="${imgUrl}" alt="${item.brand || 'Strap'}">
                        <h3 style="margin: 10px 0 5px 0;">${item.brand || 'Bracelet / Strap'}</h3>
                        <p style="color:#aaa; font-size:13px; margin:0 0 8px 0;">${item.material || '/'}</p>
                        <div class="price" style="font-weight:bold; color:gold; margin-bottom: 10px;">${item.price ? item.price + ' €' : 'Contact for price'}</div>
                        
                        <button class="btn-main btn-buy" 
                        style="width:100%; padding: 8px; font-size: 13px;"
                        onclick="event.stopPropagation(); window.location.href='product-bracelets-straps.html?id=${item.id}'">
                         View Details
                        </button>
                    </div>
                `;
            }).join('');
        }
    });

    function changeImage(direction) {
        if (currentImages.length <= 1) return;
        currentImgIndex += direction;
        if (currentImgIndex >= currentImages.length) currentImgIndex = 0;
        if (currentImgIndex < 0) currentImgIndex = currentImages.length - 1;
    
        document.getElementById("main-photo").src = currentImages[currentImgIndex];
        document.getElementById("photo-count").innerText = (currentImgIndex + 1) + " / " + currentImages.length;
    }

    function checkMenu(event) {
        if (event) event.preventDefault();
        // Funksioni i menusë bosh, pa shkrime në console
    }
</script>

<nav class="bottom-nav">
    <a href="index.html">Home</a>
    <a href="favorites.html">Favs</a>
    <a href="messages.html">Messages</a>
    <a href="mysales.html">Sales</a>
    <a href="sellnow.html">Sell</a>
    <button type="button" onclick="checkMenu(event)">Menu</button>
</nav>
<script>
let lastScrollTop = 0;
const nav = document.querySelector(".bottom-nav");

window.addEventListener("scroll", () => {
    const scrollTop = window.pageYOffset || document.documentElement.scrollTop;

    if (scrollTop > lastScrollTop && scrollTop > 50) {
        // Kur zbret poshtë
        nav.classList.add("nav-hidden");
    } else {
        // Kur ngjitet lart
        nav.classList.remove("nav-hidden");
    }

    lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
});
</script>
    
</body>
</html>
