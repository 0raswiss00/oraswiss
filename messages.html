<!DOCTYPE html>
<html>

<head>

<title>Messages - Oraswiss</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
    font-family:Arial;
    background:#f5f5f5;
    margin:0;
}

.header{
    background:#000;
    color:white;
    padding:15px;
    text-align:center;
}


.chat{
    background:white;
    margin:10px;
    padding:15px;
    border-radius:12px;
    cursor:pointer;
}


.count{
    float:right;
    background:black;
    color:white;
    padding:5px 10px;
    border-radius:20px;
}

</style>

</head>


<body>


<div class="header">
💬 Messages
</div>


<div id="chatList"></div>



<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm";


const supabase = createClient(
"https://gnwsrmelmeqduhhmfmoa.supabase.co",
"sb_publishable__AkK_Z7lhtkvukN6Fy1cAQ_KBTXIcY9"
);



async function loadChats(){


const {data:{user}, error} =
await supabase.auth.getUser();


if(error || !user){
    window.location.href="login.html";
    return;
}



const {data: conversations, error: convError} =
await supabase
.from("conversations")
.select("*")
.or(`buyer_id.eq.${user.id},seller_id.eq.${user.id}`)
.order("updated_at",{ascending:false});



if(convError){

console.error(convError);
return;

}



const box = document.getElementById("chatList");

box.innerHTML="";



for(const chat of conversations){



const {data: watch, error: watchError} =
await supabase
.from("oras")
.select(`
brand,
model,
price,
image_url,
reference
`)
.eq("id", chat.listing_id)
.single();



if(watchError){
    console.log(watchError);
    continue;
}




let unread = 0;


if(chat.buyer_id === user.id){

    unread = chat.unread_buyer || 0;

}else{

    unread = chat.unread_seller || 0;

}




const image = Array.isArray(watch.image_url)
? watch.image_url[0]
: watch.image_url;



const div = document.createElement("div");

div.className="chat";



div.innerHTML = `

<div style="display:flex;gap:15px;align-items:center;">


<img src="${image || ''}"
style="
width:70px;
height:70px;
border-radius:10px;
object-fit:cover;
">


<div>

<b>
${watch.brand || ""} ${watch.model || ""}
</b>

<br>

<span>
${watch.price || 0} €
</span>

<br>

<small>
${chat.last_message || "No messages"}
</small>


</div>


</div>


<span class="count">
${unread}
</span>


`;



div.onclick=()=>{

window.location.href =
"chat.html?conversation=" + chat.id;

};



box.appendChild(div);



}



}




loadChats();





supabase
.channel("messages-update")
.on(
"postgres_changes",
{
event:"*",
schema:"public",
table:"conversations"
},
()=>{
loadChats();
}
)
.subscribe();



</script>

</body>

</html>
