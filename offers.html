<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofertat e Marra</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        .offer-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            padding: 20px;
            margin: 15px auto;
            width: 80%;
            max-width: 500px;
            border-radius: 8px;
            text-align: left;
        }
        button {
            padding: 8px 15px;
            margin-right: 10px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            font-weight: bold;
        }
        .btn-accept {
            background-color: #28a745;
            color: white;
        }
        .btn-reject {
            background-color: #dc3545;
            color: white;
        }
    </style>
</head>
<body>

    <h1>Ofertat e Marra</h1>
    
    <div id="auth-message">
        Ju duhet të jeni të loguar për të parë ofertat.
    </div>

    <div id="offers-container" style="display: none;">
        <div id="offers-list">
            <!-- Ofertat do të shfaqen këtu -->
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        // 1. VENDOS URL DHE ÇELËSIN TËND TË VËRTETË KËTU (Fshi tekstet brenda thonjëzave)
        const SUPABASE_URL = 'https://kodi-yt-i-supabase.supabase.co';
        const SUPABASE_ANON_KEY = 'vendos-anon-key-ketu';
        
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadOffers() {
            // const { data: { session } } = await db.auth.getSession();
            const session = { user: true }; // E detyrojmë të duket sikur je i loguar
            
            if (!session) {
                document.getElementById('auth-message').style.display = 'block';
                document.getElementById('offers-container').style.display = 'none';
                return;
            }

            document.getElementById('auth-message').style.display = 'none';
            document.getElementById('offers-container').style.display = 'block';

            const { data: offers, error } = await supabase
                .from('offers')
                .select('*');

            const container = document.getElementById('offers-list');
            container.innerHTML = '';

            if (error || !offers || offers.length === 0) {
                container.innerHTML = '<p>Nuk ka asnjë ofertë aktive për momentin.</p>';
                return;
            }

            offers.forEach(offer => {
                container.innerHTML += `
                    <div class="offer-card">
                        <p><strong>Detajet:</strong> ${offer.details || 'Ofertë e re'}</p>
                        <p><strong>Çmimi:</strong> ${offer.price || '0'} €</p>
                        <button class="btn-accept" data-id="${offer.id}" data-status="Pranuar">Prano</button>
                        <button class="btn-reject" data-id="${offer.id}" data-status="Refuzuar">Refuzo</button>
                    </div>
                `;
            });

            // Lidhja e eventeve për butonat direkt brenda modulit
            document.querySelectorAll('.btn-accept, .btn-reject').forEach(button => {
                button.addEventListener('click', async function() {
                    const offerId = this.getAttribute('data-id');
                    const status = this.getAttribute('data-status');

                    const { error } = await supabase
                        .from('offers')
                        .update({ status: status })
                        .eq('id', offerId);

                    if (error) {
                        alert('Gabim gjatë përditësimit: ' + error.message);
                    } else {
                        alert('Oferta u ' + status.toLowerCase() + ' me sukses!');
                        loadOffers();
                    }
                });
            });
        }

        loadOffers();
    </script>

</body>
</html>
