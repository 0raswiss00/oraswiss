name: Update Sitemap

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate sitemap.xml
        env:
          SUPABASE_URL: "https://gnwsrmelmeqduhhmfmoa.supabase.co"
          SUPABASE_KEY: "sb_publishable__AkK_Z7lhtkvukN6Fy1cAQ_KBTXIcY9"
        run: |
          python - << 'EOF'
          import json
          import os
          import urllib.request

          base_url = "https://oraswiss.com"
          supabase_url = os.environ["SUPABASE_URL"].rstrip("/")
          anon_key = os.environ["SUPABASE_KEY"]

          static_urls = [
              (f"{base_url}/", "daily", "1.0"),
              (f"{base_url}/luxury.html", "daily", "0.9"),
              (f"{base_url}/vintage.html", "daily", "0.9"),
              (f"{base_url}/parts.html", "daily", "0.8"),
              (f"{base_url}/product-bracelets-straps.html", "daily", "0.8"),
              (f"{base_url}/service.html", "weekly", "0.7"),
              (f"{base_url}/about.html", "monthly", "0.6"),
          ]

          product_urls = []
          for table in ("eras", "bracelets_straps"):
              url = f"{supabase_url}/rest/v1/{table}?select=id"
              req = urllib.request.Request(
                  url,
                  headers={
                      "apikey": anon_key,
                      "Authorization": f"Bearer {anon_key}",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  rows = json.loads(resp.read().decode("utf-8"))
                  for row in rows:
                      if "id" in row and row["id"] is not None:
                          product_urls.append(f"{base_url}/product.html?id={row['id']}")

          lines = ['<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
          for loc, freq, prio in static_urls:
              lines.extend([
                  "<url>",
                  f"<loc>{loc}</loc>",
                  f"<changefreq>{freq}</changefreq>",
                  f"<priority>{prio}</priority>",
                  "</url>",
              ])
          for loc in product_urls:
              lines.extend([
                  "<url>",
                  f"<loc>{loc}</loc>",
                  "<changefreq>weekly</changefreq>",
                  "<priority>0.8</priority>",
                  "</url>",
              ])
          lines.append("</urlset>")

          with open("sitemap.xml", "w", encoding="utf-8", newline="\n") as f:
              f.write("\n".join(lines) + "\n")
          EOF

      - name: Commit and push sitemap.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          if ! git diff --staged --quiet; then
            git commit -m "chore: update sitemap.xml"
            git push
          fi
