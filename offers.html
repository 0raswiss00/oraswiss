<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofertat e Marra</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        .offer-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            padding: 20px;
            margin: 15px auto;
            width: 80%;
            max-width: 500px;
            border-radius: 8px;
            text-align: left;
        }
        button {
            padding: 8px 15px;
            margin-right: 10px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            font-weight: bold;
        }
        .btn-accept {
            background-color: #28a745;
            color: white;
        }
        .btn-reject {
            background-color: #dc3545;
            color: white;
        }
    </style>
</head>
<body>

    <h1>Ofertat e Marra</h1>
    
    <div id="auth-message">
        Duke kontrolluar sesionin...
    </div>

    <div id="offers-container" style="display: none;">
        <div id="offers-list">
            <!-- Ofertat do të shfaqen këtu -->
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        // VENDOS KREDENCIALET E TUA TË VËRTETA KËTU:
        const SUPABASE_URL = 'https:https://gnwsrmelmeqduhhmfmoa.supabase.co'; // Ndryshoje me URL-në tënde të saktë
        const SUPABASE_ANON_KEY = 'sb_publishable__AkK_Z7lhtkvukN6Fy1cAQ_KBTXIcY9';                    // Ndryshoje me Anon Key-n tënd të saktë
        
        const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadOffers() {
            // Për të shmangur bllokimin e sesionit në skedarë të veçantë, 
            // marrim direkt të dhënat nga tabela 'offers' e Supabase:
            const { data: offers, error } = await db
                .from('offers')
                .select('*');

            const authMessage = document.getElementById('auth-message');
            const offersContainer = document.getElementById('offers-container');
            const container = document.getElementById('offers-list');

            authMessage.style.display = 'none';
            offersContainer.style.display = 'block';
            container.innerHTML = '';

            if (error) {
                container.innerHTML = '<p style="color: #dc3545;">Gabim në lidhje me databazën: ' + error.message + '</p>';
                return;
            }

            if (!offers || offers.length === 0) {
                container.innerHTML = '<p>Nuk ka asnjë ofertë aktive për momentin.</p>';
                return;
            }

            offers.forEach(offer => {
                container.innerHTML += `
                    <div class="offer-card">
                        <p><strong>Detajet:</strong> ${offer.details || 'Ofertë e re'}</p>
                        <p><strong>Çmimi:</strong> ${offer.price || '0'} €</p>
                        <p><strong>Statusi:</strong> <span style="color: #ffc107;">${offer.status || 'Në pritje'}</span></p>
                        <button class="btn-accept" data-id="${offer.id}" data-status="Pranuar">Prano</button>
                        <button class="btn-reject" data-id="${offer.id}" data-status="Refuzuar">Refuzo</button>
                    </div>
                `;
            });

            // Funksionaliteti i butonave Prano/Refuzo
            document.querySelectorAll('.btn-accept, .btn-reject').forEach(button => {
                button.addEventListener('click', async function() {
                    const offerId = this.getAttribute('data-id');
                    const status = this.getAttribute('data-status');

                    const { error: updateError } = await db
                        .from('offers')
                        .update({ status: status })
                        .eq('id', offerId);

                    if (updateError) {
                        alert('Gabim gjatë përditësimit: ' + updateError.message);
                    } else {
                        alert('Oferta u ' + status.toLowerCase() + ' me sukses!');
                        loadOffers(); // Rifreskon listën automatikisht
                    }
                });
            });
        }

        loadOffers();
    </script>

</body>
</html>
