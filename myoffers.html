    <!-- Supabase Logic -->
    <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm";

    const supabase = createClient(
        "https://gnwsrmelmeqduhhmfmoa.supabase.co",
        "sb_publishable__AkK_Z7lhtkvukN6Fy1cAQ_KBTXIcY9"
    );

    async function loadBuyerOffers() {
        const { data: { user }, error: userError } = await supabase.auth.getUser();
        const container = document.getElementById("buyer-offers-list");

        if (!container) return;

        if (userError || !user) {
            container.innerHTML = "Ju duhet të jeni të loguar për të parë ofertat tuaja.";
            return;
        }

        // Marrja e ofertave ku përdoruesi është blerës
        const { data: offers, error } = await supabase
            .from("offers")
            .select("*")
            .eq("buyer_id", user.id)
            .order("created_at", { ascending: false });

        const { data: watches } = await supabase
            .from("oras")
            .select("*");

        const { data: straps } = await supabase
            .from("bracelets_straps")
            .select("*");

        const products = [
            ...(watches || []),
            ...(straps || [])
        ];
        
        if (error) {
            console.error("Gabim nga Supabase:", error.message);
            container.innerHTML = "Gabim në ngarkimin e ofertave: " + error.message;
            return;
        }

        if (!offers || offers.length === 0) {
           container.innerHTML = "Nuk keni bërë asnjë ofertë deri tani.";
           return;
        }

        let html = '';
        for (const offer of offers) {
            let actionHtml = '';

            const product = products.find(
                p => String(p.id) === String(offer.product_id)
            );
            
            if (offer.status === 'pending') {

                actionHtml = `
                    <span style="color:#f39c12;font-weight:bold;font-size:12px;">
                        Në pritje...
                    </span>
                `;

           } else if (offer.status === "countered") {

                if (offer.last_offer_by === "seller") {

                    actionHtml = `
                        <span style="color:#f1c40f;font-weight:bold;">
                            Kundërofertë: ${offer.counter_offer} €
                        </span>

                        <button class="btn-buy"
                            onclick="acceptCounter('${offer.id}')">
                            Prano
                        </button>

                        <button class="btn-chat"
                            onclick="rejectCounter('${offer.id}')">
                            Refuzo
                        </button>

                        <button class="btn-chat"
                            onclick="makeCounter('${offer.id}')">
                            Kundërofertë
                        </button>
                     `;

                 } else {

                     actionHtml = `
                         <span style="color:#f39c12;font-weight:bold;">
                            Kundëroferta ${offer.counter_offer} € u dërgua.
                         </span>
                    `;

                }

            }
            
            html += `
            <div class="offer-card">

                <img
                    src="${
                    Array.isArray(product?.image_url)
                        ? product.image_url[0]
                        : product?.image_url || 'images/default.png'
                }"
                    style="
                       width:100px;
                       height:100px;
                       object-fit:cover;
                       border-radius:8px;
                    ">

                <div style="flex:1">

                    <h3 style="margin:0;">
                        ${product?.brand || ""} ${product?.model || ""}
                    </h3>

                    <p><b>Çmimi:</b> ${product?.price ?? "N/A"} €</p>

                    <p><b>Oferta juaj:</b> ${offer.offered_price} €</p>

                    <p><b>Statusi:</b> ${offer.status}</p>

                    <div style="margin-top:10px;">
                       ${actionHtml}
                    </div>

                </div>

            </div>
            `;
        }
        container.innerHTML = html;
    }
   
    window.acceptCounter = async function(id){

        const { data, error } = await supabase
            .from("offers")
            .update({
                status:"countered",
                counter_offer:price,
                last_offer_by:"buyer"
            })
            .eq("id", id)
            .select();

        console.log("COUNTER UPDATE:", data, error);

        if(error){
            alert(error.message);
            return;
        }

        loadBuyerOffers();
    };


    window.rejectCounter = async function(id){

        const { error } = await supabase
            .from("offers")
            .update({
                status:"rejected"
            })
            .eq("id", id);

        if(error){
            alert(error.message);
            return;
        }

        loadBuyerOffers();
    };


    window.makeCounter = async function(id){

        const amount = prompt("Shkruaj kundërofertën (€):");

        if(!amount) return;


        const price = Number(amount);


        const { data, error } = await supabase
            .from("offers")
            .update({
                status: "countered",
                counter_offer: price,
                last_offer_by: "buyer"
            })
            .eq("id", id)
            .select();


        console.log("BUYER COUNTER UPDATE:", data);
        console.log("ERROR:", error);


        if(error){
            alert(error.message);
            return;
        }


        loadBuyerOffers();

    };

    // Funksioni për të gjeneruar pagesën PayPal me çmimin e ofruar nga blerësi
        window.payForOffer = async function(productId, price, btnElement) {
        btnElement.innerText = "⏳ Loading...";

        try {
            const response = await fetch(
                "https://gnwsrmelmeqduhhmfmoa.supabase.co/functions/v1/create-paypal-order",
                {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        product_id: productId,
                        price: price,
                        product_name: "Oferta e pranuar"
                    })
                }
            );

            const result = await response.json();

            if (result.paypal_link) {
                window.location.href = result.paypal_link;
            } else {
                alert("PayPal link nuk u krijua");
                btnElement.innerText = "Paguaj Tani 💳";
            }

        } catch(error) {
            console.error(error);
            alert("Gabim me PayPal");
            btnElement.innerText = "Paguaj Tani 💳";
        }

    }; // KJO DUHET PATJETER


    document.addEventListener("DOMContentLoaded", () => {
        loadBuyerOffers();
    }); // KJO DUHET PATJETER

</script>
