<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <title>Modifiko Orën</title>
    <style>
        body { font-family: Arial; background: #000; color: #fff; padding: 20px; }
        form { max-width: 600px; margin: 0 auto; background: #111; padding: 20px; border-radius: 10px; }
        input, select, textarea { width: 100%; padding: 10px; margin-bottom: 10px; background: #222; color: #fff; border: 1px solid #444; border-radius: 5px; }
        button { width: 100%; padding: 15px; background: gold; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
<a href="dashboard.html"
    style="color:#ccc; text-align:center; display:block; margin-top:10px;">
    ← Back 
</a>
<form id="editForm">
    <h2>Modifiko Produktin</h2>
    
    <!-- Fushat bazë -->
    <input type="text" id="brand" placeholder="Brand" required>
    <input type="text" id="model" placeholder="Model" required>
    <input type="number" id="price" placeholder="Price">
    <select id="condition" name="condition">
        <option value="">Zgjidh gjendjen...</option>
        <option value="Used">Used</option>
        <option value="Used Good">Used Good</option>
        <option value="Used Very Good">Used Very Good</option>
        <option value="Used not Good">Used not Good</option>
        <option value="Used For Repair & Spares">Used For Repair & Spares</option>
    </select>

    <input type="text" id="material" placeholder="Material">
    
    <!-- Të gjitha fushat e specifikimeve që i ke te product.html -->
    <input type="text" id="reference" placeholder="Reference">
    <input type="text" id="serial_number" placeholder="Serial Number">
    <input type="text" id="movement" placeholder="Movement">
    <input type="text" id="caliber" placeholder="Caliber">
    <input type="text" id="gender" placeholder="Gender">
    <input type="text" id="dial_color" placeholder="Dial Color">
    <input type="text" id="frekuen" placeholder="Frequency">
    <input type="text" id="material" placeholder="Material">
    <input type="text" id="net_weight" placeholder="Net Weight (g)">
    <input type="text" id="case_size" placeholder="Case Size">
    <input type="text" id="movement_size" placeholder="Movement Size">
    <input type="text" id="water_resistance" placeholder="Water Resistance">
    <input type="text" id="year" placeholder="Year">
    <input type="text" id="function" placeholder="Function">
    <input type="text" id="crown" placeholder="Crown">
    <input type="text" id="jewels" placeholder="Jewels">
    <input type="text" id="service_date" placeholder="Service Date">
    <input type="text" id="origin" placeholder="Origin">
    <input type="text" id="work_status" placeholder="Work Status">
    <input type="text" id="bracelet" placeholder="Bracelet">
    <input type="text" id="glass" placeholder="Glass">
    <input type="text" id="warranty" placeholder="Warranty">
    <input type="text" id="warranty_months" placeholder="Warranty Months">

    <textarea id="description" placeholder="Description"></textarea>

    <label for="image_input">Shto ose ndrysho fotot:</label>
    <input type="file" id="image_input" multiple accept="image/*">
    
    <button type="submit">Ruaj Ndryshimet</button>
    <button type="button" id="deleteBtn" style="background: #ff4d4d; color: white; width: 100%; padding: 15px; border: none; cursor: pointer; margin-top: 10px;">
        Fshi Produktin
    </button>
</form>

<div id="gallery-container" style="margin: 15px 0; display: flex; gap: 10px; flex-wrap: wrap;">
    </div>
   
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase = createClient(
    "https://gnwsrmelmeqduhhmfmoa.supabase.co",
    "sb_publishable__AkK_Z7lhtkvukN6Fy1cAQ_KBTXIcY9"
);


const urlParams = new URLSearchParams(window.location.search);

const id = urlParams.get('id');
const type = urlParams.get('type') || 'watch';

const tableName = (type === 'bracelet')
    ? 'bracelets_straps'
    : 'oras';


window.produktData = {
    image_url: []
};


// =========================
// MERR PRODUKTIN
// =========================

async function fetchProduct() {

    const { data: product, error } = await supabase
        .from(tableName)
        .select("*")
        .eq("id", id)
        .single();


    if (error) {
        console.error(error);
        alert("Gabim gjatë marrjes së produktit");
        return;
    }


    window.produktData = product;

    document.getElementById("brand").value = product.brand || "";
    document.getElementById("model").value = product.model || "";
    document.getElementById("price").value = product.price || "";

    // Mbushja e çdo fushe tjetër që të shfaqet e gatshme për editim
    document.getElementById("reference").value = product.reference || "";
    document.getElementById("serial_number").value = product.serial_number || "";
    document.getElementById("movement").value = product.movement || "";
    document.getElementById("caliber").value = product.caliber || "";
    document.getElementById("gender").value = product.gender || "";
    document.getElementById("dial_color").value = product.dial_color || "";
    document.getElementById("frekuen").value = product.frekuen || "";
    document.getElementById("material").value = product.material || "";
    document.getElementById("net_weight").value = product.net_weight || "";
    document.getElementById("case_size").value = product.case_size || "";
    document.getElementById("movement_size").value = product.movement_size || "";
    document.getElementById("water_resistance").value = product.water_resistance || "";
    document.getElementById("year").value = product.year || "";
    document.getElementById("function").value = product.function || "";
    document.getElementById("crown").value = product.crown || "";
    document.getElementById("jewels").value = product.jewels || "";
    document.getElementById("service_date").value = product.service_date || "";
    document.getElementById("origin").value = product.origin || "";
    document.getElementById("work_status").value = product.work_status || "";
    document.getElementById("bracelet").value = product.bracelet || "";
    document.getElementById("glass").value = product.glass || "";
    document.getElementById("warranty").value = product.warranty || "";
    document.getElementById("warranty_months").value = product.warranty_months || "";
    document.getElementById("description").value = product.description || "";


    let images = [];

    if (Array.isArray(product.image_url)) {

        images = product.image_url;

    } else if (typeof product.image_url === "string") {

        try {
            images = JSON.parse(product.image_url);
        } catch {
            images = product.image_url
                .split(",")
                .filter(Boolean);
        }
    }


    window.produktData.image_url = images;


    showImages(images);
}



// =========================
// SHFAQ DHE FSHIJ FOTOT
// =========================

function showImages(images) {

    const gallery = document.getElementById("gallery-container");

    if (!gallery) return;

    gallery.innerHTML = "";

    images.forEach((url, index) => {

        // Krijojmë një kontejner të vogël për çdo foto dhe butonin e fshirjes
        const wrapper = document.createElement("div");
        wrapper.style.position = "relative";
        wrapper.style.display = "inline-block";

        const img = document.createElement("img");
        img.src = url;
        img.style.width = "100px";
        img.style.height = "100px";
        img.style.objectFit = "cover";
        img.style.borderRadius = "8px";
        img.style.cursor = "pointer";

        // Mundësia për ta bërë foto kryesore kur klikohet te fotoja
        img.onclick = () => {
            const moved = images.splice(index, 1)[0];
            images.unshift(moved);
            window.produktData.image_url = images;
            showImages(images);
        };

        // Butoni "×" për të fshirë foton
        const deleteBtn = document.createElement("button");
        deleteBtn.innerHTML = "×";
        deleteBtn.type = "button";
        deleteBtn.style.position = "absolute";
        deleteBtn.style.top = "2px";
        deleteBtn.style.right = "5px";
        deleteBtn.style.background = "rgba(255, 0, 0, 0.85)";
        deleteBtn.style.color = "white";
        deleteBtn.style.border = "none";
        deleteBtn.style.borderRadius = "50%";
        deleteBtn.style.width = "24px";
        deleteBtn.style.height = "24px";
        deleteBtn.style.cursor = "pointer";
        deleteBtn.style.fontSize = "16px";
        deleteBtn.style.fontWeight = "bold";
        deleteBtn.style.lineHeight = "1";

        // Kur klikohet "×", hiqet fotoja nga vargu dhe rifreskohet galeria
        deleteBtn.onclick = (e) => {
            e.stopPropagation(); // Ndalon klikimin e fotos poshtë saj
            images.splice(index, 1);
            window.produktData.image_url = images;
            showImages(images);
        };

        wrapper.appendChild(img);
        wrapper.appendChild(deleteBtn);
        gallery.appendChild(wrapper);

    });

}




// =========================
// RUAJ NDRYSHIMET
// =========================

document.getElementById("editForm")
.addEventListener("submit", async (e)=>{


    e.preventDefault();


    const { data:{user} } = await supabase.auth.getUser();


    if(!user){

        alert("Duhet të jesh i loguar");
        return;

    }



    let imageUrls = window.produktData.image_url || [];


    const fileInput = document.getElementById("image_input");


    if(fileInput && fileInput.files.length > 0){


        for(const file of fileInput.files){


            const fileName = `${Date.now()}_${file.name}`;


            const {error:uploadError}=await supabase
            .storage
            .from("or-images")
            .upload(fileName,file);



            if(uploadError){

                console.error(uploadError);
                continue;

            }



            const {data:urlData}=supabase
            .storage
            .from("or-images")
            .getPublicUrl(fileName);



            imageUrls.push(urlData.publicUrl);

        }

    }




    const { error } = await supabase
    .from(tableName)
    .update({
        brand: document.getElementById("brand").value,
        model: document.getElementById("model").value,
        price: Number(document.getElementById("price").value) || 0,
        reference: document.getElementById("reference").value,
        serial_number: document.getElementById("serial_number").value,
        movement: document.getElementById("movement").value,
        caliber: document.getElementById("caliber").value,
        gender: document.getElementById("gender").value,
        dial_color: document.getElementById("dial_color").value,
        frekuen: document.getElementById("frekuen").value,
        material: document.getElementById("material").value,
        net_weight: document.getElementById("net_weight").value,
        case_size: document.getElementById("case_size").value,
        movement_size: document.getElementById("movement_size").value,
        water_resistance: document.getElementById("water_resistance").value,
        year: document.getElementById("year").value,
        function: document.getElementById("function").value,
        crown: document.getElementById("crown").value,
        jewels: document.getElementById("jewels").value,
        service_date: document.getElementById("service_date").value,
        origin: document.getElementById("origin").value,
        work_status: document.getElementById("work_status").value,
        bracelet: document.getElementById("bracelet").value,
        glass: document.getElementById("glass").value,
        warranty: document.getElementById("warranty").value,
        warranty_months: document.getElementById("warranty_months").value,
        description: document.getElementById("description").value,
        image_url: imageUrls
    })
    .eq("id", id)
    .eq("user_id", user.id);
  

    if(error){

        console.error(error);

        alert("Gabim gjatë ruajtjes: "+error.message);

    }else{

        alert("Ndryshimet u ruajtën me sukses!");

        window.location.href="dashboard.html";

    }


});



// =========================
// FSHI PRODUKTIN
// =========================

document.getElementById("deleteBtn")
.addEventListener("click",async()=>{


    if(!confirm("A jeni i sigurt që doni ta fshini?"))
        return;



    const {data:{user}} = await supabase.auth.getUser();



    const {error}=await supabase
    .from(tableName)
    .delete()
    .eq("id",id)
    .eq("user_id",user.id);



    if(error){

        alert(error.message);

    }else{

        alert("Produkti u fshi!");

        window.location.href="dashboard.html";

    }


});



fetchProduct();

</script>
</body>
</html>
