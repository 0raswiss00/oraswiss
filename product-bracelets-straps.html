<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bracelets & Straps - Ora Swiss</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KD2ZZ3MJYY"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-KD2ZZ3MJYY');
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #050505; color: white; font-family: Arial, sans-serif; padding-bottom: 50px; }
        
        .container { max-width: 1200px; margin: auto; padding: 20px; }
        
        .header-title {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 20px;
            border-bottom: 1px solid #222;
            padding-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .back-link {
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
            background: #111;
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid #222;
        }
        .back-link:hover { background: #222; color: white; }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        @media (min-width: 768px) {
            .products-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .product-card {
            background: #111;
            border: 1px solid #222;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-3px);
            border-color: #444;
        }

        .product-img-wrapper {
            width: 100%;
            height: 160px;
            background: #000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .product-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .product-brand {
            font-size: 13px;
            color: #aaa;
            text-transform: uppercase;
        }

        .product-model {
            font-size: 15px;
            font-weight: bold;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 8px;
            border-top: 1px solid #1a1a1a;
        }

        .product-price {
            font-size: 16px;
            color: #25D366;
            font-weight: bold;
        }

        .loading-text, .empty-text {
            text-align: center;
            padding: 50px;
            color: #aaa;
            font-size: 16px;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">
        <span>Bracelets & Straps</span>
        <a href="index.html" class="back-link">← Home</a>
    </div>

    <div class="products-grid" id="products-container">
        <div class="loading-text">Duke ngarkuar produktet...</div>
    </div>
</div>

<script>
const supabaseClient = window.supabase.createClient(
    "https://gnwsrmelmeqduhhmfmoa.supabase.co",
    "sb_publishable__AkK_Z7lhtkvukN6Fy1cAQ_KBTXIcY9"
);

async function loadCategoryProducts() {
    const container = document.getElementById("products-container");

    try {
        const { data, error } = await supabaseClient
            .from("bracelets_straps")
            .select("*")
            .order("created_at", { ascending: false });

        if (error) throw error;

        if (!data || data.length === 0) {
            container.innerHTML = `<div class="empty-text">Nuk u gjet asnjë rrip ose aksesor.</div>`;
            return;
        }

        container.innerHTML = "";

        data.forEach(item => {
            let rawImg = Array.isArray(item.image_url) ? item.image_url[0] : item.image_url;
            let imageUrl = "https://placeholder.co/400x300/222/fff?text=No+Image";
            
            if (rawImg) {
                imageUrl = rawImg.startsWith('http') ? rawImg : "https://gnwsrmelmeqduhhmfmoa.supabase.co/storage/v1/object/public/or-images/" + rawImg;
            }

            const brand = item.brand || "Strap";
            const model = item.model || "";
            const price = item.price || 0;
            const currency = item.currency || "€";

            const card = document.createElement("div");
            card.className = "product-card";
            // Këtu klikimi të dërgon te faqja e detajeve duke i kaluar ID-në e saktë
            card.onclick = () => {
                window.location.href = `product-details.html?id=${item.id}`;
            };

            card.innerHTML = `
                <div class="product-img-wrapper">
                    <img src="${imageUrl}" alt="${brand}" loading="lazy">
                </div>
                <div class="product-info">
                    <div class="product-brand">${brand}</div>
                    <div class="product-model">${model || 'Bracelet'}</div>
                    <div class="product-footer">
                        <span class="product-price">${price} ${currency}</span>
                    </div>
                </div>
            `;

            container.appendChild(card);
        });

    } catch (err) {
        console.error("Gabim:", err);
        container.innerHTML = `<div class="empty-text" style="color: red;">Gabim gjatë ngarkimit.</div>`;
    }
}

loadCategoryProducts();
</script>

</body>
</html>
