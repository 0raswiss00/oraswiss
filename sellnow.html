<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add New Watch</title>

<style>
body {
    background:#111;
    color:white;
    font-family:Arial, sans-serif;
}

form {
    max-width:600px;
    margin:30px auto;
    background:#1b1b1b;
    padding:25px;
    border-radius:10px;
}

h2 {
    text-align:center;
}

label {
    display:block;
    margin-top:12px;
    margin-bottom:5px;
    color:#ccc;
}

input, select, textarea {
    width:100%;
    padding:10px;
    background:#222;
    color:white;
    border:1px solid #444;
    border-radius:5px;
    box-sizing:border-box;
}

.row {
    display:flex;
    gap:15px;
    margin-top:10px;
}

.row > * {
    flex:1;
}

.checkbox-row {
    display:flex;
    justify-content:space-between;
    margin-top:15px;
}

button {
    width:100%;
    margin-top:20px;
    padding:12px;
    background:#c9a227;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}

button:hover {
    opacity:.8;
}

@media(max-width:600px){
    .row {
        flex-direction:column;
    }
}
</style>

</head>

<body>

<div style="display: flex; align-items: center; justify-content: space-between; padding: 5px 0; margin-bottom: 15px;">
    <button type="button" onclick="window.location.href='index.html'" style="background: #d4af37; color: #000; border: none; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; padding: 4px 10px;">
        Back
    </button>
</div>
<div>
    <h2 style="margin: 0; font-size: 18px; color: #fff; text-align: center;">
        Add New Watch
    </h2>
    <div style="width: 80px;"></div>
</div>

<form id="sellForm">
    <select id="category">
        <option value="luxury">Luxury</option>
        <option value="vintage">Vintage</option>
        <option value="parts">Parts</option>
        <option value="bracelets_straps">Bracelets / Straps</option>
    </select>

    <button id="goBracelets" type="button" style="display:none;">
        Continue to Bracelets / Straps
    </button>
     
    <div class="row">
        <input id="brand" type="text" placeholder="Brand" required>
        <input id="model" type="text" placeholder="Model" required>
    </div>

    <label>Price (€)</label>
    <input id="price" type="number">

    <label>Material</label>
    <input id="material" type="text" placeholder="Steel, Gold, Titanium...">
     
    <label>Net Weight (g)</label>
    <input id="net_weight" type="number" step="0.01" placeholder="Net weight of the item only, without packaging" required>

    <label>Reference:</label>
    <input id="reference" type="text" placeholder="Reference number">

    <label>Caliber:</label>
    <input id="caliber" type="text" placeholder="Caliber number">

    <label>Frekuenz:</label>
    <input id="frekuen" type="text" placeholder="Example: 28800 vph">   

    <label>Case Size:</label>
    <input id="case_size" type="text" placeholder="Example: 40mm or No Case">

    <div style="margin-top: 12px; margin-bottom: 5px;">
        <label style="display: block; margin-bottom: 5px; color: #ccc;">Movement Size / Type:</label>
        <select id="movement_type_select" onchange="handleMovementTypeChange(this)">
            <option value="">Zgjidh llojin...</option>
            <option value="diver">Diver</option>
            <option value="not_water_resistant">Not Water Resistant</option>
        </select>
        
        <div id="diver_numbers_container" style="display: none; margin-top: 10px;">
            <label style="display: block; margin-bottom: 5px; font-size: 13px; color: #aaa;">Diver Size:</label>
            <input id="movement_size" type="text" placeholder="Vendos numrat...">
        </div>
    </div>

    <label>Year</label>
    <input id="year" type="number">

    <label>Movement</label>
    <select id="movement">
        <option value="Automatic">Automatic</option>
        <option value="Manual">Manual</option>
        <option value="Quartz">Quartz</option>
    </select>

    <label>Function</label>
    <select id="function">
        <option>Date</option>
        <option>Chronometer</option>
        <option>Chronograph</option>
        <option>Chronograph Date</option>
        <option>Tourbillon</option>
        <option>Only time</option>
        <option>No Date</option>
    </select>

    <div class="checkbox-row">
        <label>Service Status:
            <select id="serviceStatus">
                <option value="">Not Serviced / Unknown</option>
                <option value="Completed">Service Completed</option>
                <option value="Not Serviced">Not Serviced</option>
            </select>
        </label>

        <label>
            <input id="service_date" type="date">
            Service Date
        </label>
    </div>

    <label>Box & Papers Status</label>
    <select id="box_papers">
        <option value="Box / Papers">Box / Papers</option>
        <option value="Box only">Box only</option>
        <option value="Papers only">Papers only</option>
        <option value="None">None</option>
    </select>

    <label>Origin</label>
    <select id="origin">
        <option>Switzerland</option>
        <option>Other</option>
    </select>

    <label>Work Status</label>
    <select id="work_status">
        <option>Working</option>
        <option>Not Working</option>
        <option>Not Tested</option>
    </select>

    <label>Bracelet</label>
    <select id="bracelet">
        <option>Leather</option>
        <option>Nato</option>
        <option>Rubber</option>
        <option>Bracelet</option>
        <option>No Bracelet No Leather</option>
    </select>

    <label>Glass
        <select id="glass">
            <option value="">Select Glass</option>
            <option value="Sapphire">Sapphire</option>
            <option value="Mineral">Mineral</option>
            <option value="Acrylic / Hesalite">Acrylic / Hesalite</option>
            <option value="Hardlex">Hardlex</option>
            <option value="K1 Mineral">K1 Mineral</option>
            <option value="No Glass">No Glass</option>
        </select>
    </label>

    <label>Warranty</label>
    <select id="warranty">
        <option>No Warranty</option>
        <option>Warranty</option>
    </select>

    <label>Warranty Months</label>
    <input id="warranty_months" type="number">

    <div class="shipping-config-group">
        <div class="field-wrapper">
            <label for="shipping_provider">Lloji i Shërbimit Postar</label>
            <select id="shipping_provider" name="shipping_provider">
                <option value="">Zgjidh shërbimin postar...</option>
                <option value="Standard">Posta Standarde (Lokale)</option>
                <option value="Express">Posta Express</option>
                <option value="DHL">DHL Express</option>
                <option value="FedEx">FedEx</option>
                <option value="Custom">Korrier Privat / Tjetër</option>
            </select>
        </div>

        <div class="field-wrapper">
            <label for="shipping_days">Koha e Dërgesës (Pas Blerjes)</label>
            <input id="shipping_days" type="text" placeholder="Shembull: DHL: 4-7 ditë ose Ekonomike: 25-30 ditë">
        </div>
    </div>

    <label>Serial Number</label>
    <input id="serial_number" type="text">

    <label>PayPal Link</label>
    <input id="paypal_link" type="text" placeholder="Generated automatically" readonly>

    <label>Description</label>
    <textarea id="description" rows="5" placeholder="Description"></textarea>

    <label>Upload Photos</label>
    <input id="fileInput" type="file" accept="image/*" multiple>

    <button type="submit">Sell Now</button>
</form>

<script>
function handleMovementTypeChange(selectElement) {
    const container = document.getElementById("diver_numbers_container");
    if (selectElement.value === "diver") {
        container.style.display = "block";
    } else {
        container.style.display = "none";
        document.getElementById("movement_size").value = "";
    }
}
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.js"></script>
<script src="db-connect.js"></script>    
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase = createClient(
    'https://gnwsrmelmeqduhhmfmoa.supabase.co',
    'sb_publishable__AkK_Z7lhtkvukN6Fy1cAQ_KBTXIcY9'
);

const { data: { user } } = await supabase.auth.getUser();

if(!user){
    alert("Duhet të jesh i loguar!");
    window.location.href="register.html";
}

document.getElementById("category").addEventListener("change", function(){
    const btn = document.getElementById("goBracelets");
    if(this.value === "bracelets_straps"){
        btn.style.display = "block";
    } else {
        btn.style.display = "none";
    }
});

document.getElementById("goBracelets").addEventListener("click", function(){
    window.location.href = "bracelets-straps.html";
});

document.getElementById("sellForm").addEventListener("submit", async function(e){
    e.preventDefault();

    const category = document.getElementById("category").value;
    if(category === "bracelets_straps"){
        window.location.href = "bracelets-straps.html";
        return;
    }

    const files = document.getElementById("fileInput").files;
    let imageUrls = [];

    for(let i=0; i<files.length; i++){
        const file = files[i];
        const fileName = Date.now() + "" + i + "" + file.name;

        const { error: uploadError } = await supabase
            .storage
            .from("or-images")
            .upload(fileName, file);

        if(uploadError){
            alert("Gabim gjatë upload fotos: " + uploadError.message);
            return;
        }

        const { data: urlData } = supabase
            .storage
            .from("or-images")
            .getPublicUrl(fileName);

        imageUrls.push(urlData.publicUrl);
    }

    const price = parseInt(document.getElementById("price").value) || 0;
    const paypalLink = "https://www.paypal.com/paypalme/EMRI_YT/" + price;
    document.getElementById("paypal_link").value = paypalLink;

    const movementType = document.getElementById("movement_type_select").value;
    const movementSizeValue = document.getElementById("movement_size").value;
    const finalMovementSize = movementType === "diver" ? ("Diver: " + movementSizeValue) : movementType;

    const oraData = {
        user_id: user.id,
        category: category,
        brand: document.getElementById("brand").value,
        model: document.getElementById("model").value,
        price: parseInt(document.getElementById("price").value) || null,
        paypal_link: paypalLink,
        reference: document.getElementById("reference").value,
        caliber: document.getElementById("caliber").value,
        frekuen: document.getElementById("frekuen").value,
        material: document.getElementById("material").value,
        net_weight: parseFloat(document.getElementById("net_weight").value) || null,
        case_size: document.getElementById("case_size").value,
        movement_size: finalMovementSize,
        year: parseInt(document.getElementById("year").value) || null,
        movement: document.getElementById("movement").value,
        function: document.getElementById("function").value,
        service: document.getElementById("serviceStatus")?.value === "Completed",
        service_date: document.getElementById("service_date")?.value || null,
        box_papers: document.getElementById("box_papers")?.value || "",
        origin: document.getElementById("origin").value,
        work_status: document.getElementById("work_status").value,
        bracelet: document.getElementById("bracelet").value,
        glass: document.getElementById("glass").value,
        warranty: document.getElementById("warranty").value,
        warranty_months: document.getElementById("warranty_months").value || null,
        shipping_provider: document.getElementById("shipping_provider").value,
        shipping_days: document.getElementById("shipping_days").value,
        serial_number: document.getElementById("serial_number").value,
        description: document.getElementById("description").value,
        image_url: imageUrls
    };

    const { error } = await supabase
        .from("oras")
        .insert([oraData]);

    if(error){
        alert("Gabim gjatë publikimit: " + error.message);
        return;
    }

    alert("🏆 Ora u publikua me sukses!");
    window.location.href = "dashboard.html";
});
</script>

</body>
</html>
