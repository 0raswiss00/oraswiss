<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofertat e Marra - OraSwiss</title>
    <!-- Lidh Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <style>
        body { background: #0b0b0b; color: #fff; font-family: sans-serif; margin: 0; padding-bottom: 70px; }
        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }
        h2 { border-bottom: 1px solid #333; padding-bottom: 10px; }
        .offer-card { background: #1a1a1a; padding: 15px; border-radius: 8px; border: 1px solid #333; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #111; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #333; }
        .bottom-nav-item { color: #aaa; text-decoration: none; font-size: 12px; text-align: center; }
        .bottom-nav-item:hover, .bottom-nav-item.active { color: #fff; }
        .btn-chat { background: #25D366; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Ofertat e Marra</h2>
        <div id="seller-offers-list" style="color: #aaa; margin-top: 20px;">Duke ngarkuar ofertat...</div>
    </div>

    <!-- Shiriti i poshtëm i navigimit -->
    <nav class="bottom-nav">
      <a href="index.html" class="bottom-nav-item">OraSwiss</a>
      <a href="profile.html" class="bottom-nav-item">Profile</a>
      <a href="favorites.html" class="bottom-nav-item">Favorites</a>
      <a href="collection.html" class="bottom-nav-item">Collection</a>
      <a href="mysales.html" class="bottom-nav-item">Sales</a>
      <a href="offers.html" class="bottom-nav-item active">Offers</a>
      <a href="sellnow.html" class="bottom-nav-item">Sell</a>
    </nav>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm";

const supabase = createClient(
    "https://gnwsrmelmeqduhhmfmoa.supabase.co",
    "sb_publishable__AkK_Z7lhtkvukN6Fy1cAQ_KBTXIcY9"
);

async function loadSellerOffers() {
    const { data: { user }, error: userError } = await supabase.auth.getUser();
    const container = document.getElementById("seller-offers-list");

    if (userError || !user) {
        container.innerHTML = "Ju duhet të jeni të loguar për të parë ofertat.";
        return;
    }

    const { data: offers, error } = await supabase
        .from("offers")
        .select("*")
        .eq("seller_id", user.id)
        .order("created_at", { ascending: false });

    if (error || !offers || offers.length === 0) {
        container.innerHTML = "Nuk keni asnjë ofertë të re.";
        return;
    }

    let html = '';
    for (const offer of offers) {
        html += `
            <div class="offer-card">
                <div>
                    <p style="color:#fff; margin:0 0 5px 0; font-weight:bold;">Çmimi i ofruar: ${offer.offered_price} €</p>
                    <p style="color:#888; margin:0; font-size:12px;">Statusi: <span style="color:${offer.status === 'pending' ? '#f39c12' : '#2ecc71'}">${offer.status}</span></p>
                </div>
                <div>
                    <button class="btn-chat" onclick="openChatWithBuyer('${offer.buyer_id}', '${offer.product_id}')">Flasim në Chat</button>
                </div>
            </div>
        `;
    }
    container.innerHTML = html;
}

window.openChatWithBuyer = function(buyerId, productId) {
    window.location.href = `chat.html?user=${buyerId}&product=${productId}`;
}

loadSellerOffers();
</script>

</script>
    
    
</body>    
</html>
