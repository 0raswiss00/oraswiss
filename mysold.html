<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>My Sold - Ora Swiss</title>

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
            padding: 20px;
            margin: 0;
        }

        .table-wrap {
            width: 100%;
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #111;
            min-width: 680px;
        }

        th, td {
            border: 1px solid #333;
            padding: 12px;
            text-align: left;
            vertical-align: middle;
        }

        th {
            background: gold;
            color: #000;
        }

        button {
            padding: 7px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .btn-track {
            background: #1f6feb;
            color: #fff;
        }

        .btn-return-review {
            background: #25D366;
            color: #000;
        }

        .btn-cancel {
            background: #dc3545;
            color: #fff;
        }

        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal-box {
            background: #111;
            border: 1px solid #444;
            border-radius: 10px;
            padding: 20px;
            width: 100%;
            max-width: 430px;
        }

        .modal-box h3 {
            margin-top: 0;
            color: gold;
        }

        .modal-box label {
            display: block;
            font-size: 0.85rem;
            color: #ccc;
            margin-bottom: 4px;
        }

        .modal-box input, .modal-box select, .modal-box textarea {
            width: 100%;
            padding: 10px;
            margin: 0 0 12px 0;
            background: #000;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            font-family: inherit;
        }

        .return-info {
            background: #181818;
            border: 1px solid #2e2e2e;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 0.85rem;
            margin-bottom: 14px;
            line-height: 1.5;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .btn-save {
            background: gold;
            color: #000;
        }

        .btn-close {
            background: #333;
            color: #fff;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.js"></script>
    <script src="db-connect.js"></script>
</head>

<body>

<h1>Menaxhimi i Porosive (My Sold)</h1>

<div class="table-wrap">
    <table>
        <thead>
            <tr>
                <th>Foto</th>
                <th>Ora / Artikulli</th>
                <th>ID Porosisë</th>
                <th>Statusi</th>
                <th>Nr. Dërgimi</th>
                <th>Veprime</th>
            </tr>
        </thead>

        <tbody id="sales-body">
            <tr>
                <td colspan="6" style="text-align:center;">Duke ngarkuar...</td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Modal për Nr. Dërgimi -->
<div id="trackingModal" class="modal-backdrop">
    <div class="modal-box">
        <h3>Nr. i Dërgimit (Tracking)</h3>
        <input type="text" id="trackingInput" placeholder="Vendos numrin e gjurmimit...">
        <div class="modal-actions">
            <button type="button" class="btn-close" onclick="closeTrackingModal()">Anulo</button>
            <button type="button" class="btn-save" onclick="saveTrackingNumber()">Ruaj</button>
        </div>
    </div>
</div>

<!-- Modal për Konfirmimin e Kthimit dhe Rimbursimin -->
<div id="returnReviewModal" class="modal-backdrop">
    <div class="modal-box">
        <h3>Konfirmo Kthimin &amp; Rimbursimin</h3>
        <input type="hidden" id="rev-order-id">
        <div class="return-info" id="rev-buyer-info"></div>

        <label for="rev-condition">Gjendja e kthimit:</label>
        <select id="rev-condition">
            <option value="ok_as_sent">Konfirmimi OK (Kthyer siç u dërgua)</option>
            <option value="not_returned">Nuk është kthyer ende / Pakon nuk e ka kthyer</option>
            <option value="different_from_sent">Nuk është kthyer siç e dërguam (i dëmtuar / ndryshe)</option>
            <option value="missing_parts">Mungojnë pjesë ose aksesorë</option>
        </select>

        <label for="rev-refund-type">Lloji i rimbursimit:</label>
        <select id="rev-refund-type" onchange="togglePartialAmount()">
            <option value="full">Rimbursim i plotë (100%)</option>
            <option value="partial">Rimbursim i pjesshëm</option>
            <option value="none">Pa rimbursim</option>
        </select>

        <div id="partial-wrap" style="display:none;">
            <label for="rev-refund-amount">Shuma e rimbursimit të pjesshëm (EUR):</label>
            <input type="number" step="0.01" id="rev-refund-amount" placeholder="p.sh. 150.00">
        </div>

        <div class="modal-actions">
            <button type="button" class="btn-close" onclick="closeReturnReviewModal()">Anulo</button>
            <button type="button" class="btn-save" onclick="saveReturnReview()">Ruaj &amp; Konfirmo</button>
        </div>
    </div>
</div>

<script>
    let editingOrderId = null;
    let soldOrdersCache = [];

    function escapeHtml(val) {
        if (val === null || val === undefined) return "";
        return String(val)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
    }

    function resolveWatchImage(imageField) {
        let primary = "";
        if (Array.isArray(imageField) && imageField.length > 0) {
            primary = imageField[0];
        } else if (typeof imageField === "string" && imageField.trim()) {
            try {
                const parsed = JSON.parse(imageField);
                primary = Array.isArray(parsed) ? parsed[0] : imageField;
            } catch (e) {
                primary = imageField;
            }
        }
        if (!primary) return "";
        const clean = String(primary).trim();
        if (clean.startsWith("http")) return clean;
        return "https://gnwsrmelmeqduhhmfmoa.supabase.co/storage/v1/object/public/or-images/" + clean;
    }

    function openTrackingModalByIndex(idx) {
        const order = soldOrdersCache[idx];
        if (!order) return;
        editingOrderId = order.id;
        document.getElementById("trackingInput").value = order.tracing_number || order.tracking_number || "";
        document.getElementById("trackingModal").classList.add("open");
    }

    function closeTrackingModal() {
        editingOrderId = null;
        document.getElementById("trackingModal").classList.remove("open");
    }

    async function saveTrackingNumber() {
        if (!editingOrderId) return;
        const val = document.getElementById("trackingInput").value.trim();

        const { error } = await window.supabaseClient
            .from("orders")
            .update({ tracing_number: val || null })
            .eq("id", editingOrderId);

        if (error) {
            alert("Gabim gjatë ruajtjes së numrit të dërgimit: " + error.message);
            return;
        }

        closeTrackingModal();
        loadMySold();
    }

    function togglePartialAmount() {
        const type = document.getElementById("rev-refund-type").value;
        document.getElementById("partial-wrap").style.display = type === "partial" ? "block" : "none";
    }

    function openReturnReviewByIndex(idx) {
        const order = soldOrdersCache[idx];
        if (!order) return;
        document.getElementById("rev-order-id").value = order.id;
        document.getElementById("rev-buyer-info").innerHTML = `
            <div><strong>Arsyeja:</strong> ${escapeHtml(order.return_reason || "Nuk është specifikuar")}</div>
            <div><strong>Përshkrimi:</strong> ${escapeHtml(order.return_description || "-")}</div>
            <div><strong>Nr. kthimit:</strong> ${escapeHtml(order.return_tracking_number || "Nuk ka")}</div>
        `;
        document.getElementById("rev-condition").value = order.return_condition || "ok_as_sent";
        document.getElementById("rev-refund-type").value = order.refund_type || "full";
        document.getElementById("rev-refund-amount").value = order.refund_amount ?? "";
        togglePartialAmount();
        document.getElementById("returnReviewModal").classList.add("open");
    }

    function closeReturnReviewModal() {
        document.getElementById("returnReviewModal").classList.remove("open");
    }

    async function saveReturnReview() {
        const orderId = document.getElementById("rev-order-id").value;
        const condition = document.getElementById("rev-condition").value;
        const refundType = document.getElementById("rev-refund-type").value;
        const partialRaw = document.getElementById("rev-refund-amount").value.trim();
        const refundAmount = refundType === "partial" ? (Number(partialRaw) || 0) : null;

        if (refundType === "partial" && (!partialRaw || refundAmount <= 0)) {
            alert("Vendos një vlerë të vlefshme për rimbursimin e pjesshëm.");
            return;
        }

        const nextStatus = condition === "not_returned"
            ? "return_not_received"
            : (refundType === "full" ? "refunded_full" : (refundType === "partial" ? "refunded_partial" : "return_reviewed"));

        const { error } = await window.supabaseClient
            .from("orders")
            .update({
                status: nextStatus,
                return_condition: condition,
                refund_type: refundType,
                refund_amount: refundAmount
            })
            .eq("id", orderId);

        if (error) {
            alert("Gabim gjatë përditësimit të kthimit: " + error.message);
            return;
        }

        closeReturnReviewModal();
        loadMySold();
    }

    async function loadMySold() {
        const soldBody = document.getElementById("sales-body");
        if (!soldBody) return;

        if (!window.supabaseClient) {
            soldBody.innerHTML = "<tr><td colspan='6'>Mungon lidhja me bazën e të dhënave (db-connect.js).</td></tr>";
            return;
        }

        const { data: { user } } = await window.supabaseClient.auth.getUser();

        if (!user) {
            soldBody.innerHTML = "<tr><td colspan='6'>Duhet të jesh i loguar.</td></tr>";
            return;
        }

        const { data, error } = await window.supabaseClient
            .from("orders")
            .select(`
                *,
                oras (
                    id,
                    brand,
                    model,
                    image_url
                )
            `)
            .eq("seller_id", user.id);

        if (error) {
            console.error(error);
            soldBody.innerHTML = "<tr><td colspan='6'>Gabim gjatë marrjes së të dhënave.</td></tr>";
            return;
        }

        soldOrdersCache = data || [];

        if (soldOrdersCache.length === 0) {
            soldBody.innerHTML = "<tr><td colspan='6'>Nuk ke asnjë shitje.</td></tr>";
            return;
        }

        soldBody.innerHTML = soldOrdersCache.map((order, idx) => {
            const ora = order.oras;
            const trackingVal = order.tracing_number || order.tracking_number || "";
            const hasReturn = Boolean(order.return_reason || order.return_tracking_number || String(order.status || "").includes("return") || String(order.status || "").includes("refund"));
            const imgUrl = ora ? resolveWatchImage(ora.image_url) : "";
            const titleText = ora
                ? `${escapeHtml(ora.brand || "")} ${escapeHtml(ora.model || "")}`.trim()
                : `Ora #${escapeHtml(order.product_id)}`;

            return `
                <tr>
                    <td>${imgUrl ? `<img src="${escapeHtml(imgUrl)}" alt="${titleText}" width="70" style="border-radius:6px;object-fit:cover;">` : "Pa foto"}</td>
                    <td>${titleText}</td>
                    <td>${escapeHtml(order.order_code || order.id)}</td>
                    <td>${escapeHtml(order.status || "-")}</td>
                    <td id="track-cell-${escapeHtml(order.id)}">${trackingVal ? escapeHtml(trackingVal) : "Nuk ka"}</td>
                    <td>
                        <button type="button" class="btn-track" onclick="openTrackingModalByIndex(${idx})">Shto/Edito</button>
                        <br>
                        ${hasReturn ? `<button type="button" class="btn-return-review" onclick="openReturnReviewByIndex(${idx})">Menaxho Kthimin</button><br>` : ""}
                        <button type="button" class="btn-cancel" onclick="anulloPorosine('${escapeHtml(order.id)}')">Anullo</button>
                    </td>
                </tr>
            `;
        }).join("");
    }

    async function anulloPorosine(orderId) {
        if (!confirm("A dëshironi ta anuloni këtë porosi?")) {
            return;
        }

        const { error } = await window.supabaseClient
            .from("orders")
            .update({ status: "cancelled" })
            .eq("id", orderId);

        if (error) {
            alert(error.message);
            return;
        }

        alert("Porosia u anulua me sukses.");
        loadMySold();
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", loadMySold);
    } else {
        loadMySold();
    }
</script>

</body>
</html>
