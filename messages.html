<!DOCTYPE html>
<html lang="sq">

<head>
<title>Messages - Oraswiss</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    padding-bottom:80px;
}
.header{
    background:#000;
    color:white;
    padding:18px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
}
.chat{
    background:white;
    margin:12px;
    padding:12px;
    border-radius:15px;
    cursor:pointer;
    position:relative;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
    display:flex;
    gap:15px;
    align-items:center;
}
.chat img{
    width:80px;
    height:80px;
    border-radius:12px;
    object-fit:cover;
}
.chat-info{
    flex:1;
}
.brand{
    font-weight:bold;
    font-size:16px;
}
.price{
    color:#009900;
    font-weight:bold;
    margin-top:5px;
}
.last-message{
    color:#666;
    margin-top:8px;
    font-size:14px;
}
.empty{
    text-align:center;
    margin-top:50px;
    color:#777;
}
</style>
</head>

<body>

<div class="header" style="display: flex; align-items: center; justify-content: space-between; padding: 10px 15px; position: relative;">
    <button onclick="window.location.href='index.html'" style="background: #d4af37; color: #000; border: none; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; padding: 4px 10px;">Back</button>
    <span style="position: absolute; left: 50%; transform: translateX(-50%); font-size: 18px;">💬 Messages</span>
    <div></div>
</div>

<div id="chatList"></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm";

const supabase = createClient(
    "https://gnwsrmelmeqduhhmfmoa.supabase.co",
    "sb_publishable__AkK_Z7lhtkvukN6Fy1cAQ_KBTXIcY9"
);

async function loadConversations() {
    const { data: convs, error } = await supabase
        .from("conversations")
        .select(`
            id,
            last_message,
            updated_at,
            listing_id,
            oras ( brand, model, price, image_url )
        `)
        .order("updated_at", { ascending: false });

    const chatList = document.getElementById("chatList");
    chatList.innerHTML = "";

    if (error || !convs || convs.length === 0) {
        chatList.innerHTML = "<p style='padding:15px; color:#666; text-align:center;'>Nuk keni biseda aktive.</p>";
        return;
    }

    convs.forEach(conv => {
        let watchImg = "";
        let watchTitle = "Bisedë e përgjithshme";
        let watchPrice = 0;
        
        if (conv.oras) {
            let imgArr = conv.oras.image_url;
            watchImg = Array.isArray(imgArr) ? imgArr[0] : imgArr;
            watchTitle = `${conv.oras.brand || ""} ${conv.oras.model || ""}`.trim();
            watchPrice = conv.oras.price || 0;
        }

        const div = document.createElement("div");
        div.className = "chat";
        div.onclick = () => window.location.href = `chat.html?conversation=${conv.id}`;

        let lastMsgText = conv.last_message || "Kliko për të parë mesazhet...";
        if(lastMsgText.includes("message-images") || lastMsgText.match(/\.(jpeg|jpg|png|gif)$/i)){
            lastMsgText = "📷 [Foto]";
        }

        div.innerHTML = `
            ${watchImg ? `<img src="${watchImg}">` : `<div style="width:80px; height:80px; background:#ddd; border-radius:12px; display:flex; align-items:center; justify-content:center;">⌚</div>`}
            <div class="chat-info">
                <div class="brand">${watchTitle || "Bisedë"}</div>
                <div class="price">${watchPrice} €</div>
                <div class="last-message">${lastMsgText}</div>
            </div>
        `;
        chatList.appendChild(div);
    });
}

loadConversations();
</script>

</body>
</html>
