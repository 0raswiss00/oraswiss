<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofertat e Marra - OraSwiss</title>
    <style>
        body { 
            background: #0b0b0b; 
            color: #fff; 
            font-family: sans-serif; 
            margin: 0; 
            padding-bottom: 70px; 
        }

        .container { 
            max-width: 600px; 
            margin: 20px auto; 
            padding: 0 15px; 
        }

        h2 { 
            border-bottom: 1px solid #333; 
            padding-bottom: 10px; 
        }

        .offer-card { 
            background: #1a1a1a; 
            padding: 12px; 
            border-radius: 5px; 
            border: 1px solid #333; 
            margin-bottom: 10px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-wrap: wrap; 
            gap: 8px; 
        }

        .offer-card img {
            width: 100px !important;
            height: 100px !important;
            max-width: 100px;
            max-height: 100px;
            object-fit: cover;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .bottom-nav { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            background: #111; 
            display: flex; 
            justify-content: space-around; 
            padding: 10px 0; 
            border-top: 1px solid #333; 
            z-index: 1000; 
        }

        .bottom-nav-item { 
            color: #aaa; 
            text-decoration: none; 
            font-size: 12px; 
            text-align: center; 
        }

        .bottom-nav-item:hover, 
        .bottom-nav-item.active { 
            color: #fff; 
        }

        .btn-chat { 
            background: #25D366; 
            color: #fff; 
            border: none; 
            padding: 8px 12px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Ofertat e Marra</h2>
        <div id="seller-offers-list" style="color: #aaa; margin-top: 20px;">Duke ngarkuar ofertat...</div>
    </div>

    <!-- Shiriti i poshtëm i navigimit -->
    <nav class="bottom-nav">
      <a href="index.html" class="bottom-nav-item">OraSwiss</a>
      <a href="profile.html" class="bottom-nav-item">Profile</a>
      <a href="favorites.html" class="bottom-nav-item">Favorites</a>
      <a href="collection.html" class="bottom-nav-item">Collection</a>
      <a href="mysales.html" class="bottom-nav-item">Sales</a>
      <a href="offers.html" class="bottom-nav-item active">Offers</a>
      <a href="sellnow.html" class="bottom-nav-item">Sell</a>
    </nav>

    <!-- Supabase Logic -->
   <script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm";

const supabase = createClient(
    "https://gnwsrmelmeqduhhmfmoa.supabase.co",
    "sb_publishable__AkK_Z7lhtkvukN6Fy1cAQ_KBTXIcY9"
);


async function loadSellerOffers() {

    const container = document.getElementById("seller-offers-list");

    if (!container) return;


    const { data:{user}, error:userError } = await supabase.auth.getUser();


    if(userError || !user){
        container.innerHTML = "Ju duhet të jeni të loguar.";
        return;
    }


    const { data:offers, error } = await supabase
        .from("offers")
        .select("*")
        .eq("seller_id", user.id)
        .order("created_at",{ascending:false});

    const { data: watches, error: watchError } = await supabase
        .from("oras")
        .select("*");

    console.log("WATCHES:", watches);
    console.log("WATCH ERROR:", watchError);


    const { data: straps, error: strapsError } = await supabase
        .from("bracelets_straps")
        .select("*");

    const products = [
        ...(watches || []),
        ...(straps || [])
    ];
     
    console.log("STRAPS:", straps);
    console.log("STRAPS ERROR:", strapsError);

    console.log("WATCHES:", watches);
    console.log("WATCH ERROR:", watchError);

    console.log("STRAPS:", straps);
    console.log("STRAPS ERROR:", strapsError);

    console.log("PRODUCTS:", products);


    console.log("OFFERS:", offers);
    console.log("ERROR:", error);


    if(error){
        container.innerHTML = error.message;
        return;
    }


    if(!offers || offers.length === 0){
        container.innerHTML = "Nuk ka oferta.";
        return;
    }


    let html="";

     offers.forEach(offer => {

    let actionButtons = "";

    console.log("KERKOJ PRODUCT ID:", offer.product_id);

    console.log(
        "PRODUKTE ME TE NJEJTIN ID:",
        products.filter(
            p => String(p.id) === String(offer.product_id)
        )
    );

    console.log(
        "TE GJITHA ID:",
        products.map(p => p.id)
    );
         

    const product = products.find(
        p => String(p.id) === String(offer.product_id)
    );


    const productImage =
        Array.isArray(product?.image_url)
            ? product.image_url[0]
            : product?.image_url ||
              product?.image ||
              (Array.isArray(product?.photos) ? product.photos[0] : product?.photos) ||
              'images/default.png';


    console.log("PRODUCT:", product);
    console.log("PRODUCT IMAGE:", productImage);

    console.log("IMAGE URL:", product?.image_url);

    console.log("PRICE:", product?.price);

    console.log("KEYS PRODUCT:", Object.keys(product || {}));
         
    console.log("KONTROLL OFERTA:", {
        id: offer.id,
        status: offer.status,
        counter_offer: offer.counter_offer,
        last_offer_by: offer.last_offer_by
    });

    console.log("PRODUCT ID NGA OFERTA:", offer.product_id);

    console.log("TE GJITHA FUSHAT E PRODUKTIT:", product ? {
        id: product.id,
        brand: product.brand,
        model: product.model,
        image_url: product.image_url,
        image: product.image,
        photos: product.photos
    } : "NUK U GJET PRODUKTI");

    // OFERTA E RE
    if (offer.status === "pending") {

        actionButtons = `

        <button class="btn-action"
        data-id="${offer.id}"
        data-status="accepted">
        ✓ Prano
        </button>


        <button class="btn-action"
        data-id="${offer.id}"
        data-status="rejected">
        ✕ Refuzo
        </button>


        <button class="btn-action"
        data-id="${offer.id}"
        data-status="countered">
        💬 Kundërofertë
        </button>

        `;


    }



    // KUNDEROFERTA
    else if (offer.status === "countered") {


        if (offer.last_offer_by === "buyer") {


            actionButtons = `

            <p style="color:#f39c12;font-weight:bold">
            Kundëroferta e blerësit: ${offer.counter_offer} € u dërgua.
            </p>


            <button class="btn-action"
            data-id="${offer.id}"
            data-status="accepted">
            ✓ Prano
            </button>


            <button class="btn-action"
            data-id="${offer.id}"
            data-status="rejected">
            ✕ Refuzo
            </button>


            <button class="btn-action"
            data-id="${offer.id}"
            data-status="countered">
            💬 Kundërofertë
            </button>

            `;


        } else {


            actionButtons = `

            <p style="color:#f39c12;font-weight:bold">
            Kundëroferta juaj: ${offer.counter_offer} € u dërgua.
            </p>

            `;

        }


    }



    // PRANUAR
    else if (offer.status === "accepted") {


        actionButtons = `

        <span style="color:#2ecc71;font-weight:bold">
        ✓ Oferta u pranua
        </span>

        `;


    }



    // REFUZUAR
    else if (offer.status === "rejected") {


        actionButtons = `

        <span style="color:#e74c3c;font-weight:bold">
        ✕ Oferta u refuzua
        </span>

        `;

    }

    console.log("FOTO:", 
        product?.image_url,
        product?.image,
        product?.photos
    );

    html += `

    <div class="offer-card">

       <div>

           <a href="product.html?id=${offer.product_id}" 
           style="text-decoration:none;color:white;">

               <img
               src="${productImage}"
               style="
               width:100px;
               height:100px;
               max-width:100px;
               max-height:100px;
               object-fit:cover;
               border-radius:8px;
               display:block;
               ">

               <h3>
               ${product?.brand || ""}
               ${product?.model || ""}
               </h3>

           </a>

           <p>
           <b>Çmimi:</b>
           ${product?.price ?? "N/A"} €
           </p>

           <p>
           <b>Oferta:</b>
           ${offer.offered_price} €
           </p>

           <p>
           <b>Statusi:</b>
           ${offer.status}
           </p>

       </div>

       <div>
       ${actionButtons}
       </div>

   </div>

   `;


}); // <-- KJO ËSHTË KLLAPA E MBYLLJES SË forEach



container.innerHTML = html;



document.querySelectorAll(".btn-action").forEach(btn => {


    btn.onclick = async () => {


        await updateOfferStatus(
            btn.dataset.id,
            btn.dataset.status
        );


    };


});

    
}




async function updateOfferStatus(id,status){


    let updateData={};



    if(status==="countered"){


        const amount=prompt("Shkruaj kundërofertën (€):");


        if(!amount) return;


        const price=Number(amount);


        if(isNaN(price)){
            alert("Çmim gabim");
            return;
        }



        updateData={

            status:"countered",
            counter_offer:price,
            last_offer_by:"seller"

        };



    } else {


        updateData={

            status:status

        };


    }



    const {data,error}=await supabase
    .from("offers")
    .update(updateData)
    .eq("id",id)
    .select();



    console.log("UPDATE:",data,error);



    if(error){

        alert(error.message);
        return;

    }



    loadSellerOffers();



}




document.addEventListener("DOMContentLoaded",()=>{

    loadSellerOffers();

});

</script> 
        
</body>
</html>
