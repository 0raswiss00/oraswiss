<script type="module">

import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase = createClient(
    'https://gnwsrmelmeqduhhmfmoa.supabase.co',
    'sb_publishable__AkK_Z7lhtkvukN6Fy1cAQ_KBTXIcY9'
);

const { data: { user } } = await supabase.auth.getUser();

if (!user) {
    alert("You must be logged in!");
    window.location.href = "register.html";
}

function syncMovementPreset() {
    const caliber = document.getElementById("preset_caliber")?.value || "";
    const partName = document.getElementById("preset_part_name")?.value || "";
    const qty = document.getElementById("preset_qty")?.value || "1";
    const condState = document.getElementById("preset_condition_state")?.value || "Good / Working";

    const caliberInput = document.getElementById("caliber");
    const customPartInput = document.getElementById("custom_part_name");
    const modelInput = document.getElementById("model");
    const conditionSelect = document.getElementById("condition");
    const descTextarea = document.getElementById("description");

    if (caliber && caliberInput) caliberInput.value = caliber;
    if (partName && customPartInput) customPartInput.value = partName;
    if (partName && modelInput && !modelInput.value) modelInput.value = partName;

    if (conditionSelect) {
        conditionSelect.value = condState.includes("Damaged")
            ? "Used For Repair & Spares"
            : "Used Good";
    }

    if (descTextarea && (caliber || partName)) {
        const line = `Caliber: ${caliber || "-"} | Part: ${partName || "-"} | Qty: ${qty} pcs | Condition: ${condState}`;
        const cleaned = descTextarea.value
            .split("\n")
            .filter(l => !l.startsWith("Caliber:"))
            .join("\n")
            .trim();
        descTextarea.value = cleaned ? `${cleaned}\n${line}` : line;
    }
}

function updateMovementPresetVisibility() {
    const category = document.getElementById("category").value;
    const partType = document.getElementById("part_type").value;
    const mpBox = document.getElementById("movement_presets_box");

    if (category === "parts" && partType === "movement_part") {
        mpBox.style.display = "block";
    } else {
        mpBox.style.display = "none";
    }
}

function updateCategoryFields() {
    const category = document.getElementById("category").value;
    const caseBox = document.getElementById("case_size_box");
    const movementBox = document.getElementById("movement_size_box");
    const watchFields = document.getElementById("watch_fields");
    const partsBox = document.getElementById("parts_category_box");
    const goBraceletsBtn = document.getElementById("goBracelets");
    const quickMpBtn = document.getElementById("quickMovementPartBtn");

    caseBox.style.display = "none";
    movementBox.style.display = "none";
    watchFields.style.display = "none";
    partsBox.style.display = "none";
    goBraceletsBtn.style.display = "none";
    quickMpBtn.style.display = "none";

    if (category === "luxury" || category === "vintage") {
        caseBox.style.display = "block";
        watchFields.style.display = "block";
    }

    if (category === "parts") {
        partsBox.style.display = "block";
        movementBox.style.display = "block";
        quickMpBtn.style.display = "inline-block";
    }

    if (category === "bracelets_straps") {
        goBraceletsBtn.style.display = "block";
    }

    updateMovementPresetVisibility();
}

document.getElementById("category").addEventListener("change", updateCategoryFields);
document.getElementById("part_type").addEventListener("change", updateMovementPresetVisibility);

document.getElementById("quickMovementPartBtn").addEventListener("click", function() {
    document.getElementById("category").value = "parts";
    updateCategoryFields();
    document.getElementById("part_type").value = "movement_part";
    updateMovementPresetVisibility();
    document.getElementById("movement_presets_box").scrollIntoView({ behavior: "smooth" });
});

["preset_caliber", "preset_part_name", "preset_qty", "preset_condition_state"].forEach(id => {
    document.getElementById(id)?.addEventListener("change", syncMovementPreset);
});

document.getElementById("goBracelets").addEventListener("click", function() {
    window.location.href = "bracelets-straps.html";
});

document.getElementById("sellForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const category = document.getElementById("category").value;

    if (category === "bracelets_straps") {
        window.location.href = "bracelets-straps.html";
        return;
    }

    const files = document.getElementById("fileInput").files;
    let imageUrls = [];

    for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const fileName = Date.now() + "" + i + "" + file.name;

        const { error: uploadError } = await supabase
            .storage
            .from("or-images")
            .upload(fileName, file);

        if (uploadError) {
            alert("Error uploading photo: " + uploadError.message);
            return;
        }

        const { data: urlData } = supabase
            .storage
            .from("or-images")
            .getPublicUrl(fileName);

        imageUrls.push(urlData.publicUrl);
    }

    const price = parseInt(document.getElementById("price").value) || 0;
    const partType = document.getElementById("part_type").value;
    const finalCategory = (category === "parts" && partType === "movement_part") ? "Movement Parts" : category;

    const oraData = {
        user_id: user.id,
        category: finalCategory,
        part_type: partType,
        custom_part_name: document.getElementById("custom_part_name").value,
        brand: document.getElementById("brand").value,
        model: document.getElementById("model").value,
        price: price || null,
        condition: document.getElementById("condition").value,
        paypal_link: document.getElementById("paypal_link").value,
        reference: document.getElementById("reference").value,
        caliber: document.getElementById("caliber").value,
        gender: document.getElementById("gender").value,
        dial_color: document.getElementById("dial_color").value,
