    <meta charset="utf-8"/>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KD2ZZ3MJYY"></script>
    <script>

    <script>
      // Lexon ID nga URL (p.sh. ?id=168)
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get('id');

      if (productId) {
        const SUPABASE_URL = 'https://gnwsrmelmeqduhhmfmoa.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable__AkK_Z7lhtkvukN6Fy1cAQ_KBTXIcY9';
    
        // ZGJIDHNI TABELËN SIPAS KATEGORISë: 
        // Për shembull, nëse jeni te "parts", ndryshoni 'oras' në 'parts' ose emrin e saktë të tabelës suaj në Supabase:
        const tableName = 'oras'; // Ose 'parts', 'bracelets_straps', etj.

        fetch(${SUPABASE_URL}/rest/v1/${tableName}?id=eq.${productId}&select=brand,model,reference, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': Bearer ${SUPABASE_ANON_KEY}
          }
        })
        .then(response => response.json())
        .then(data => {
          if (data && data.length > 0) {
            const p = data[0];
            // Për pjesët (parts) ose rripat (straps) nëse nuk kanë model apo referencë, 
            // mund të përshtatni fushat që shfaqen (p.sh. p.brand, p.name, etj.)
            const productTitle = ${p.brand || ''} ${p.model || ''} - ${p.reference || ''} | Ora Swiss;
        
            // Ndryshon titullin e faqes
            document.title = productTitle.trim();

            // Përditëson ose krijon Open Graph tag për share (WhatsApp, etj.)
            let ogTitle = document.querySelector('meta[property="og:title"]');
            if (!ogTitle) {
              ogTitle = document.createElement('meta');
              ogTitle.setAttribute('property', 'og:title');
              document.head.appendChild(ogTitle);
            }
            ogTitle.setAttribute('content', productTitle.trim());
          }
        }).catch(err => console.error("Gabim në marrjen e të dhënave:", err));
      }
    </script>
    
    <style>
        body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #0b0b0b; color: #fff; padding-bottom: 110px; }

<body>

<header class="site-header">
    <nav class="nav-scroll">
        <span class="site-title">ORA<br>SWISS</span>

</header>

    <!-- Kutia e Kërkimit -->
    <input type="text" id="search-input" class="search-box" placeholder="Kërko sipas brendit, modelit ose materialit...">

    <div id="oras-container" class="grid">Duke ngarkuar koleksionin...</div>
</div>

<script>
    let allOrasData = [];

    async function loadOras() {
        const container = document.getElementById("oras-container");
        
        if (!window.supabaseClient) {
            container.innerHTML = "<p style='color:red;'>Gabim në lidhjen me databazën.</p>";
            return;
        }

        const category = 'parts';  

        const { data, error } = await window.supabaseClient
            .from('oras')
            .select('*')
            .eq('category', category);

        if (error) {
            container.innerHTML = "<p style='color:red;'>Gabim gjatë ngarkimit: " + error.message + "</p>";
            return;
        }

        if (!data || data.length === 0) {
            container.innerHTML = "<p>Nuk ka artikuj në këtë kategori.</p>";
            return;
        }

        allOrasData = data;
        renderCards(allOrasData);
    }

    function renderCards(items) {
        const container = document.getElementById("oras-container");
        
        if (items.length === 0) {
            container.innerHTML = "<p>Nuk u gjet asnjë artikull që i përgjigjet kërkimit tuaj.</p>";
            return;
        }

        let cardsHtml = "";

        items.forEach(ora => {
            let imgUrl = "https://placeholder.co/600x400/222/fff?text=No+Image";
            let primaryImage = "";

            if (ora.image_url) {
                if (Array.isArray(ora.image_url) && ora.image_url.length > 0) {
                    primaryImage = ora.image_url[0];
                } else if (typeof ora.image_url === 'string') {
                    try {
                        let parsed = JSON.parse(ora.image_url);
                        primaryImage = Array.isArray(parsed) ? parsed[0] : ora.image_url;
                    } catch(e) {
                        primaryImage = ora.image_url;
                    }
                }
            }

            if (primaryImage && primaryImage !== 'null' && primaryImage !== '') {
                if (primaryImage.startsWith('http')) {
                    imgUrl = primaryImage;
                } else {
                    const SUPABASE_URL = "https://gnwsrmelmeqduhhmfmoa.supabase.co";
                    imgUrl = SUPABASE_URL + "/storage/v1/object/public/or-images/" + primaryImage;
                }
            }

            cardsHtml += `
            <div class="card" onclick="window.location.href='product.html?id=${ora.id}'">
                <div>
                    <img src="${imgUrl}" alt="${ora.brand || 'Part'}">
                    <h3 style="margin: 8px 0 4px 0; font-size: 16px;">${ora.brand || ''}</h3>
                    <div style="font-size: 14px; color: #aaa; margin-bottom: 6px;">${ora.model || ''}</div>
                    <div class="price">${ora.price ? ora.price + ' €' : 'Contact'}</div>
                </div>

                <div>
                    <button class="btn-main btn-secondary" style="width:100%; padding:10px; font-size:14px;" 
                        onclick="event.stopPropagation(); window.location.href='product.html?id=${ora.id}';">
                        View Details
                    </button>
                </div>
            </div>
            `;
        });

        container.innerHTML = cardsHtml;
    }

    // Funksionaliteti i kërkimit (Search live)
    document.getElementById("search-input").addEventListener("input", function(e) {
        const query = e.target.value.toLowerCase().trim();
        const filtered = allOrasData.filter(ora => {
            const brand = (ora.brand || "").toLowerCase();
            const model = (ora.model || "").toLowerCase();
            const description = (ora.description || "").toLowerCase();
            return brand.includes(query) || model.includes(query) || description.includes(query);
        });
        renderCards(filtered);
    });

    document.addEventListener("DOMContentLoaded", loadOras);

    // Funksioni checkMenu për butonin Menu në fund
    function checkMenu(event) {
        event.stopPropagation();
        if (typeof window.toggleMenu === 'function') {
            window.toggleMenu();
        } else {
            alert('Menuja është duke u ngarkuar ose mungon skripta kryesore e menusë.');
        }
    }
</script>

<nav class="bottom-nav">
    <a href="index.html">Home</a>
    <a href="favorites.html">Favs</a>
    <a href="messages.html">Messages</a>
    <a href="mysales.html">Sales</a>
    <a href="sellnow.html">Sell</a>
    <button type="button" onclick="checkMenu(event)">Menu</button>
</nav>
<script>
let lastScrollTop = 0;
const nav = document.querySelector(".bottom-nav");

window.addEventListener("scroll", () => {
    const scrollTop = window.pageYOffset || document.documentElement.scrollTop;

    if (scrollTop > lastScrollTop && scrollTop > 50) {
        // Kur zbret poshtë
        nav.classList.add("nav-hidden");
    } else {
        // Kur ngjitet lart
        nav.classList.remove("nav-hidden");
    }

    lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
});
</script>
