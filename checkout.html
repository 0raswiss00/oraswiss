<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Order - Ora Swiss</title>
    <link rel="icon" href="data:,">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KD2ZZ3MJYY"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-KD2ZZ3MJYY');
    </script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: #ffffff;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #1e1e1e;
            border: 1px solid #333333;
            padding: 28px;
            border-radius: 12px;
            max-width: 460px;
            width: 100%;
            margin: auto;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        }
        .card h2 {
            margin-top: 0;
            margin-bottom: 12px;
        }
        .success-card h2 {
            color: #25D366;
            text-align: center;
        }
        .success-card p {
            color: #dddddd;
            line-height: 1.5;
            text-align: center;
            margin-bottom: 16px;
        }
        .order-meta {
            background: #141414;
            border: 1px solid #2b2b2b;
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #d8d8d8;
            line-height: 1.65;
        }
        .order-meta strong {
            color: #ffd900;
        }
        .order-meta a {
            color: #ffd900;
            word-break: break-all;
        }
        .product-summary {
            display: flex;
            gap: 12px;
            align-items: center;
            background: #141414;
            border: 1px solid #2b2b2b;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 18px;
            font-size: 14px;
            color: #e5e5e5;
            line-height: 1.45;
        }
        .product-thumb {
            width: 72px;
            height: 72px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #2f2f2f;
            background: #0b0b0b;
            flex-shrink: 0;
        }
        .product-info {
            min-width: 0;
            flex: 1;
        }
        .product-link {
            display: inline-block;
            margin-top: 6px;
            font-size: 12px;
            color: #ffd900;
            text-decoration: none;
            word-break: break-all;
        }
        .product-link:hover {
            text-decoration: underline;
        }
        .field {
            margin-bottom: 12px;
        }
        .field label {
            display: block;
            font-size: 13px;
            color: #bbbbbb;
            margin-bottom: 5px;
        }
        .field input,
        .field select,
        .field textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #3a3a3a;
            background: #121212;
            color: #ffffff;
            font-size: 14px;
        }
        .field input:focus,
        .field select:focus,
        .field textarea:focus {
            outline: none;
            border-color: #ffd900;
        }
        .form-status {
            color: #ff6b6b;
            font-size: 13px;
            margin-bottom: 10px;
            min-height: 18px;
        }
        .submit-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #ffd900;
            color: #000000;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 4px;
        }
        .submit-btn:hover:not(:disabled) {
            background: #ffe44d;
        }
        .submit-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }
        .back-wrap {
            text-align: center;
        }
        .back-link {
            display: inline-block;
            color: #ffd900;
            text-decoration: none;
            font-weight: bold;
            padding: 10px 16px;
            border-radius: 8px;
            background: #141414;
            border: 1px solid #333333;
        }
        .back-link:hover {
            background: #262626;
        }
    </style>
</head>
<body>

<!-- CHECKOUT FORM -->
<div class="card" id="checkoutBox">
    <h2>Complete Order</h2>
    <div class="product-summary" id="productSummary">
        <div class="product-info">Loading product...</div>
    </div>

    <form id="orderForm">
        <div class="field">
            <label for="buyerName">Full Name</label>
            <input type="text" id="buyerName" required placeholder="First and Last Name">
        </div>

        <div class="field">
            <label for="buyerEmail">Email</label>
            <input type="email" id="buyerEmail" required placeholder="name@example.com">
        </div>

        <div class="field">
            <label for="buyerCountry">Shipping Country</label>
            <select id="buyerCountry">
                <option value="AL">Albania (AL)</option>
                <option value="CH">Switzerland (CH)</option>
                <option value="IT">Italy (IT)</option>
                <option value="DE">Germany (DE)</option>
                <option value="GB">United Kingdom (GB)</option>
                <option value="US" selected>United States (US)</option>
            </select>
        </div>

        <div class="field">
            <label for="buyerAddress">Full Shipping Address</label>
            <textarea id="buyerAddress" rows="2" required placeholder="Street, city, postal code"></textarea>
        </div>

        <div class="form-status" id="formStatus"></div>
        <button type="submit" class="submit-btn" id="submitBtn">Confirm Order</button>
    </form>
</div>

<!-- SUCCESS CARD -->
<div class="card success-card" id="successCard" style="display: none;">
    <h2>Order Placed Successfully!</h2>
    <p>Thank you for choosing Ora Swiss. We will contact you shortly regarding shipping.</p>
    <div class="order-meta" id="orderMeta"></div>
    <div class="back-wrap">
        <a href="index.html" id="backLink" class="back-link">← Back</a>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://gnwsrmelmeqduhhmfmoa.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable__AkK_Z7lhtkvukN6Fy1cAQ_KBTXIcY9";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const params = new URLSearchParams(window.location.search);
    const rawId = params.get("id") || "";
    const idMatch = rawId.match(/\d+/);
    const productId = idMatch ? Number(idMatch[0]) : null;
    const tableName = params.get("table") === "bracelets_straps" ? "bracelets_straps" : "oras";

    let loadedProduct = null;
    let isSubmitting = false;

    function getProductPageUrl() {
        if (!productId) return `${window.location.origin}/index.html`;
        const tableParam = tableName === "bracelets_straps" ? "&category=bracelets_straps" : "";
        return `${window.location.origin}/product.html?id=${productId}${tableParam}`;
    }

    function resolveImageUrl(rawImageUrl) {
        let list = [];
        if (Array.isArray(rawImageUrl)) {
            list = rawImageUrl;
        } else if (typeof rawImageUrl === "string" && rawImageUrl.trim()) {
            try {
                const parsed = JSON.parse(rawImageUrl);
                list = Array.isArray(parsed) ? parsed : [rawImageUrl];
            } catch (e) {
                list = [rawImageUrl];
            }
        }
        const first = list.find(Boolean);
        if (!first) return "";
        return String(first).startsWith("http")
            ? String(first)
            : `${SUPABASE_URL}/storage/v1/object/public/or-images/${first}`;
    }

    const backLink = document.getElementById("backLink");
    if (backLink) {
        const returnParam = params.get("return");
        const safeReturn =
            returnParam && !returnParam.startsWith("http") && !returnParam.startsWith("//")
                ? returnParam
                : null;
        const sameOriginRef =
            document.referrer && document.referrer.startsWith(window.location.origin)
                ? document.referrer
                : null;
        const productFallback = productId ? getProductPageUrl() : "index.html";

        backLink.href = safeReturn || sameOriginRef || productFallback;

        backLink.addEventListener("click", function (e) {
            if (window.history.length > 1 && sameOriginRef) {
                e.preventDefault();
                window.history.back();
            }
        });
    }

    (async function loadCheckoutProduct() {
        const summaryEl = document.getElementById("productSummary");
        const productLinkUrl = getProductPageUrl();

        if (!productId) {
            summaryEl.innerHTML = `<div class="product-info">Selected item for order.</div>`;
            return;
        }

        try {
            const { data, error } = await supabaseClient
                .from(tableName)
                .select("*")
                .eq("id", productId)
                .maybeSingle();

            if (error) {
                console.warn("Checkout product error:", error.message);
            }

            if (data) {
                loadedProduct = data;
                const title = [data.brand, data.model, data.reference ? `Ref. ${data.reference}` : ""]
                    .filter(Boolean)
                    .join(" ") || `Product #${productId}`;
                const serialValue = data.serial_number || data.serial || "";
                const rawPrice = data.price ?? data.price_eur ?? data.cmimi ?? "";
                const priceText = rawPrice !== "" ? `${rawPrice} ${data.currency || "EUR"}` : "";
                const imgUrl = resolveImageUrl(data.image_url);

                summaryEl.innerHTML = `
                    ${imgUrl ? `<img src="${imgUrl}" alt="${title}" class="product-thumb">` : ""}
                    <div class="product-info">
                        <strong>${title}</strong>
                        ${priceText ? `<br>Price: <strong>${priceText}</strong>` : ""}
                        ${serialValue ? `<br>Serial No.: <strong>${serialValue}</strong>` : ""}
                        <br><a href="${productLinkUrl}" class="product-link">View product link</a>
                    </div>
                `;
            } else {
                summaryEl.innerHTML = `
                    <div class="product-info">
                        <strong>Product #${productId}</strong>
                        <br><a href="${productLinkUrl}" class="product-link">View product link</a>
                    </div>
                `;
            }
        } catch (err) {
            console.warn("Checkout product catch:", err);
            summaryEl.innerHTML = `
                <div class="product-info">
                    <strong>Product #${productId}</strong>
                    <br><a href="${productLinkUrl}" class="product-link">View product link</a>
                </div>
            `;
        }
    })();

    function trackPurchaseEvent(orderInfo) {
        if (typeof gtag !== "function") return;
        const numericPrice = loadedProduct && Number(loadedProduct.price) ? Number(loadedProduct.price) : 0;
        const itemTitle = loadedProduct
            ? [loadedProduct.brand, loadedProduct.model].filter(Boolean).join(" ") || `Item #${productId}`
            : `Item #${productId || "unknown"}`;

        gtag("event", "purchase", {
            transaction_id: orderInfo.orderId,
            value: numericPrice,
            currency: "EUR",
            items: [
                {
                    item_id: String(productId || "unknown"),
                    item_name: itemTitle,
                    price: numericPrice,
                    quantity: 1
                }
            ]
        });
    }

    document.getElementById("orderForm").addEventListener("submit", async function (e) {
        e.preventDefault();
        if (isSubmitting) return;

        const statusEl = document.getElementById("formStatus");
        const submitBtn = document.getElementById("submitBtn");
        statusEl.textContent = "";

        const buyerName = document.getElementById("buyerName").value.trim();
        const buyerEmail = document.getElementById("buyerEmail").value.trim();
        const buyerCountry = document.getElementById("buyerCountry").value;
        const buyerAddress = document.getElementById("buyerAddress").value.trim();

        if (!buyerName || !buyerEmail || !buyerAddress) {
            statusEl.textContent = "Please fill in all required fields.";
            return;
        }

        isSubmitting = true;
        submitBtn.disabled = true;
        submitBtn.textContent = "Submitting...";

        const generatedOrderId = `OS-${Date.now()}`;
        const productTitle = loadedProduct
            ? [loadedProduct.brand, loadedProduct.model, loadedProduct.reference ? `Ref. ${loadedProduct.reference}` : ""]
                .filter(Boolean)
                .join(" ") || `Product #${productId || "-"}`
            : `Product #${productId || "-"}`;
        const serialNumber = loadedProduct ? (loadedProduct.serial_number || loadedProduct.serial || "") : "";
        const productUrl = getProductPageUrl();

        try {
            const { error: insertError } = await supabaseClient.from("orders").insert({
                order_code: generatedOrderId,
                product_id: productId,
                product_name: productTitle,
                table_name: tableName,
                buyer_name: buyerName,
                buyer_email: buyerEmail,
                country: buyerCountry,
                address: buyerAddress,
                status: "pending"
            });

            if (insertError) {
                console.error("Orders insert error:", insertError.message);
                statusEl.textContent = "Database error: " + insertError.message;
                isSubmitting = false;
                submitBtn.disabled = false;
                submitBtn.textContent = "Confirm Order";
                return;
            }
        } catch (err) {
            console.error("Orders insert exception:", err);
            statusEl.textContent = "Network/request error while saving order.";
            isSubmitting = false;
            submitBtn.disabled = false;
            submitBtn.textContent = "Confirm Order";
            return;
        }

        const orderInfo = {
            orderId: generatedOrderId,
            email: buyerEmail,
            country: buyerCountry
        };

        document.getElementById("orderMeta").innerHTML = `
            <div><strong>Order ID:</strong> ${generatedOrderId}</div>
            <div><strong>Item:</strong> ${productTitle}</div>
            ${serialNumber ? `<div><strong>Serial No.:</strong> ${serialNumber}</div>` : ""}
            <div><strong>Product Link:</strong> <a href="${productUrl}">${productUrl}</a></div>
            <div><strong>Email:</strong> ${buyerEmail}</div>
            <div><strong>Shipping:</strong> ${buyerCountry} — ${buyerAddress}</div>
        `;

        document.getElementById("checkoutBox").style.display = "none";
        document.getElementById("successCard").style.display = "block";

        trackPurchaseEvent(orderInfo);
    });
</script>

</body>
</html>
