 function updateCategoryFields() {

    const category = document.getElementById("category").value;

    const caseBox = document.getElementById("case_size_box");
    const movementBox = document.getElementById("movement_size_box");
    const watchFields = document.getElementById("watch_fields");
    const partsBox = document.getElementById("parts_category_box");

        partsBox.style.display = "block";
