<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Sales - Ora Swiss</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }

        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            padding: 15px;
            margin: 0;
            padding-bottom: 80px;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            margin-bottom: 15px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .back-btn {
            background: #d4af37;
            color: #000;
            border: none;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 6px;
        }

        .back-btn:hover {
            background: #e6c200;
        }

        .page-title {
            margin: 0;
            font-size: 18px;
            font-weight: bold;
            color: gold;
        }

        /* Dyshe (2 kolona) në celular, 4 në kompjuter */
        #salesList {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        @media (min-width: 1024px) {
            #salesList {
                grid-template-columns: repeat(4, 1fr);
                gap: 16px;
            }
        }

        .sale-item {
            background-color: #111;
            border: 1px solid #333;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-radius: 10px;
            overflow: hidden;
        }

        .sale-item img {
            width: 100%;
            aspect-ratio: 1 / 1;
            height: auto;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            display: block;
            background: #181818;
        }

        @media (min-width: 1024px) {
            .sale-item {
                padding: 14px;
            }

            .sale-item img {
                aspect-ratio: auto;
                height: 210px;
            }
        }

        .item-info {
            margin-top: 8px;
        }

        .item-title {
            font-size: 15px;
            font-weight: bold;
            color: #fff;
            display: block;
            margin-bottom: 3px;
        }

        .item-code {
            color: #aaa;
            font-size: 12px;
            display: block;
            margin-bottom: 4px;
        }

        .item-price {
            color: gold;
            font-weight: bold;
            font-size: 14px;
            display: block;
            margin: 6px 0 10px 0;
        }

        .item-actions {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        button.action-btn {
            background-color: #1c1c1c;
            color: #fff;
            border: 1px solid #383838;
            padding: 8px 10px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 6px;
            font-size: 13px;
            width: 100%;
        }

        button.action-btn:hover {
            background-color: #282828;
            border-color: gold;
            color: gold;
        }

        button.modify-btn {
            background-color: #1a180d;
            color: gold;
            border: 1px solid #6b5916;
        }

        button.modify-btn:hover {
            background-color: #292512;
        }

        a {
            text-decoration: none;
            color: #fff;
        }

        .status-msg {
            grid-column: 1 / -1;
            color: #ccc;
            font-size: 14px;
            padding: 10px 0;
        }
    </style>
</head>
<body>

<div class="top-bar">
    <button type="button" class="back-btn" onclick="window.location.href='index.html'">← Back</button>
    <h1 class="page-title">My Sales</h1>
    <span style="width: 68px;"></span>
</div>

<div id="salesList"><div class="status-msg">Duke ngarkuar...</div></div>

<script>
    const myOraSwissClient = window.supabase.createClient(
        "https://gnwsrmelmeqduhhmfmoa.supabase.co",
        "sb_publishable__AkK_Z7lhtkvukN6Fy1cAQ_KBTXIcY9"
    );

    function resolveImageUrl(imageField) {
        let primaryImage = "";
        if (imageField) {
            if (Array.isArray(imageField) && imageField.length > 0) {
                primaryImage = imageField[0];
            } else if (typeof imageField === "string") {
                try {
                    const parsed = JSON.parse(imageField);
                    primaryImage = Array.isArray(parsed) ? parsed[0] : imageField;
                } catch (e) {
                    primaryImage = imageField;
                }
            }
        }

        if (primaryImage && primaryImage !== "null" && primaryImage !== "") {
            if (primaryImage.startsWith("http")) {
                return primaryImage;
            }
            return "https://gnwsrmelmeqduhhmfmoa.supabase.co/storage/v1/object/public/or-images/" + primaryImage;
        }

        return "https://placeholder.co/600x600/222/fff?text=No+Image";
    }

    function getItemCodeLine(item) {
        const isMovementPart = ["parts", "movement parts", "part"].includes((item.category || "").toLowerCase());
        if (isMovementPart) {
            return item.caliber ? `Cal: ${item.caliber}` : "";
        }
        return item.reference ? `Ref. ${item.reference}` : "";
    }

    async function loadMySales() {
        const salesList = document.getElementById("salesList");

        const { data: { user } } = await myOraSwissClient.auth.getUser();

        if (!user) {
            salesList.innerHTML = "<div class='status-msg'>Ju lutem logohuni.</div>";
            return;
        }

        const [
            { data: watches, error: watchesError },
            { data: bracelets, error: braceletsError }
        ] = await Promise.all([
            myOraSwissClient
                .from("oras")
                .select("*")
                .eq("user_id", user.id),

            myOraSwissClient
                .from("bracelets_straps")
                .select("*")
                .eq("user_id", user.id)
        ]);

        if (watchesError || braceletsError) {
            salesList.innerHTML = "<div class='status-msg' style='color:#f87171;'>Gabim: " + (watchesError?.message || braceletsError?.message) + "</div>";
            return;
        }

        const items = [
            ...(watches || []).map(item => ({ ...item, type: "watch" })),
            ...(bracelets || []).map(item => ({ ...item, type: "bracelet" }))
        ];

        if (items.length === 0) {
            salesList.innerHTML = "<div class='status-msg'>Nuk keni asnjë artikull në shitje.</div>";
            return;
        }

        salesList.innerHTML = items.map(item => {
            const detailUrl = `${item.type === "bracelet" ? "product-bracelets-straps.html" : "product.html"}?id=${item.id}`;
            const imgUrl = resolveImageUrl(item.image_url);
            const codeLine = getItemCodeLine(item);

            return `
                <div class="sale-item">
                    <div>
                        <a href="${detailUrl}">
                            <img src="${imgUrl}" alt="${item.brand || "Artikull"}">
                        </a>
                        <div class="item-info">
                            <a href="${detailUrl}" class="item-title">
                                ${item.brand || ""} ${item.model || ""}
                            </a>
                            ${codeLine ? `<span class="item-code">${codeLine}</span>` : ""}
                            <span class="item-price">${item.price ? item.price + " €" : "Contact for price"}</span>
                        </div>
                    </div>

                    <div class="item-actions">
                        <button type="button" class="action-btn" onclick="window.location.href='${detailUrl}'">
                            View Details
                        </button>
                        <button type="button" class="action-btn modify-btn" onclick="window.location.href='edit.html?id=${item.id}&type=${item.type}'">
                            ✏️ Modify
                        </button>
                    </div>
                </div>
            `;
        }).join("");
    }

    loadMySales();
</script>

</body>
</html>
