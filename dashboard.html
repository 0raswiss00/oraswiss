<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>myOraSwiss - Dashboard</title>
    <style>
        * { box-sizing: border-box; }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
            background: #000; 
            color: #fff; 
            padding: 15px; 
            padding-top: 15px; 
            padding-bottom: 105px; 
            margin: 0;
        }

        .search-container {
            margin-bottom: 20px;
            width: 100%;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: #111;
            border: 1px solid #333;
            border-radius: 15px;
            padding: 3px 10px;
            height: 36px;
        }

        .search-box input {
            background: transparent;
            border: none;
            color: #fff;
            outline: none;
            width: 100%;
            font-size: 15px;
            margin-left: 10px;
        }

        .search-icon {
            font-size: 18px;
        }

        .camera-icon {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
        }

        /* Rrjeta e artikujve: 2 në celular, 4 në kompjuter */
        #myWatchesList {
            display: grid !important;
            grid-template-columns: repeat(2, 1fr) !important;
            gap: 12px !important;
            padding: 0 !important;
            margin: 0 !important;
            list-style: none !important;
            width: 100% !important;
        }

        @media (min-width: 768px) {
            #myWatchesList {
                grid-template-columns: repeat(4, 1fr) !important;
                gap: 16px !important;
            }
        }

        .watch-card {
            background: #111 !important;
            border: 1px solid #333 !important;
            padding: 10px !important;
            border-radius: 12px !important;
            display: flex !important;
            flex-direction: column !important;
            justify-content: space-between !important;
            list-style: none !important;
            min-height: 100% !important;
        }

        .watch-card-link {
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .watch-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            height: auto;
            object-fit: cover;
            border-radius: 8px;
            display: block;
            background: #181818;
            margin-bottom: 8px;
        }

        @media (min-width: 1024px) {
            .watch-card {
                padding: 12px !important;
            }

            .watch-card img {
                aspect-ratio: auto;
                height: 160px;
            }
        }

        .watch-title {
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .watch-ref {
            font-size: 12px;
            color: #bbb;
            margin-bottom: 6px;
        }

        .watch-price {
            font-size: 15px;
            font-weight: bold;
            color: gold;
            margin-top: auto;
        }

        .my-oraswiss-menu {
            display: none;
            position: fixed;
            bottom: 105px;
            right: 15px;
            width: 220px;
            background: #1a1a1a;
            border-radius: 15px;
            border: 1px solid #333;
            padding: 10px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
            z-index: 1000000;
        }

        .my-oraswiss-menu.active {
            display: block;
        }

        .my-oraswiss-menu .menu-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 15px 10px; 
            border-bottom: 1px solid #222; 
            cursor: pointer; 
            color: #fff;
            text-decoration: none;
        }

        .my-oraswiss-menu .menu-item:last-child { 
            border-bottom: none; 
        }

        .bottom-nav {
            position: fixed !important;
            bottom: 20px !important;
            top: auto !important;
            left: 50% !important;
            right: auto !important;
            transform: translateX(-50%) !important;
            width: calc(100% - 20px) !important;
            max-width: 1200px !important;
            height: 65px !important;
            background-color: #1a1a1a !important;
            display: flex !important;
            justify-content: flex-start !important;
            align-items: center !important;
            padding: 0 10px !important;
            border-radius: 20px !important;
            border: 1px solid #333 !important;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5) !important;
            z-index: 999999 !important;
            overflow-x: auto !important;
            overflow-y: hidden !important;
            white-space: nowrap !important;
            opacity: 1 !important;
            transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out !important;
            scrollbar-width: none !important;
            -webkit-overflow-scrolling: touch !important;
        }

        .bottom-nav::-webkit-scrollbar {
            display: none !important;
        }

        .bottom-nav-item,
        .bottom-nav a,
        .bottom-nav button {
            color: #ffffff !important;
            text-decoration: none !important;
            font-size: 14px !important;
            text-align: center !important;
            white-space: nowrap !important;
            flex: 0 0 auto !important;
            min-width: max-content !important;
            background: none !important;
            border: none !important;
            cursor: pointer !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 2px !important;
            padding: 0 18px !important;
            height: 100% !important;
        }

        .bottom-nav a:hover,
        .bottom-nav button:hover,
        .bottom-nav-item:hover {
            color: gold !important;
        }

        .bottom-nav.nav-hidden {
            transform: translateX(-50%) translateY(120px) !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        @media (min-width: 1024px) {
            .bottom-nav {
                bottom: 20px !important;
                width: 95% !important;
                max-width: 1200px !important;
                height: 75px !important;
            }

            .bottom-nav-item,
            .bottom-nav a,
            .bottom-nav button {
                font-size: 16px !important;
                padding-left: 22px !important;
                padding-right: 22px !important;
            }

            .bottom-nav.nav-hidden {
                transform: translateX(-50%) translateY(120px) !important;
            }

            body {
                padding-bottom: 115px !important;
            }
        }
    </style>
</head>
<body style="margin: 0; padding-bottom: 90px; background-color: #000; color: #fff;">

    <div class="search-container">
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Search on OraSwiss">
            <button type="button" class="camera-icon" onclick="alert('Funksioni për foto së shpejti!')">📷</button>
        </div>
    </div>

    <!-- Seksioni i artikujve të mi -->
    <div style="margin-bottom: 20px;">
        <h2 style="font-size:16px; color: gold; margin: 0 0 12px 0;">Artikujt e mi</h2>
        <ul id="myWatchesList"></ul>
    </div>
    
    <!-- Menuja e My OraSwiss me butonin e saktë të mesazheve -->
    <div id="myOraSwissMenu" class="my-oraswiss-menu">
        <div class="menu-item" onclick="location.href='buy.html'"><span>🛒 Buy</span> <span>></span></div>
        <div class="menu-item" onclick="location.href='mysold.html'"><span>🛒 my sold</span> <span>></span></div>
        <a href="messages.html" class="menu-item" style="text-decoration: none; color: inherit;">
            <span>✉️ Messages</span>
            <span id="dashboardMessageCount" style="background: red; color: white; padding: 2px 6px; border-radius: 10px; font-size: 11px; font-weight: bold; display: none;">0</span>
        </a>
        <div class="menu-item" onclick="location.href='settings.html'"><span>⚙️ Account Settings</span> <span>></span></div>
        <div class="menu-item" onclick="location.href='support.html'"><span>🎧 Support</span> <span>></span></div>
        <div class="menu-item" onclick="location.href='support-thanks.html'">
            <span>✅ Support Thanks</span>
            <span>></span>
        </div>
        <div class="menu-item" onclick="location.href='info.html'"><span>ℹ️ Info</span> <span>></span></div>
    </div>

    <!-- Shiriti i poshtëm i navigimit -->
    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-item">OraSwiss</a>
        <a href="profile.html" class="bottom-nav-item">Profile</a>
        <a href="myoffers.html" class="bottom-nav-item">📦 Ofertat</a>
        <a href="orders.html" class="bottom-nav-item">🛒 Porositë</a>
        <a href="offers.html" class="bottom-nav-item">Offers</a>  
        <a href="favorites.html" class="bottom-nav-item">Favorites</a>
        <a href="collection.html" class="bottom-nav-item">Collection</a>
        <a href="mysales.html" class="bottom-nav-item">Sales</a>
        <a href="sellnow.html" class="bottom-nav-item">Sell</a>
        <a href="javascript:void(0)" class="bottom-nav-item" onclick="toggleMenu('myOraSwissMenu')">My OraSwiss</a>
    </nav>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabase = createClient(
        'https://gnwsrmelmeqduhhmfmoa.supabase.co',
        'sb_publishable__AkK_Z7lhtkvukN6Fy1cAQ_KBTXIcY9'
    );

    async function protectPage() {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) {
            window.location.href = "login.html";
            return false;
        }
        return true;
    }

    protectPage();

    function resolveImageUrl(imageField) {
        let primaryImg = "";
        if (imageField) {
            if (Array.isArray(imageField) && imageField.length > 0) {
                primaryImg = imageField[0];
            } else if (typeof imageField === "string") {
                try {
                    const parsed = JSON.parse(imageField);
                    primaryImg = Array.isArray(parsed) ? parsed[0] : imageField;
                } catch (e) {
                    primaryImg = imageField;
                }
            }
        }

        if (primaryImg && primaryImg !== "null" && primaryImg !== "") {
            return primaryImg.startsWith("http")
                ? primaryImg
                : "https://gnwsrmelmeqduhhmfmoa.supabase.co/storage/v1/object/public/or-images/" + primaryImg;
        }
        return "https://placeholder.co/600x400/222/fff?text=No+Image";
    }

    function getRefLabel(item) {
        const isMovementPart = ["parts", "movement parts", "part"].includes((item.category || "").toLowerCase());
        if (isMovementPart) {
            return item.caliber ? `Cal: ${item.caliber}` : (item.reference ? `Ref. ${item.reference}` : "Ref. /");
        }
        return item.reference ? `Ref. ${item.reference}` : "Ref. /";
    }

    async function ngarkoArtikujt() {
        const lista = document.getElementById("myWatchesList");
        if (!lista) return;
        lista.innerHTML = "<li style='grid-column: 1 / -1; color:#aaa;'>Po ngarkojmë artikujt...</li>";

        const { data: { user } } = await supabase.auth.getUser();
        if (!user) {
            lista.innerHTML = "<li style='grid-column: 1 / -1; color:#aaa;'>Duhet të logoheni!</li>";
            return;
        }

        const { data: watches, error: errorW } = await supabase
            .from('oras')
            .select('*')
            .eq('user_id', user.id);

        const { data: straps, error: errorS } = await supabase
            .from('bracelets_straps')
            .select('*')
            .eq('user_id', user.id);

        if (errorW || errorS) {
            lista.innerHTML = "<li style='grid-column: 1 / -1; color:#f87171;'>Gabim gjatë lidhjes me databazën.</li>";
            return;
        }

        const teGjitha = [
            ...(watches || []).map(item => ({ ...item, isStrap: false })),
            ...(straps || []).map(item => ({ ...item, isStrap: true }))
        ];

        lista.innerHTML = "";
        if (teGjitha.length === 0) {
            lista.innerHTML = "<li style='grid-column: 1 / -1; color:#aaa;'>Nuk keni asnjë artikull në shitje.</li>";
        } else {
            teGjitha.forEach(item => {
                const detailPage = item.isStrap ? 'product-bracelets-straps.html' : 'product.html';
                const imgUrl = resolveImageUrl(item.image_url);
                const refText = getRefLabel(item);
                const priceText = item.price ? `${item.price} €` : "Contact for price";

                const li = document.createElement("li");
                li.className = "watch-card";
                li.innerHTML = `
                    <a href="${detailPage}?id=${item.id}" class="watch-card-link">
                        <img src="${imgUrl}" alt="${item.brand || 'Artikull'}">
                        <div class="watch-title">${item.brand || 'Artikull'} ${item.model || ''}</div>
                        <div class="watch-ref">${refText}</div>
                        <div class="watch-price">${priceText}</div>
                    </a>
                `;
                lista.appendChild(li);
            });
        }
    }
    
    function toggleMenu(menuId) {
        const menu = document.getElementById(menuId);
        if (!menu) return; 
        menu.classList.toggle('active');
    }

    window.toggleMenu = toggleMenu;

    async function loadMessageCount() {
        try {
            const { data: { user }, error } = await supabase.auth.getUser();
            if (error || !user) return;

            const { data: userConvs, error: convError } = await supabase
                .from("conversations")
                .select("id")
                .or(`user_one.eq.${user.id},user_two.eq.${user.id},buyer_id.eq.${user.id},seller_id.eq.${user.id}`);

            if (convError || !userConvs || userConvs.length === 0) return;

            const convIds = userConvs.map(c => c.id);

            const { count: totalUnread, error: msgError } = await supabase
                .from("messages")
                .select("*", { count: "exact", head: true })
                .in("conversation_id", convIds)
                .eq("is_read", false)
                .neq("sender_id", user.id);

            if (msgError) return;

            const count = totalUnread || 0;
            const dashBadge = document.getElementById("dashboardMessageCount");
            if (dashBadge) {
                dashBadge.innerText = count;
                dashBadge.style.display = count > 0 ? "inline-block" : "none";
            }
        } catch (err) {
            console.error("Gabim tek mesazhet:", err);
        }
    }

    document.addEventListener('DOMContentLoaded', async () => {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) {
            window.location.href = "login.html";
            return;
        }

        ngarkoArtikujt();
        loadMessageCount();
    });

    const searchInput = document.getElementById('searchInput');
    if (searchInput) {
        searchInput.addEventListener('keyup', function(e) {
            const termi = e.target.value.toLowerCase();
            const lista = document.getElementById("myWatchesList");
            if (!lista) return;
            const artikujt = lista.getElementsByClassName("watch-card");
            for (let i = 0; i < artikujt.length; i++) {
                let tekst = artikujt[i].textContent.toLowerCase();
                artikujt[i].style.display = tekst.includes(termi) ? "" : "none";
            }
        });
    }
</script>
<script>
let lastScrollTop = 0;
const nav = document.querySelector('.bottom-nav');

window.addEventListener('scroll', () => {
    let scrollTop = window.pageYOffset || document.documentElement.scrollTop;

    if (scrollTop > lastScrollTop && scrollTop > 50) {
        nav.classList.add('nav-hidden');
    } else {
        nav.classList.remove('nav-hidden');
    }

    lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
});
</script>
</body>
</html>
