<!-- =========================
     KERKIMI ME FOTO
========================= -->
<script>
(function () {
    const photoInput = document.getElementById("photoSearchInput");
    const photoButton = document.getElementById("photoSearchButton");
    const photoPreview = document.getElementById("photoSearchPreview");
    const photoImage = document.getElementById("photoSearchImage");
    const photoStatus = document.getElementById("photoSearchStatus");
    const cancelPhoto = document.getElementById("cancelPhotoSearch");

    if (!photoInput || !photoButton || !photoPreview ||
        !photoImage || !photoStatus || !cancelPhoto) {
        return;
    }

    let currentImageUrl = null;

    function clearPhoto() {
        photoInput.value = "";
        photoImage.removeAttribute("src");
        photoPreview.style.display = "none";
        photoStatus.textContent = "";

        if (currentImageUrl) {
            URL.revokeObjectURL(currentImageUrl);
            currentImageUrl = null;
        }
    }

    photoButton.addEventListener("click", function () {
        photoInput.click();
    });

    photoInput.addEventListener("change", function () {
        const file = photoInput.files && photoInput.files[0];

        if (!file) return;

        if (!file.type.startsWith("image/")) {
            alert("Zgjidh një fotografi të vlefshme.");
            photoInput.value = "";
            return;
        }

        if (file.size > 10 * 1024 * 1024) {
            alert("Fotografia duhet të jetë maksimumi 10 MB.");
            photoInput.value = "";
            return;
        }

        if (currentImageUrl) {
            URL.revokeObjectURL(currentImageUrl);
        }

        currentImageUrl = URL.createObjectURL(file);
        photoImage.src = currentImageUrl;
        photoPreview.style.display = "block";

        photoStatus.textContent =
            "Fotoja u zgjodh me sukses. Pamja paraprake është aktive; kërkimi automatik vizual nuk është lidhur me një shërbim AI.";
    });

    cancelPhoto.addEventListener("click", clearPhoto);
})();
</script>

<!-- =========================
     NGARKIMI I OREVE VINTAGE
========================= -->
<script>
let allOrasData = [];

const ORASWISS_SUPABASE_URL =
    "https://gnwsrmelmeqduhhmfmoa.supabase.co";

function getVintageImageUrl(imageValue) {
    let imagePath = "";

    if (Array.isArray(imageValue)) {
        imagePath = imageValue[0] || "";
    } else if (typeof imageValue === "string") {
        const value = imageValue.trim();

        if (!value || value === "null") {
            return "https://placehold.co/600x400/222/fff?text=No+Image";
        }

        try {
            const parsed = JSON.parse(value);
            imagePath = Array.isArray(parsed)
                ? (parsed[0] || "")
                : value;
        } catch (error) {
            imagePath = value;
        }
    }

    if (!imagePath || imagePath === "null") {
        return "https://placehold.co/600x400/222/fff?text=No+Image";
    }

    if (/^https?:\/\//i.test(imagePath)) {
        return imagePath;
    }

    if (imagePath.startsWith("//")) {
        return "https:" + imagePath;
    }

    imagePath = imagePath.replace(/^\/+/, "");

    // Nëse fusha ruan tashmë rrugën e plotë të bucket-it
    if (imagePath.startsWith("storage/v1/object/public/")) {
        return ORASWISS_SUPABASE_URL + "/" + imagePath;
    }

    // Nëse ruhet vetëm emri ose rruga e fotos në bucket
    return ORASWISS_SUPABASE_URL +
        "/storage/v1/object/public/or-images/" +
        imagePath.split("/").map(encodeURIComponent).join("/");
}

function escapeVintageHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, function (char) {
        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[char];
    });
}

async function loadOras() {
    const container = document.getElementById("oras-container");

    if (!container) {
        console.error("Mungon elementi #oras-container në HTML.");
        return;
    }

    if (!window.supabaseClient) {
        container.innerHTML =
            "<p style='color:#f66;padding:10px;'>Gabim në lidhjen me databazën. Kontrollo db-connect.js.</p>";
        console.error("window.supabaseClient nuk është inicializuar.");
        return;
    }

    container.innerHTML =
        "<p style='color:#aaa;padding:10px;'>Duke ngarkuar orët Vintage...</p>";

    try {
        const { data, error } = await window.supabaseClient
            .from("oras")
            .select("*")
            .eq("category", "vintage")
            .order("created_at", { ascending: false });

        if (error) {
            console.error("Gabim Supabase:", error);
            container.innerHTML =
                "<p style='color:#f66;padding:10px;'>Gabim gjatë ngarkimit: " +
                escapeVintageHtml(error.message) +
                "</p>";
            return;
        }

        allOrasData = Array.isArray(data) ? data : [];
        renderCards(allOrasData);

    } catch (error) {
        console.error("Gabim gjatë ngarkimit të Vintage:", error);
        container.innerHTML =
            "<p style='color:#f66;padding:10px;'>Ndodhi një gabim gjatë ngarkimit të produkteve.</p>";
    }
}

function renderCards(items) {
    const container = document.getElementById("oras-container");

    if (!container) return;

    if (!items || items.length === 0) {
        container.innerHTML =
            "<p style='color:#aaa;padding:10px;grid-column:1/-1;'>Nuk u gjet asnjë orë që përputhet me kërkimin.</p>";
        return;
    }

    container.innerHTML = items.map(function (ora) {
        const brand = escapeVintageHtml(ora.brand || "Vintage Watch");
        const model = escapeVintageHtml(ora.model || "");
        const price = ora.price !== null &&
                      ora.price !== undefined &&
                      ora.price !== ""
            ? escapeVintageHtml(ora.price) + " €"
            : "Contact";

        const imgUrl = getVintageImageUrl(ora.image_url);
        const productUrl = "product.html?id=" +
            encodeURIComponent(String(ora.id));

        return `
            <div class="card" data-product-url="${productUrl}">
                <div>
                    <img
                        src="${escapeVintageHtml(imgUrl)}"
                        alt="${brand}"
                        loading="lazy"
                        onerror="this.onerror=null;this.src='https://placehold.co/600x400/222/fff?text=No+Image';"
                    >
                    <h3 style="margin:8px 0 4px;font-size:16px;">${brand}</h3>
                    <div style="font-size:14px;color:#aaa;margin-bottom:6px;">
                        ${model}
                    </div>
                    <div class="price">${price}</div>
                </div>
                <div>
                    <button
                        type="button"
                        class="btn-main btn-secondary"
                        style="width:100%;padding:10px;font-size:14px;"
                        data-product-url="${productUrl}"
                    >View Details</button>
                </div>
            </div>
        `;
    }).join("");

    container.querySelectorAll("[data-product-url]").forEach(function (element) {
        element.addEventListener("click", function (event) {
            event.stopPropagation();
            window.location.href = element.getAttribute("data-product-url");
        });
    });
}

/* KERKIMI LIVE: përdor ID-në e saktë searchInput */
const vintageSearchInput = document.getElementById("searchInput");

if (vintageSearchInput) {
    vintageSearchInput.addEventListener("input", function (event) {
        const query = event.target.value.toLowerCase().trim();

        if (!query) {
            renderCards(allOrasData);
            return;
        }

        const filtered = allOrasData.filter(function (ora) {
            const searchableText = [
                ora.brand,
                ora.model,
                ora.description,
                ora.reference,
                ora.material,
                ora.year
            ].filter(Boolean).join(" ").toLowerCase();

            return searchableText.includes(query);
        });

        renderCards(filtered);
    });
}

if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", loadOras);
} else {
    loadOras();
}

/* MENUJA */
function checkMenu(event) {
    if (event) event.stopPropagation();

    if (typeof window.toggleMenu === "function") {
        window.toggleMenu();
    } else {
        alert("Funksioni i menusë nuk është ngarkuar. Kontrollo skedarin menu.js.");
    }
}
</script>

<script>
(function () {
    const nav = document.querySelector(".bottom-nav");

    if (!nav) return;

    let lastScrollTop = window.pageYOffset ||
        document.documentElement.scrollTop;

    window.addEventListener("scroll", function () {
        const scrollTop = window.pageYOffset ||
            document.documentElement.scrollTop;

        if (scrollTop > lastScrollTop && scrollTop > 50) {
            nav.classList.add("nav-hidden");
        } else {
            nav.classList.remove("nav-hidden");
        }

        lastScrollTop = Math.max(0, scrollTop);
    }, { passive: true });
})();
</script>
