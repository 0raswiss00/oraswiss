<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profile - Ora Swiss</title>

  <style>
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#000;color:#fff}
    .wrap{max-width:520px;margin:30px auto;padding:0 16px}
    button{padding:10px 14px;border-radius:10px;border:1px solid #777;background:#111;color:#fff;cursor:pointer}
    .private-field { display: none; } /* Për të fshehur të dhënat private kur shikohet si blerës */
  </style>
</head>

<body style="visibility:hidden;">
  <div class="wrap">
    <h2>Profili</h2>

    <h1 id="sellerTitle">-</h1>
    <p id="sellerJoined">-</p>
    <p id="sellerBadge"></p>

    <h3>Feedback-u i blerësve:</h3>
    <ul id="feedbackList"><li>Nuk ka ende feedback.</li></ul>

    <!-- Të dhënat private që do të duken vetëm për pronarin e profilit -->
    <div id="ownerSection" class="private-field">
      <p>Email: <b id="userEmail"></b></p>
      <p>Emri: <b id="userName">-</b></p>
      <p>Telefon: <b id="userPhone">-</b></p>
      <p>Rruga: <b id="userStreet">-</b></p>
      <p>Nr. Shtëpisë: <b id="userHouseNumber">-</b></p>
      <p>Kodi Postar: <b id="userZip">-</b></p>
      <p>Te regjistruar gjithsej: <b id="userCount">0</b></p>
    </div>

    <!-- Të dhënat që i duhen edhe blerësit (Shteti) -->
    <p>Shteti: <b id="userCountry">-</b></p>

    <!-- Seksioni i verifikimit (vetëm për pronarin) -->
    <div id="verificationSection" class="private-field">
      <h3>🔒 Verifikimi i identitetit</h3>
      <select id="documentType">
        <option value="">Zgjidh dokumentin</option>
        <option value="ID">Kartë ID</option>
        <option value="Passport">Pasaportë</option>
      </select>
      <p><input id="documentNumber" placeholder="Numri i dokumentit"></p>
      <p><label>Foto përpara:</label><br><input id="photoFront" type="file" accept="image/*"></p>
      <p><label>Foto mbrapa:</label><br><input id="photoBack" type="file" accept="image/*"></p>
      <button id="btnVerify" type="button">Dërgo për verifikim</button>
      <p id="verifyMsg"></p>
      <button id="btnLogout" type="button">Logout</button>
    </div>

    <p id="msg" style="margin-top:12px;"></p>

    <h3>Artikujt e shitësit:</h3>
    <div class="watch-scroll">
      <ul id="sellerWatches"></ul>
    </div>
  </div>
  
<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm";

  const supabaseUrl = 'https://gnwsrmelmeqduhhmfmoa.supabase.co';
  const supabaseKey = 'sb_publishable__AkK_Z7lhtkvukN6Fy1cAQ_KBTXIcY9';
  const supabase = createClient(supabaseUrl, supabaseKey);

  // ELEMENTET
  const emailEl = document.getElementById("userEmail");
  const nameEl = document.getElementById("userName");
  const phoneEl = document.getElementById("userPhone");
  const countryEl = document.getElementById("userCountry");
  const streetEl = document.getElementById("userStreet");
  const houseEl = document.getElementById("userHouseNumber");
  const zipEl = document.getElementById("userZip");
  const logoutBtn = document.getElementById("btnLogout");
  const watchList = document.getElementById("sellerWatches");

  async function loadWatches(uid) {
    watchList.innerHTML = "";
    const tables = [
      { table: "oras", label: "⌚" },
      { table: "bracelets_straps", label: "🪢" }
    ];

    for (const item of tables) {
      const { data, error } = await supabase
        .from(item.table)
        .select("*")
        .eq('user_id', uid);

      if (error) continue;

      data?.forEach(product => {
        const li = document.createElement("li");
        li.innerHTML = `<b>${product.brand || ""}</b> ${product.model || ""} - ${product.price || "-"}€`;
        watchList.appendChild(li);
      });
    }
  }

  window.addEventListener("DOMContentLoaded", async () => {
    // Kontrollojmë nëse ka përdorues të loguar (mund të jetë vizitor ose vetë shitësi)
    const { data: { user } } = await supabase.auth.getUser();

    const params = new URLSearchParams(window.location.search);
    const sellerIdFromUrl = params.get("id");

    // Përcaktojmë se profilin e kujt po shikojmë
    const profileId = sellerIdFromUrl || (user ? user.id : null);

    if (!profileId) {
      window.location.href = "index.html";
      return;
    }

    // Puna e databazës për të marrë profilin e shitësit
    const { data: sellerData, error: sellerError } = await supabase
      .from("profiles")
      .select("*")
      .eq("id", profileId)
      .single();

    if (sellerError || !sellerData) {
      document.body.style.visibility = "visible";
      document.getElementById("sellerTitle").textContent = "Përdoruesi nuk u gjet";
      return;
    }

    document.body.style.visibility = "visible";

    const sellerTitle = document.getElementById("sellerTitle");
    
    // Krijimi i emrit në formatin: "emri_i_personalizuar.oraswiss" (ose nga kolona custom_username nëse e keni krijuar, ose full_name)
    const usernameBase = sellerData.custom_username || sellerData.full_name || "seller";
    sellerTitle.textContent = `${usernameBase}.oraswiss`;

    const created = new Date(sellerData.created_at || Date.now());
    const joinedText = document.createElement("p");
    joinedText.textContent = "Joined " + created.toLocaleDateString("en-US", { month: "long", year: "numeric" });
    sellerTitle.insertAdjacentElement("afterend", joinedText);

    const countries = {
      "Albania": "🇦🇱 AL",
      "Switzerland": "🇨🇭 CH",
      "Italy": "🇮🇹 IT",
      "Germany": "🇩🇪 DE"
    };
    countryEl.textContent = countries[sellerData.country] || sellerData.country || "-";

    // Kontrollojmë nëse shikuesi është pronari i profilit
    const isOwner = user && user.id === profileId;

    if (isOwner) {
      // Shfaq të dhënat private dhe opsionin e verifikimit vetëm nëse është vetë profili yt
      document.querySelectorAll(".private-field").forEach(el => el.style.display = "block");

      emailEl.textContent = user.email;
      nameEl.textContent = sellerData.full_name || "-";
      phoneEl.textContent = sellerData.phone || "-";
      streetEl.textContent = sellerData.street || "-";
      houseEl.textContent = sellerData.house_number || "-";
      zipEl.textContent = sellerData.zip_code || "-";
    }

    await loadWatches(profileId);
  });

  // VERIFIKIMI I IDENTITETIT (Nëse ekziston butoni)
  const verifyBtn = document.getElementById("btnVerify");
  if (verifyBtn) {
    verifyBtn.addEventListener("click", async () => {
      const { data: { user } } = await supabase.auth.getUser();
      const documentType = document.getElementById("documentType").value;
      const documentNumber = document.getElementById("documentNumber").value;
      const frontFile = document.getElementById("photoFront").files[0];
      const backFile = document.getElementById("photoBack").files[0];
      const msg = document.getElementById("verifyMsg");

      if (!documentType || !documentNumber || !frontFile || !backFile) {
        msg.textContent = "Plotëso të gjitha fushat dhe ngarko të dy fotot.";
        return;
      }

      const frontPath = `${user.id}/front_${Date.now()}_${frontFile.name}`;
      const backPath = `${user.id}/back_${Date.now()}_${backFile.name}`;

      const frontUpload = await supabase.storage.from("identity_documents").upload(frontPath, frontFile);
      const backUpload = await supabase.storage.from("identity_documents").upload(backPath, backFile);

      if (frontUpload.error || backUpload.error) {
        msg.textContent = "Gabim gjatë ngarkimit të fotove.";
        return;
      }

      const { error } = await supabase
        .from("identity_verifications")
        .insert({
          user_id: user.id,
          document_type: documentType,
          document_number: documentNumber,
          photo_front: frontUpload.data.path,
          photo_back: backUpload.data.path,
          verification_status: "pending"
        });

      if (error) {
        msg.textContent = "Gabim gjatë dërgimit.";
        return;
      }

      msg.textContent = "Kërkesa u dërgua për verifikim.";
    });
  }

  // LOGOUT
  if (logoutBtn) {
    logoutBtn.addEventListener("click", async () => {
      await supabase.auth.signOut();
      window.location.href = "index.html";
    });
  }
</script>
</body>
</html>
