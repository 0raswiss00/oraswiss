    <style>
        body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #000; color: #fff; padding-bottom: 110px; }
        
        .site-header { position: sticky; top: 0; z-index: 9999; background: #111; border-bottom: 1px solid #333; }
        .nav-scroll { display: flex; gap: 18px; align-items: center; overflow-x: auto; padding: 14px 16px; }
        .nav-scroll a { color: #fff; text-decoration: none; padding: 6px 10px; font-weight: bold; white-space: nowrap; }
        .nav-scroll a:hover { color: gold; }
        .site-title { font-weight: 700; line-height: 1.05; margin-right: 10px; }

        .container-content { padding: 15px; max-width: 800px; margin: 0 auto; }

        /* Galeria e Fotove */
        .gallery-container { position: relative; width: 100%; height: 350px; background: #111; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 1px solid #333; margin-bottom: 15px; }
        .gallery-container img { width: 100%; height: 100%; object-fit: contain; }
        .gallery-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.6); color: white; border: 1px solid #444; font-size: 20px; padding: 10px; cursor: pointer; border-radius: 50%; z-index: 10; }
        .gallery-btn.prev { left: 10px; }
        .gallery-btn.next { right: 10px; }
        .photo-counter { position: absolute; bottom: 10px; background: rgba(0,0,0,0.7); padding: 4px 10px; border-radius: 10px; font-size: 12px; }

        .specs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            border: 1px solid #333;
            font-size: 14px;
        }
        .specs-grid div { color: #aaa; }
        .specs-grid span { color: #fff; font-weight: bold; }

        .btn-main {
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            text-align: center;
            display: block;
            text-decoration: none;
            margin-top: 10px;
        }
        .btn-buy { background: gold; color: #000; width: 100%; }
        .btn-buy:hover { background: #e6c200; }
        .btn-action { background: #222; color: #fff; border: 1px solid #444; }
        .btn-action:hover { background: #333; }

        .seller-box {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .bottom-nav {
            position: fixed !important;
            bottom: 20px !important;
            left: 15px !important;
            right: 15px !important;
            width: auto !important;
            height: 65px !important;
            background-color: #1a1a1a !important;
            display: flex !important;
            justify-content: space-around !important;
            align-items: center !important;
            padding: 0 5px !important;
            border-radius: 20px !important;
            border: 1px solid #333 !important;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5) !important;
            z-index: 999999 !important;
        }
        .bottom-nav a, .bottom-nav button {
            color: #ffffff !important;
            text-decoration: none !important;
            font-size: 10px !important;
            text-align: center !important;
            white-space: nowrap !important;
            flex: 1 !important;
            background: none !important;
            border: none !important;
            cursor: pointer !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            gap: 3px !important;
        }
        .bottom-nav a:hover { color: gold !important; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.js"></script>
    <script src="db-connect.js"></script>
</head>
<body>

<header class="site-header">
    <nav class="nav-scroll">
        <span class="site-title">ORA<br>SWISS</span>
        <a href="index.html">Home</a>
        <a href="luxury.html">Luxury</a>
        <a href="vintage.html" style="color: gold;">Vintage</a>
        <a href="parts.html">Parts</a>
        <a href="product-bracelets-straps.html">Bracelet/Strap</a>
        <a href="service.html">Service</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<div class="container-content" id="product-container">
    Duke ngarkuar detajet e produktit...
</div>

<script>
    let currentImages = [];
    let currentImgIndex = 0;

    document.addEventListener("DOMContentLoaded", async function() {
        if (!window.supabaseClient) {
            document.getElementById("product-container").innerHTML = "<h3 style='color:red; text-align:center;'>Gabim në lidhjen me databazën.</h3>";
            return;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const itemId = urlParams.get('id');
        const container = document.getElementById("product-container");

        if (!itemId) {
            container.innerHTML = "<h3 style='color:red; text-align:center;'>Nuk u përcaktua ID e produktit!</h3>";
            return;
        }

        const { data, error } = await window.supabaseClient
            .from('oras')
            .select('*')
            .eq('id', itemId)
            .single();

        if (error || !data) {
            container.innerHTML = "<h3 style='color:red; text-align:center;'>Artikulli nuk u gjet!</h3>";
            return;
        }

        // Përpunimi i imazheve
        let rawImages = data.image_url;
        if (typeof rawImages === 'string') {
            try { rawImages = JSON.parse(rawImages); } catch(e) { rawImages = [rawImages]; }
        }

        currentImages = Array.isArray(rawImages) ? rawImages.filter(img => img && img !== 'null' && img !== '') : [];
        if (currentImages.length === 0) {
            currentImages = ["https://placeholder.co/600x400/222/fff?text=No+Image"];
        } else {
            const SUPABASE_URL = "https://gnwsrmelmeqduhhmfmoa.supabase.co";
            currentImages = currentImages.map(img => 
                img.startsWith('http') ? img : SUPABASE_URL + "/storage/v1/object/public/or-images/" + img
            );
        }

        container.innerHTML = `
            <div class="gallery-container">
                <button class="gallery-btn prev" onclick="changeImage(-1)">❮</button>
                <img id="main-product-img" src="${currentImages[0]}" alt="${data.brand || 'Watch'}">
                <button class="gallery-btn next" onclick="changeImage(1)">❯</button>
                <div class="photo-counter" id="photo-counter-text">1 / ${currentImages.length}</div>
            </div>

            <h2>${data.brand || 'Ernest Borel'} ${data.model || 'Incastar'}</h2>
            <div style="font-weight:bold; color:gold; font-size: 24px; margin: 10px 0;">
                ${data.price ? data.price + ' €' : '280 €'}
            </div>

            <div class="specs-grid">
                <div>Reference: <span>${data.reference || '51380'}</span></div>
                <div>Serial Number: <span>${data.serial_number || '366XXX'}</span></div>
                <div>Movement: <span>${data.movement || 'Manual'}</span></div>
                <div>Caliber: <span>${data.caliber || 'Ernest Borel'}</span></div>
                <div>Frequency: <span>${data.frequency || '-'}</span></div>
                <div>Material: <span>${data.material || 'Gold Filled'}</span></div>
                <div>Case Size: <span>${data.case_size || '33'}</span></div>
                <div>Movement Size: <span>${data.movement_size || '-'}</span></div>
                <div>Year: <span>${data.year || '1960'}</span></div>
                <div>Function: <span>${data.function || 'Only time'}</span></div>
                <div>Service: <span>${data.service || 'Yes (Serviced)'}</span></div>
                <div>Service Date: <span>${data.service_date || '2025-08-15'}</span></div>
                <div>Origin: <span>${data.origin || 'Switzerland'}</span></div>
                <div>Work Status: <span>${data.work_status || 'Working'}</span></div>
                <div>Bracelet: <span>${data.bracelet || 'No Bracelet Leather'}</span></div>
                <div>Glass: <span>${data.glass || 'Acrylic / Hesalite'}</span></div>
                <div>Warranty: <span>${data.warranty || 'No Warranty'}</span></div>
                <div>Warranty Months: <span>${data.warranty_months || '12'}</span></div>
                <div>Box & Papers: <span>${data.box_papers || 'Watch Only'}</span></div>
            </div>

            <div style="background: #1a1a1a; padding: 15px; border-radius: 8px; border: 1px solid #333; margin-top: 15px;">
                <h4 style="margin: 0 0 8px 0; color: #fff;">Description</h4>
                <p style="color: #ccc; line-height: 1.5; margin: 0; white-space: pre-line;">${data.description || 'Ernest Borel Incastar vintage watch in excellent condition.'}</p>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn-main btn-action" style="flex:1;" onclick="window.open('https://wa.me/?text=' + encodeURIComponent('Përshëndetje, jam i interesuar për Ernest Borel Incastar'), '_blank')">💬 WhatsApp</button>
                <button class="btn-main btn-action" style="flex:1;" onclick="window.location.href='messages.html?product_id=${itemId}'">💰 Suggest Price</button>
            </div>

            <!-- Butoni Funksional i PayPal (Buy Now) i lidhur me Supabase Edge Function -->
            <button id="buy-product-btn" class="btn-main btn-buy">🛒 BUY NOW (PayPal)</button>

            <div class="seller-box">
                <div style="font-weight: bold; color: #fff;">Seller - oraswiss (Pro)</div>
                <div style="color: #25D366; font-size: 13px;">100% Positive Feedback</div>
                <div style="color: #aaa; font-size: 13px;">Anëtar që nga July 2026</div>
                <div style="display: flex; gap: 10px; margin-top: 5px;">
                    <a href="mysales.html" style="color: gold; text-decoration: none; font-size: 13px;">Seller's other items (33)</a>
                    <a href="contact.html" style="color: gold; text-decoration: none; font-size: 13px;">Contact seller</a>
                </div>
            </div>
        `;

        // Lidhja funksionale e PayPal API
        const buyBtn = document.getElementById("buy-product-btn");
        if (buyBtn) {
            buyBtn.onclick = async function(e) {
                e.preventDefault();
                buyBtn.innerText = "Loading PayPal...";
                try {
                    const response = await fetch(
                        "https://gnwsrmelmeqduhhmfmoa.supabase.co/functions/v1/create-paypal-order",
                        {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                product_id: itemId,
                                price: data.price || 280,
                                product_name: (data.brand || 'Ernest Borel') + ' ' + (data.model || 'Incastar')
                            })
                        }
                    );
                    const result = await response.json();
                    if (result.paypal_link) {
                        window.location.href = result.paypal_link;
                    } else {
                        alert("PayPal link nuk u krijua");
                        buyBtn.innerText = "🛒 BUY NOW (PayPal)";
                    }
                } catch(error) {
                    console.error(error);
                    alert("Gabim me PayPal");
                    buyBtn.innerText = "🛒 BUY NOW (PayPal)";
                }
            };
        }
    });

    function changeImage(direction) {
        if (currentImages.length <= 1) return;
        currentImgIndex += direction;
        if (currentImgIndex >= currentImages.length) currentImgIndex = 0;
        if (currentImgIndex < 0) currentImgIndex = currentImages.length - 1;
        
        document.getElementById("main-product-img").src = currentImages[currentImgIndex];
        document.getElementById("photo-counter-text").innerText = (currentImgIndex + 1) + " / " + currentImages.length;
    }
</script>

    <a href="index.html">Home</a>
    <a href="favorites.html">Favs</a>
    <a href="messages.html">Messages</a>
    <a href="mysales.html">Sales</a>
    <a href="sellnow.html">Sell</a>
    <button type="button" onclick="checkMenu(event)">Menu</button>
</nav>

</body>
</html>
