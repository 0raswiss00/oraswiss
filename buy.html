<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Porositë e mia - Ora Swiss</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; padding: 20px; background: #0a0a0a; color: #fff; margin: 0; }
        .table-wrap { width: 100%; overflow-x: auto; margin-top: 20px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; background: #141414; border-radius: 8px; overflow: hidden; min-width: 560px; }
        th, td { padding: 12px; border: 1px solid #262626; text-align: left; }
        th { background-color: #1f1f1f; color: #d4af37; }
        button { padding: 8px 12px; background: #d4af37; color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-right: 4px; margin-bottom: 4px; }
        button:hover { background: #b3922f; }
        .btn-feedback { background: #25D366; color: #fff; }
        .btn-feedback:hover { background: #1ebd56; }
        .btn-return { background: #ef4444; color: #fff; }
        .btn-return:hover { background: #dc2626; }
        .modal-backdrop {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            z-index: 9999; justify-content: center; align-items: center; padding: 15px;
        }
        .modal-backdrop.open { display: flex; }
        .modal-box {
            background: #111; border: 1px solid #333; padding: 24px; border-radius: 14px;
            width: 100%; max-width: 430px; color: #fff;
        }
        .modal-box h3 { margin-top: 0; color: #d4af37; }
        .modal-box label { display: block; font-size: 0.85rem; color: #bbb; margin-bottom: 4px; }
        .modal-box input, .modal-box select, .modal-box textarea {
            width: 100%; padding: 10px; margin-bottom: 12px; background: #222;
            color: #fff; border: 1px solid #444; border-radius: 8px; font-family: inherit;
        }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
    </style>
</head>
<body>
    <h1>Porositë e mia</h1>
    <div class="table-wrap">
        <table id="orders-table">
            <thead>
                <tr>
                    <th>Ora / Produkti</th>
                    <th>Statusi</th>
                    <th>Nr. Dërgimi</th>
                    <th>Veprime</th>
                </tr>
            </thead>
            <tbody id="orders-body">
                <tr><td colspan="4" style="text-align:center;">Duke u ngarkuar...</td></tr>
            </tbody>
        </table>
    </div>

    <div id="myOraSwissMenu" style="margin-top:20px;">
        ✉️ Messages <span id="messageCount">0</span>
    </div>

    <!-- Modal për Kërkesën e Kthimit -->
    <div id="return-modal" class="modal-backdrop">
        <div class="modal-box">
            <h3>Kërko Kthim / Rimbursim</h3>
            <input type="hidden" id="ret-order-id">

            <label for="ret-reason">Arsyeja e kthimit:</label>
            <select id="ret-reason">
                <option value="defective">Me defekt</option>
                <option value="changed_mind">Nuk e do / Ktheu mendje</option>
                <option value="not_as_described">Nuk përputhet me përshkrimin</option>
                <option value="wrong_item">Artikull i gabuar</option>
                <option value="other">Arsye tjetër</option>
            </select>

            <label for="ret-desc">Përshkrimi i arsyes së kthimit:</label>
            <textarea id="ret-desc" rows="3" placeholder="Përshkruaj shkurtimisht defektin ose arsyen e kthimit..."></textarea>

            <label for="ret-tracking">Nr. i dërgimit të kthimit (Tracking):</label>
            <input type="text" id="ret-tracking" placeholder="Vendos nr. e gjurmimit të pakos së kthyer...">

            <div class="modal-actions">
                <button type="button" onclick="closeReturnModal()" style="background:#333; color:#fff;">Anulo</button>
                <button type="button" onclick="submitReturnRequest()" class="btn-return">Dërgo Kërkesën</button>
            </div>
            <p id="retMsg" style="font-size:0.85rem; margin-top:10px; text-align:center;"></p>
        </div>
    </div>

    <!-- Modal për dërgimin e Feedback-ut -->
    <div id="feedback-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9999; justify-content:center; align-items:center; padding:15px;">
        <div style="background:#111; border:1px solid #333; padding:30px; border-radius:16px; width:100%; max-width:400px; color:#fff; position:relative;">
            <h3 style="margin-top:0; color:#d4af37;">Lër një vlerësim</h3>

            <input type="hidden" id="fb-seller-id">
            <input type="hidden" id="fb-order-id">

            <label style="font-size:0.85rem; color:#a3a3a3;">Tipi i vlerësimit:</label>
            <select id="fb-type" style="width:100%; padding:10px; margin:5px 0 15px 0; background:#222; color:#fff; border:1px solid #444; border-radius:8px;">
                <option value="positive">Pozitiv 🟢</option>
                <option value="neutral">Neutral 🟡</option>
                <option value="negative">Negativ 🔴</option>
            </select>

            <label style="font-size:0.85rem; color:#a3a3a3;">Komenti yt:</label>
            <textarea id="fb-comment" placeholder="Shkruaj komentin tënd për këtë blerje..." style="width:100%; height:80px; padding:10px; margin-bottom:15px; background:#222; color:#fff; border:1px solid #444; border-radius:8px; resize:none;"></textarea>

            <button type="button" onclick="submitOrderFeedback()" style="width:100%; padding:12px; background:#25D366; color:#fff; border:none; border-radius:8px; font-weight:bold; cursor:pointer; margin-right:0;">Dërgo Vlerësimin</button>
            <button type="button" onclick="document.getElementById('feedback-modal').style.display='none'" style="width:100%; padding:8px; background:transparent; color:#aaa; border:none; margin-top:8px; cursor:pointer; margin-right:0;">Anulo</button>
            <p id="fbMsg" style="text-align:center; font-size:0.85rem; margin-top:10px;"></p>
        </div>
    </div>

<script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm";

    const supabase = createClient(
        "https://gnwsrmelmeqduhhmfmoa.supabase.co",
        "sb_publishable__AkK_Z7lhtkvukN6Fy1cAQ_KBTXIcY9"
    );

    window.supabaseClient = supabase;
    let ordersCache = [];

    function escapeHtml(val) {
        if (val === null || val === undefined) return "";
        return String(val)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
    }

    async function loadOrders() {
        const ordersBody = document.getElementById("orders-body");
        if (!ordersBody) return;

        const { data: { user }, error: authError } = await supabase.auth.getUser();
        if (authError || !user) {
            window.location.href = "login.html";
            return;
        }

        const { data, error } = await supabase
            .from("orders")
            .select("*")
            .eq("buyer_id", user.id);

        if (error) {
            console.error("Gabim gjatë marrjes së porosive:", error);
            ordersBody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#ef4444;">Gabim në ngarkimin e porosive.</td></tr>`;
            return;
        }

        ordersCache = data || [];

        if (ordersCache.length === 0) {
            ordersBody.innerHTML = `<tr><td colspan="4" style="text-align:center;">Nuk keni asnjë porosi aktive.</td></tr>`;
            return;
        }

        ordersBody.innerHTML = ordersCache.map((order, idx) => {
            const st = String(order.status || "").toLowerCase();
            const isCompleted = ["completed", "sold", "delivered"].includes(st);
            const canReturn = ["completed", "sold", "delivered", "shipped"].includes(st);
            const prodLabel = order.order_code
                ? `${escapeHtml(order.order_code)} (#${escapeHtml(order.product_id)})`
                : `Prod ID: #${escapeHtml(order.product_id)}`;
            const tracking = order.tracking_number || order.tracing_number || "N/A";

            return `
                <tr>
                    <td>${prodLabel}</td>
                    <td>${escapeHtml(order.status || "pending")}</td>
                    <td>${escapeHtml(tracking)}</td>
                    <td>
                        <button type="button" onclick="showOrderDetails(${idx})">Detaje</button>
                        ${canReturn ? `<button type="button" class="btn-return" onclick="openReturnByIndex(${idx})">Kërko Kthim</button>` : ""}
                        ${isCompleted ? `<button type="button" class="btn-feedback" onclick="openFeedbackByIndex(${idx})">Lër Vlerësim</button>` : ""}
                    </td>
                </tr>
            `;
        }).join("");
    }

    window.showOrderDetails = function(idx) {
        const order = ordersCache[idx];
        if (!order) return;
        const lines = [
            `Porosia: ${order.order_code || "#" + order.id}`,
            `Produkti ID: ${order.product_id || "-"}`,
            `Statusi: ${order.status || "-"}`,
            `Nr. Dërgimi: ${order.tracking_number || order.tracing_number || "N/A"}`,
            order.address ? `Adresa: ${order.address}` : "",
            order.return_reason ? `Arsyeja e kthimit: ${order.return_reason}` : "",
            order.return_tracking_number ? `Nr. kthimit: ${order.return_tracking_number}` : "",
            order.refund_type ? `Rimbursimi: ${order.refund_type}${order.refund_amount ? " (" + order.refund_amount + ")" : ""}` : ""
        ].filter(Boolean);
        alert(lines.join("\n"));
    };

    window.openReturnByIndex = function(idx) {
        const order = ordersCache[idx];
        if (!order) return;
        document.getElementById("ret-order-id").value = order.id;
        document.getElementById("ret-reason").value = order.return_reason || "defective";
        document.getElementById("ret-desc").value = order.return_description || "";
        document.getElementById("ret-tracking").value = order.return_tracking_number || "";
        document.getElementById("retMsg").textContent = "";
        document.getElementById("return-modal").classList.add("open");
    };

    window.closeReturnModal = function() {
        document.getElementById("return-modal").classList.remove("open");
    };

    window.submitReturnRequest = async function() {
        const orderId = document.getElementById("ret-order-id").value;
        const reason = document.getElementById("ret-reason").value;
        const desc = document.getElementById("ret-desc").value.trim();
        const retTracking = document.getElementById("ret-tracking").value.trim();
        const msg = document.getElementById("retMsg");

        if (!desc) {
            msg.style.color = "#ef4444";
            msg.textContent = "Shkruaj një përshkrim të shkurtër për kthimin.";
            return;
        }

        msg.style.color = "#fff";
        msg.textContent = "Duke dërguar kërkesën...";

        const { error } = await supabase
            .from("orders")
            .update({
                status: "return_requested",
                return_reason: reason,
                return_description: desc,
                return_tracking_number: retTracking || null
            })
            .eq("id", orderId);

        if (error) {
            msg.style.color = "#ef4444";
            msg.textContent = "Gabim: " + error.message;
            return;
        }

        msg.style.color = "#22c55e";
        msg.textContent = "Kërkesa për kthim u regjistrua!";
        setTimeout(() => {
            closeReturnModal();
            loadOrders();
        }, 1000);
    };

    window.openFeedbackByIndex = function(idx) {
        const order = ordersCache[idx];
        if (!order) return;
        document.getElementById("fb-seller-id").value = order.seller_id || "";
        document.getElementById("fb-order-id").value = order.id || "";
        document.getElementById("fb-comment").value = "";
        document.getElementById("fbMsg").textContent = "";
        document.getElementById("feedback-modal").style.display = "flex";
    };

    window.submitOrderFeedback = async function() {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) return;

        const sellerId = document.getElementById("fb-seller-id").value || null;
        const orderId = document.getElementById("fb-order-id").value || null;
        const type = document.getElementById("fb-type").value;
        const comment = document.getElementById("fb-comment").value.trim();
        const msg = document.getElementById("fbMsg");

        if (!comment) {
            msg.style.color = "#ef4444";
            msg.textContent = "Ju lutem shkruani një koment.";
            return;
        }

        msg.style.color = "#fff";
        msg.textContent = "Duke dërguar...";

        const { error } = await supabase
            .from("feedback")
            .insert({
                seller_id: sellerId,
                buyer_id: user.id,
                order_id: orderId,
                type: type,
                comment: comment,
                rating: type === "positive" ? 5 : (type === "neutral" ? 3 : 1)
            });

        if (error) {
            msg.style.color = "#ef4444";
            msg.textContent = "Gabim: " + error.message;
            return;
        }

        msg.style.color = "#22c55e";
        msg.textContent = "Vlerësimi u dërgua me sukses!";
        setTimeout(() => {
            document.getElementById("feedback-modal").style.display = "none";
            window.location.reload();
        }, 1500);
    };

    async function loadMessageCount() {
        const { data: { user }, error } = await supabase.auth.getUser();
        if (error || !user) return;

        const { data: buyerChats } = await supabase.from("conversations").select("unread_buyer").eq("buyer_id", user.id);
        const { data: sellerChats } = await supabase.from("conversations").select("unread_seller").eq("seller_id", user.id);

        let total = 0;
        buyerChats?.forEach(c => { total += c.unread_buyer || 0; });
        sellerChats?.forEach(c => { total += c.unread_seller || 0; });

        const countEl = document.getElementById("messageCount");
        if (countEl) countEl.innerText = total;
    }

    function initPage() {
        loadOrders();
        loadMessageCount();
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initPage);
    } else {
        initPage();
    }
</script>

</body>
</html>
